  ],
  "scenario": "Build duration and retained artifacts are increasing without a measured explanation. Establish comparable observations and a bounded optimization/retention decision.",
  "role": "Pipeline operations engineer",
  "outcome": "Improve pipeline performance and retention.",
  "checkpoints": [
    {
      "id": "CP1",
      "title": "Measure a real build baseline",
      "commands": "$sw=[Diagnostics.Stopwatch]::StartNew();dotnet build (Join-Path $RepoRoot 'samples/DevOps.slnx') --configuration Release;$sw.Stop()\n if($LASTEXITCODE -ne 0){throw 'Baseline build failed.'}\n [ordered]@{elapsedMilliseconds=$sw.ElapsedMilliseconds;configuration='Release';success=$true}|ConvertTo-Json|Set-Content (Join-Path $WorkRoot 'baseline.json')\n",
      "expected": "A measured successful build establishes one local baseline.",
      "positive": "$b=Get-Content (Join-Path $WorkRoot 'baseline.json') -Raw|ConvertFrom-Json\n if(-not $b.success -or $b.elapsedMilliseconds -le 0){throw 'Invalid baseline measurement.'}\n",
      "negative": "$b=Get-Content (Join-Path $WorkRoot 'baseline.json') -Raw|ConvertFrom-Json\n if($b.configuration -ne 'Release'){throw 'Benchmark configuration mismatch.'}\n",
      "validate": "$b=Get-Content (Join-Path $WorkRoot 'baseline.json') -Raw|ConvertFrom-Json\n if(-not $b.success -or $b.elapsedMilliseconds -le 0){throw 'Invalid baseline measurement.'}\n\n$b=Get-Content (Join-Path $WorkRoot 'baseline.json') -Raw|ConvertFrom-Json\n if($b.configuration -ne 'Release'){throw 'Benchmark configuration mismatch.'}\n",
      "evidence": "Elapsed time and machine/tool context; one run is not a performance guarantee.",
      "fix": "Fix failures before benchmarking and compare the same configuration and warm/cold conditions.",
      "coverage": [
        {
          "objectiveId": "D3.6.1",
          "level": "explained",
          "reference": "Review pipeline health/retry classification; synthetic reports do not configure a live alert."
        }
      ]
    },
    {
      "id": "CP2",
      "title": "Measure an incremental build without restoring again",
      "commands": "$sw=[Diagnostics.Stopwatch]::StartNew();dotnet build (Join-Path $RepoRoot 'samples/DevOps.slnx') --configuration Release --no-restore;$sw.Stop()\n if($LASTEXITCODE -ne 0){throw 'Incremental build failed.'}\n [ordered]@{elapsedMilliseconds=$sw.ElapsedMilliseconds;restoreSkipped=$true;claim='single local observation'}|ConvertTo-Json|Set-Content (Join-Path $WorkRoot 'incremental.json')\n",
      "expected": "A second measurement isolates avoided restore work without promising a speedup.",
      "positive": "$m=Get-Content (Join-Path $WorkRoot 'incremental.json') -Raw|ConvertFrom-Json\n if(-not $m.restoreSkipped -or $m.elapsedMilliseconds -le 0){throw 'Incremental measurement missing.'}\n",
      "negative": "$m=Get-Content (Join-Path $WorkRoot 'incremental.json') -Raw|ConvertFrom-Json\n if($m.claim -match 'guaranteed faster'){throw 'Unsupported optimization claim.'}\n",
      "validate": "$m=Get-Content (Join-Path $WorkRoot 'incremental.json') -Raw|ConvertFrom-Json\n if(-not $m.restoreSkipped -or $m.elapsedMilliseconds -le 0){throw 'Incremental measurement missing.'}\n\n$m=Get-Content (Join-Path $WorkRoot 'incremental.json') -Raw|ConvertFrom-Json\n if($m.claim -match 'guaranteed faster'){throw 'Unsupported optimization claim.'}\n",
      "evidence": "Both observations and controlled differences.",
      "fix": "Retain locked restore in a prior job and key caches by lock files, SDK, OS, and architecture.",
      "coverage": []
    },
    {
      "id": "CP3",
      "title": "Measure dependency cache invalidation and critical path",
      "commands": "$lock=Get-ChildItem (Join-Path $RepoRoot 'samples') -Filter packages.lock.json -Recurse|Where-Object FullName -NotMatch '[\\/](bin|obj)[\\/]'|Select-Object -First 1\n$copy=Join-Path $WorkRoot 'cache-input.lock.json';Copy-Item $lock.FullName $copy\n$sdk=dotnet --version;$before=\"$([Environment]::OSVersion.Platform)-$sdk-$((Get-FileHash $copy).Hash)\"\nAdd-Content $copy ' '\n$after=\"$([Environment]::OSVersion.Platform)-$sdk-$((Get-FileHash $copy).Hash)\"\n$jobs=@(@{name='build';seconds=40;needs=@()},@{name='test';seconds=30;needs=@('build')},@{name='lint';seconds=20;needs=@('build')})\n[ordered]@{before=$before;after=$after;invalidated=($before -cne $after);serialSeconds=90;criticalPathSeconds=70;maximumParallel=2}|ConvertTo-Json|Set-Content (Join-Path $WorkRoot 'cache-analysis.json')\nCopy-Item (Join-Path $LabRoot 'artifacts/optimized-ci.yml') (Join-Path $WorkRoot 'optimized-ci.yml')\n",
      "expected": "A changed copied lock file invalidates its SDK/OS/hash key; the explicit synthetic DAG has70seconds critical path versus90seconds serial work.",
      "positive": "$r=Get-Content (Join-Path $WorkRoot 'cache-analysis.json') -Raw|ConvertFrom-Json\nif(-not $r.invalidated -or $r.criticalPathSeconds -ne 70){throw 'Cache/critical-path analysis incorrect.'}\n",
      "negative": "$r=Get-Content (Join-Path $WorkRoot 'cache-analysis.json') -Raw|ConvertFrom-Json\nif($r.before -ceq $r.after -or $r.maximumParallel -gt 2){throw 'Invalid cache reuse or unbounded workers.'}\n",
      "validate": "$r=Get-Content (Join-Path $WorkRoot 'cache-analysis.json') -Raw|ConvertFrom-Json\nif(-not $r.invalidated -or $r.criticalPathSeconds -ne 70){throw 'Cache/critical-path analysis incorrect.'}\n\n$r=Get-Content (Join-Path $WorkRoot 'cache-analysis.json') -Raw|ConvertFrom-Json\nif($r.before -ceq $r.after -or $r.maximumParallel -gt 2){throw 'Invalid cache reuse or unbounded workers.'}\n",
      "evidence": "Changed input hashes, before/after cache keys and explicitly synthetic timing assumptions.",
      "fix": "Never reuse a cache key after dependency inputs change. Distinguish elapsed critical-path time from total compute minutes.",
      "coverage": [
        {
          "objectiveId": "D1.2.6",
          "level": "practiced",
          "reference": "Compute the explicit synthetic DAG critical path and compare it with serial execution."
        },
        {
          "objectiveId": "D3.6.2",
          "level": "practiced",
          "reference": "Change a real lockfile fixture and prove the cache key changes while the original lockfile stays untouched."
        },
        {
          "objectiveId": "D3.6.3",
          "level": "practiced",
          "reference": "Calculate bounded two-way parallelism for the supplied dependency graph; no hosted timing benchmark is claimed."
        }
      ]
    },
    {
      "id": "CP4",
      "title": "Enforce retention against owned artifact fixtures",
      "commands": "$retention=[ordered]@{prLogsDays=7;releaseArtifactsDays=30;securityEvidenceDays=90;keepLastGoodRelease=$true;deletePublishedPackagesAutomatically=$false}\n$retention|ConvertTo-Json|Set-Content (Join-Path $WorkRoot 'retention.json')\n$root=Join-Path $WorkRoot 'artifact-fixtures';New-Item -ItemType Directory -Force $root|Out-Null\n$items=@(@{name='expired-pr.log';ageDays=20;kind='pr';keep=$false},@{name='last-good.zip';ageDays=60;kind='release';keep=$true},@{name='current.zip';ageDays=1;kind='release';keep=$false})\nforeach($item in $items){Set-Content (Join-Path $root $item.name) \"synthetic artifact $($item.name)\"}\n$deleted=@();foreach($item in $items){$limit=if($item.kind -eq 'pr'){$retention.prLogsDays}else{$retention.releaseArtifactsDays};if(-not $item.keep -and $item.ageDays -gt $limit){Remove-Item -LiteralPath (Join-Path $root $item.name);$deleted+=$item.name}}\n[ordered]@{fixtureOnly=$true;deleted=$deleted;retained=@(Get-ChildItem $root -File|ForEach-Object Name)}|ConvertTo-Json|Set-Content (Join-Path $WorkRoot 'retention-result.json')\n",
      "expected": "Only the expired owned PR log is deleted; the last known-good and current release artifacts remain.",
      "positive": "$r=Get-Content (Join-Path $WorkRoot 'retention-result.json') -Raw|ConvertFrom-Json\nif('last-good.zip' -notin $r.retained -or -not (Test-Path (Join-Path $WorkRoot 'artifact-fixtures/current.zip'))){throw 'Recovery/current artifact lost.'}\n",
      "negative": "if(Test-Path (Join-Path $WorkRoot 'artifact-fixtures/expired-pr.log')){throw 'Expired fixture survived retention.'}\n$r=Get-Content (Join-Path $WorkRoot 'retention.json') -Raw|ConvertFrom-Json\nif(-not $r.keepLastGoodRelease){throw 'Rollback retention guard disabled.'}\n",
      "validate": "$r=Get-Content (Join-Path $WorkRoot 'retention-result.json') -Raw|ConvertFrom-Json\nif('last-good.zip' -notin $r.retained -or -not (Test-Path (Join-Path $WorkRoot 'artifact-fixtures/current.zip'))){throw 'Recovery/current artifact lost.'}\n\nif(Test-Path (Join-Path $WorkRoot 'artifact-fixtures/expired-pr.log')){throw 'Expired fixture survived retention.'}\n$r=Get-Content (Join-Path $WorkRoot 'retention.json') -Raw|ConvertFrom-Json\nif(-not $r.keepLastGoodRelease){throw 'Rollback retention guard disabled.'}\n",
      "evidence": "Fixture age/ownership inputs and retained/deleted inventory.",
      "fix": "Real provider retention needs reviewed ownership and consumer dependencies. This fixture proves selection and last-good exclusion before remote deletion.",
      "coverage": [
        {
          "objectiveId": "D3.6.4",
          "level": "practiced",
          "reference": "Apply retention selection to owned local fixture artifacts and prove baseline/current survival."
        }
      ]
    },
    {
      "id": "CP5",
      "title": "Convert a classic task fixture to YAML and prove parity",
      "commands": "$classic=[ordered]@{fixtureOnly=$true;tasks=@(@{name='restore';command='dotnet restore samples/DevOps.slnx --locked-mode'},@{name='test';command='dotnet test samples/DevOps.slnx --configuration Release --no-restore'},@{name='publish';command='dotnet publish samples/DevOps.Api/DevOps.Api.csproj --configuration Release'});externalChecks=@('environment approval','service-connection authorization')}\n$classic|ConvertTo-Json -Depth 8|Set-Content (Join-Path $WorkRoot 'classic-pipeline.json')\n@'\nimport json,sys,yaml\nfrom pathlib import Path\nr=Path(sys.argv[1]);old=json.loads((r/'classic-pipeline.json').read_text());new={'trigger':'none','pool':{'vmImage':'ubuntu-24.04'},'steps':[{'script':t['command'],'displayName':t['name']} for t in old['tasks']]}\n(r/'migrated-pipeline.yml').write_text(yaml.safe_dump(new,sort_keys=False))\nback=yaml.safe_load((r/'migrated-pipeline.yml').read_text())\nassert [s['script'] for s in back['steps']]==[t['command'] for t in old['tasks']]\nprint(json.dumps({'taskOrder':[s['displayName'] for s in back['steps']],'parity':True,'externalChecksStillRequired':old['externalChecks']}))\n'@|python - $WorkRoot|Set-Content (Join-Path $WorkRoot 'migration-result.json')\nif($LASTEXITCODE -ne 0){throw 'Task migration parity failed.'}\n",
      "expected": "A real YAML file retains task commands/order and lists protected-resource checks that task conversion does not migrate.",
      "positive": "$r=Get-Content (Join-Path $WorkRoot 'migration-result.json') -Raw|ConvertFrom-Json\nif(-not $r.parity -or ($r.taskOrder -join ',') -ne 'restore,test,publish'){throw 'Migration changed task semantics.'}\n",
      "negative": "$r=Get-Content (Join-Path $WorkRoot 'migration-result.json') -Raw|ConvertFrom-Json\nif('environment approval' -notin $r.externalChecksStillRequired){throw 'Migration omitted resource approvals.'}\n",
      "validate": "$r=Get-Content (Join-Path $WorkRoot 'migration-result.json') -Raw|ConvertFrom-Json\nif(-not $r.parity -or ($r.taskOrder -join ',') -ne 'restore,test,publish'){throw 'Migration changed task semantics.'}\n\n$r=Get-Content (Join-Path $WorkRoot 'migration-result.json') -Raw|ConvertFrom-Json\nif('environment approval' -notin $r.externalChecksStillRequired){throw 'Migration omitted resource approvals.'}\n",
      "evidence": "Classic fixture, generated YAML, task parity and remaining external checks.",
      "fix": "This offline conversion does not authorize provider cutover. Compare nondeploying runs and preserve resource checks before disabling a classic trigger.",
      "coverage": [
        {
          "objectiveId": "D3.6.5",
          "level": "practiced",
          "reference": "Convert a classic-task fixture into parsed YAML and compare executable command order."
        }
      ]
    }
  ],
  "breakFix": {
    "trigger": "$r=Get-Content (Join-Path $WorkRoot 'retention.json') -Raw|ConvertFrom-Json;$r.keepLastGoodRelease=$false;$r|ConvertTo-Json|Set-Content (Join-Path $WorkRoot 'retention.json')\n",
    "diagnose": "Get-Content (Join-Path $WorkRoot 'retention.json')\n",
    "repair": "$r=Get-Content (Join-Path $WorkRoot 'retention.json') -Raw|ConvertFrom-Json;$r.keepLastGoodRelease=$true;$r|ConvertTo-Json|Set-Content (Join-Path $WorkRoot 'retention.json')\n",
    "assert": "$r=Get-Content (Join-Path $WorkRoot 'retention.json') -Raw|ConvertFrom-Json\nif(-not $r.keepLastGoodRelease -or $r.releaseArtifactsDays -lt $r.prLogsDays){throw 'AZ400-L19-FAULT'}\n",
    "expectedFailure": "AZ400-L19-FAULT"
  },
  "challenge": "Collect ten comparable runs, investigate flaky tests separately from infrastructure errors, and justify one cache or concurrency change with measured results.",
  "sources": [
    "https://learn.microsoft.com/en-us/azure/devops/pipelines/release/retention",
    "https://docs.github.com/en/actions/using-workflows/caching-dependencies-to-speed-up-workflows",
    "https://learn.microsoft.com/en-us/azure/devops/pipelines/migrate/from-classic-pipelines"
  ],
  "primer": "Critical-path time and total compute minutes differ. Cache keys must protect correctness; retention must preserve rollback artifacts and evidence, and YAML migration must retain external gates.\n\nOne timing observation can reveal a regression but cannot establish a reliable speedup. Compare repeated cold/warm builds under the same dependency inputs before optimizing. Categorize failures as infrastructure, dependency, test or deployment problems before adding retries; repeated test failures are not transient network errors.\n\nCache keys must change with dependencies, SDK and OS. Parallelism shortens a graph only where dependencies allow concurrent jobs; critical-path time differs from total compute consumption. The fixture calculates this distinction explicitly. Retention then deletes eligible local artifacts while preserving the current and last compatible release; never apply an unreviewed retention selector to published packages.",
