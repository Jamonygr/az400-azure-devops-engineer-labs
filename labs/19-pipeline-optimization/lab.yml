{
  "schemaVersion": "1.0.0",
  "id": "19",
  "slug": "19-pipeline-optimization",
  "title": "Improve pipeline performance and retention",
  "domain": "pipelines",
  "minutes": 120,
  "cost": "none",
  "platforms": [
