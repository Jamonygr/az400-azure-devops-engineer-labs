name: Locked dependency cache
on:
  push:
    branches: [main]
    paths: [samples/**, Directory.Build.props, global.json, .github/workflows/optimized-ci.yml]
  pull_request:
    paths: [samples/**, Directory.Build.props, global.json, .github/workflows/optimized-ci.yml]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: samples/**/packages.lock.json
      - run: dotnet restore samples/DevOps.slnx --locked-mode
      - run: dotnet test samples/DevOps.slnx --configuration Release --no-restore
