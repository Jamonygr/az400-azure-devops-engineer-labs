<text x="22" y="480" fill="#0c4a6e" font-family="sans-serif" font-weight="bold" font-size="16">Relationships</text>
<text x="22" y="507" fill="#0f172a" font-family="sans-serif" font-size="14.5">1. execution DAG</text>
<text x="392" y="507" fill="#0f172a" font-family="sans-serif" font-size="14.5">2. scoped cache lookup</text>
<text x="22" y="545" fill="#0f172a" font-family="sans-serif" font-size="14.5">3. restored dependencies</text>
<text x="392" y="545" fill="#0f172a" font-family="sans-serif" font-size="14.5">4. controlled concurrency</text>
<text x="22" y="583" fill="#0f172a" font-family="sans-serif" font-size="14.5">5. versioned output</text>
<text x="392" y="583" fill="#0f172a" font-family="sans-serif" font-size="14.5">6. recovery / evidence lifetime</text>
