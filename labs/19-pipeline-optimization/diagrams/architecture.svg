<svg xmlns="http://www.w3.org/2000/svg" width="760" height="682" viewBox="0 0 760 682" role="img" aria-labelledby="title desc"><title id="title">Lab 19: Measured CI execution, cache, and retention controls</title><desc id="desc">Pipeline YAML defines bounded job concurrency, while SDK/lock/OS-aware cache keys constrain dependency reuse. Real local build measurements feed the performance review, and artifacts/logs receive distinct retention decisions. The last compatible release and security evidence remain recoverable; the diagram represents the intended CI design rather than an unmeasured speedup guarantee. Relationships: Versioned pipeline YAML to Bounded CI worker jobs: execution DAG; Bounded CI worker jobs to SDK + lock-keyed NuGet cache: scoped cache lookup; SDK + lock-keyed NuGet cache to Build / test execution: restored dependencies; Bounded CI worker jobs to Build / test execution: controlled concurrency; Build / test execution to Release artifacts + logs: versioned output; Release artifacts + logs to Metrics / retention policy: recovery / evidence lifetime; Build / test execution to Metrics / retention policy: duration and failure data</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto-start-reverse"><path d="M0,0 L0,8 L8,4 z" fill="#0369a1"/></marker></defs>
<rect width="760" height="682" rx="16" fill="#f0f9ff"/>
<text x="22" y="30" fill="#0c4a6e" font-size="19" font-weight="bold" font-family="sans-serif">Lab 19: Measured CI execution, cache, and retention controls</text>
<path d="M210,160.0 H285" fill="none" stroke="#0369a1" stroke-width="2" marker-end="url(#arrow)" data-from="yaml" data-to="worker"><title>execution DAG</title></path>
<circle cx="247.5" cy="160.0" r="11" fill="#ffffff" stroke="#0369a1" stroke-width="1.5"/><text x="247.5" y="164.5" text-anchor="middle" fill="#075985" font-size="13" font-weight="bold" font-family="sans-serif">1</text>
<path d="M475,160.0 H550" fill="none" stroke="#0369a1" stroke-width="2" marker-end="url(#arrow)" data-from="worker" data-to="cache"><title>scoped cache lookup</title></path>
<circle cx="512.5" cy="160.0" r="11" fill="#ffffff" stroke="#0369a1" stroke-width="1.5"/><text x="512.5" y="164.5" text-anchor="middle" fill="#075985" font-size="13" font-weight="bold" font-family="sans-serif">2</text>
<path d="M645.0,220 V330" fill="none" stroke="#0369a1" stroke-width="2" marker-end="url(#arrow)" data-from="cache" data-to="tests"><title>restored dependencies</title></path>
<circle cx="645.0" cy="275.0" r="11" fill="#ffffff" stroke="#0369a1" stroke-width="1.5"/><text x="645.0" y="279.5" text-anchor="middle" fill="#075985" font-size="13" font-weight="bold" font-family="sans-serif">3</text>
<path d="M380.0,220 V261.0 H645.0 V330" fill="none" stroke="#0369a1" stroke-width="2" marker-end="url(#arrow)" data-from="worker" data-to="tests"><title>controlled concurrency</title></path>
<circle cx="512.5" cy="261.0" r="11" fill="#ffffff" stroke="#0369a1" stroke-width="1.5"/><text x="512.5" y="265.5" text-anchor="middle" fill="#075985" font-size="13" font-weight="bold" font-family="sans-serif">4</text>
<path d="M550,390.0 H475" fill="none" stroke="#0369a1" stroke-width="2" marker-end="url(#arrow)" data-from="tests" data-to="artifacts"><title>versioned output</title></path>
<circle cx="512.5" cy="390.0" r="11" fill="#ffffff" stroke="#0369a1" stroke-width="1.5"/><text x="512.5" y="394.5" text-anchor="middle" fill="#075985" font-size="13" font-weight="bold" font-family="sans-serif">5</text>
<path d="M285,390.0 H210" fill="none" stroke="#0369a1" stroke-width="2" marker-end="url(#arrow)" data-from="artifacts" data-to="policy"><title>recovery / evidence lifetime</title></path>
<circle cx="247.5" cy="390.0" r="11" fill="#ffffff" stroke="#0369a1" stroke-width="1.5"/><text x="247.5" y="394.5" text-anchor="middle" fill="#075985" font-size="13" font-weight="bold" font-family="sans-serif">6</text>
<path d="M550,390.0 H210" fill="none" stroke="#0369a1" stroke-width="2" marker-end="url(#arrow)" data-from="tests" data-to="policy"><title>duration and failure data</title></path>
<circle cx="380.0" cy="390.0" r="11" fill="#ffffff" stroke="#0369a1" stroke-width="1.5"/><text x="380.0" y="394.5" text-anchor="middle" fill="#075985" font-size="13" font-weight="bold" font-family="sans-serif">7</text>
