    {
      "id": "L19-Q001",
      "checkpointId": "CP1",
      "objectiveIds": [
        "D1.2.6",
        "D3.6.1"
      ],
      "difficulty": "foundational",
      "question": "The team proposes caching dependencies but has never measured restore, build or test durations. What should happen first?",
      "options": [
        {
          "key": "A",
          "text": "Buy more parallel capacity immediately",
          "rationale": "Extra capacity may not address the actual bottleneck without baseline timing evidence."
        },
        {
          "key": "B",
          "text": "Record a reproducible timing baseline",
          "rationale": "Measurements identify expensive stages and support comparison after a targeted optimization."
        },
        {
          "key": "C",
          "text": "Cache every workspace directory",
          "rationale": "Unmeasured broad caching can add overhead and preserve unnecessary mutable state."
        },
        {
          "key": "D",
          "text": "Remove tests to improve duration",
          "rationale": "Removing required validation changes quality rather than proving a safe performance improvement."
        }
      ],
      "correctAnswers": [
        "B"
      ],
      "explanation": "Extra capacity may not address the actual bottleneck without baseline timing evidence. Measurements identify expensive stages and support comparison after a targeted optimization. Unmeasured broad caching can add overhead and preserve unnecessary mutable state. Removing required validation changes quality rather than proving a safe performance improvement.",
      "sourceIds": [
        "S2"
      ]
    },
    {
