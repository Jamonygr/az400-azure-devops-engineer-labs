      "objectiveIds": [
        "D1.2.6",
        "D3.6.1"
      ],
      "difficulty": "foundational",
      "question": "A build takes 90 seconds restoring packages and 8 seconds compiling unchanged source. Which optimization is the most directly targeted starting point?",
      "options": [
        {
          "key": "A",
          "text": "Reformat the YAML files",
          "rationale": "Formatting alone does not address the observed dependency restore duration."
        },
        {
          "key": "B",
          "text": "Evaluate dependency caching",
          "rationale": "Restore dominates the measured cost, making reusable dependency downloads a reasonable candidate."
        },
        {
          "key": "C",
          "text": "Parallelize deployment approvals",
          "rationale": "Approval scheduling does not reduce the measured package restore bottleneck."
        },
        {
          "key": "D",
          "text": "Increase release artifact retention",
          "rationale": "Retention affects stored release evidence rather than dependency download execution time."
        }
      ],
      "correctAnswers": [
        "B"
      ],
      "explanation": "Formatting alone does not address the observed dependency restore duration. Restore dominates the measured cost, making reusable dependency downloads a reasonable candidate. Approval scheduling does not reduce the measured package restore bottleneck. Retention affects stored release evidence rather than dependency download execution time.",
      "sourceIds": [
        "S2"
      ]
    },
