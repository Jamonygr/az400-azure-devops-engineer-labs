          "text": "Compare equivalent cache and dependency conditions",
          "rationale": "Different dependency states can explain timing changes unrelated to the optimized build logic."
        },
        {
          "key": "D",
          "text": "Compare any fastest warm run to slowest cold run",
          "rationale": "Selecting unequal extremes overstates improvement and obscures the changed experimental conditions."
        }
