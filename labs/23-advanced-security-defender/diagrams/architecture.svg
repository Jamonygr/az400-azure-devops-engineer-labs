<svg xmlns="http://www.w3.org/2000/svg" width="760" height="650" viewBox="0 0 760 650" role="img" aria-labelledby="title desc"><title id="title">Lab 23: Security entitlement and scoped Defender integration</title><desc id="desc">GitHub capability metadata and subscription Defender plan reads inform an entitlement review; they do not enable a paid product. Connector proposals select only the owned repository/project and need a security/billing owner. A synthetic finding exercises triage ownership while real Advanced Security activation and Defender correlation remain explicitly gated integrations. Relationships: GitHub security capabilities to Entitlement / billing owner: eligible feature review; Entitlement / billing owner to Microsoft Defender plan state: separate paid authorization; GitHub security capabilities to Scoped DevOps connector proposal: selected repository signals; Azure DevOps Advanced Security to Scoped DevOps connector proposal: selected project signals; Scoped DevOps connector proposal to Microsoft Defender plan state: separate approved connection; Microsoft Defender plan state to Finding owner + triage evidence: correlated findings</desc>
