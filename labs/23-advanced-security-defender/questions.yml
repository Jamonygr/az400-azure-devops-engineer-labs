    {
      "id": "L23-Q001",
      "checkpointId": "CP2",
      "objectiveIds": [
        "D4.3.3"
      ],
      "difficulty": "foundational",
      "question": "An Azure Repos security proposal estimates licenses by everyone who can read the repository. Which population should determine the active-committer estimate?",
      "options": [
        {
          "key": "A",
          "text": "Only developers who opened pull requests this month",
          "rationale": "The billing window and push-based definition extend beyond monthly pull request authors."
        },
        {
          "key": "B",
          "text": "Only users who can dismiss security alerts",
          "rationale": "Alert administration permissions do not define the billed contributor population."
        },
        {
          "key": "C",
          "text": "Unique qualifying committers represented in pushes during the preceding 90 days",
          "rationale": "Billing counts qualifying active committers, rather than all readers or repository members."
        },
        {
          "key": "D",
          "text": "All users with repository read permission",
          "rationale": "Read permission alone does not make a person an active committer."
        }
      ],
      "correctAnswers": [
        "C"
      ],
      "explanation": "The billing window and push-based definition extend beyond monthly pull request authors. Alert administration permissions do not define the billed contributor population. Billing counts qualifying active committers, rather than all readers or repository members. Read permission alone does not make a person an active committer.",
      "sourceIds": [
        "S1"
      ]
    },
