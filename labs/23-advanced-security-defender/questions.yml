          "text": "30",
          "rationale": "Choosing the larger repository count discards ten contributors unique to the other repository."
        },
        {
          "key": "B",
          "text": "10",
          "rationale": "Counting only the overlap omits all contributors unique to either repository."
        },
        {
          "key": "C",
          "text": "40",
          "rationale": "Subscription-level deduplication counts the ten overlapping identities once, so 20 plus 30 minus 10 equals 40."
        },
        {
          "key": "D",
          "text": "50",
          "rationale": "Adding repository totals without removing overlap double-counts ten identities."
        }
      ],
      "correctAnswers": [
        "C"
