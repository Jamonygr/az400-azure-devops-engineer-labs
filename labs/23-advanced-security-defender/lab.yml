{
  "schemaVersion": "1.0.0",
  "id": "23",
  "slug": "23-advanced-security-defender",
  "title": "Connect advanced security and Defender",
  "domain": "security",
  "minutes": 120,
  "cost": "paid features gated; core inspection only",
  "platforms": [
    "local",
    "github",
    "azure-devops",
    "azure"
  ],
  "objectives": [
    "D4.3.2",
    "D4.3.3",
    "D4.3.4"
  ],
  "scenario": "Security products and Defender connectors are proposed without entitlement or scope review. Establish explicit license, billing, connector, and triage boundaries.",
  "role": "Security platform owner",
  "outcome": "Connect advanced security and Defender.",
  "checkpoints": [
    {
      "id": "CP1",
      "title": "Inspect repository security capability metadata",
      "commands": "gh api \"repos/$GhRepo\" --jq '{name:.full_name,visibility:.visibility,security:.security_and_analysis}'|Set-Content (Join-Path $WorkRoot 'security-capabilities.json')\n",
      "expected": "Repository visibility and exposed security feature capabilities are recorded.",
      "positive": "$r=Get-Content (Join-Path $WorkRoot 'security-capabilities.json') -Raw|ConvertFrom-Json\n if($r.name -ne $GhRepo){throw 'Security review targeted another repository.'}\n",
      "negative": "$r=Get-Content (Join-Path $WorkRoot 'security-capabilities.json') -Raw|ConvertFrom-Json\n if($r.visibility -notin @('public','private','internal')){throw 'Unknown capability/visibility context.'}\n",
      "validate": "$r=Get-Content (Join-Path $WorkRoot 'security-capabilities.json') -Raw|ConvertFrom-Json\n if($r.name -ne $GhRepo){throw 'Security review targeted another repository.'}\n\n$r=Get-Content (Join-Path $WorkRoot 'security-capabilities.json') -Raw|ConvertFrom-Json\n if($r.visibility -notin @('public','private','internal')){throw 'Unknown capability/visibility context.'}\n",
      "evidence": "Feature metadata and plan/license constraints.",
      "fix": "Capabilities depend on repository ownership/visibility and account licensing; unavailable access is a gate.",
      "coverage": []
    },
    {
      "id": "CP2",
      "title": "Prepare an explicit Advanced Security entitlement review",
      "commands": "$entitlement=[ordered]@{github='public-repository supported features; verify current licensing';azureDevOps='GitHub Advanced Security for Azure DevOps requires eligible paid entitlement';approvedPaidActivation=$false;billingOwnerApprovalRequired=$true}\n $entitlement|ConvertTo-Json|Set-Content (Join-Path $WorkRoot 'entitlements.json')\n",
      "expected": "Paid activation remains blocked until an authorized billing owner approves it.",
      "positive": "$e=Get-Content (Join-Path $WorkRoot 'entitlements.json') -Raw|ConvertFrom-Json\n if(-not $e.billingOwnerApprovalRequired){throw 'Paid entitlement approval absent.'}\n",
      "negative": "$e=Get-Content (Join-Path $WorkRoot 'entitlements.json') -Raw|ConvertFrom-Json\n if($e.approvedPaidActivation){throw 'This offline review grants no paid entitlement.'}\n",
      "validate": "$e=Get-Content (Join-Path $WorkRoot 'entitlements.json') -Raw|ConvertFrom-Json\n if(-not $e.billingOwnerApprovalRequired){throw 'Paid entitlement approval absent.'}\n\n$e=Get-Content (Join-Path $WorkRoot 'entitlements.json') -Raw|ConvertFrom-Json\n if($e.approvedPaidActivation){throw 'This offline review grants no paid entitlement.'}\n",
      "evidence": "Product feature/entitlement matrix dated to the current review.",
      "fix": "Check current product names, pricing, and eligible repositories before enabling billable scanning.",
      "coverage": [
        {
          "objectiveId": "D4.3.3",
          "level": "explained",
          "reference": "Inspect existing GitHub/DevOps advanced-security eligibility and capabilities; paid enforcement is not exercised automatically."
        }
      ]
    },
    {
      "id": "CP3",
      "title": "Inspect Microsoft Defender pricing state without changing plans",
      "commands": "az security pricing list --subscription $SubscriptionId --query 'value[].{name:name,tier:pricingTier,subPlan:subPlan}' -o json|Set-Content (Join-Path $WorkRoot 'defender-plans.json')\n",
      "expected": "Current subscription plan state is read; no Defender plan is enabled.",
      "positive": "$p=@(Get-Content (Join-Path $WorkRoot 'defender-plans.json') -Raw|ConvertFrom-Json)\n if($p.Count -lt 1){throw 'No readable Defender pricing inventory.'}\n",
      "negative": "$p=@(Get-Content (Join-Path $WorkRoot 'defender-plans.json') -Raw|ConvertFrom-Json)\n if(@($p|Where-Object { $_.tier -notin @('Free','Standard') }).Count){throw 'Unknown Defender plan tier requires review.'}\n",
      "validate": "$p=@(Get-Content (Join-Path $WorkRoot 'defender-plans.json') -Raw|ConvertFrom-Json)\n if($p.Count -lt 1){throw 'No readable Defender pricing inventory.'}\n\n$p=@(Get-Content (Join-Path $WorkRoot 'defender-plans.json') -Raw|ConvertFrom-Json)\n if(@($p|Where-Object { $_.tier -notin @('Free','Standard') }).Count){throw 'Unknown Defender plan tier requires review.'}\n",
      "evidence": "Plan names/tier, with subscription identity redacted.",
      "fix": "Security Reader permission may be needed. Never call pricing create/update to bypass a missing entitlement.",
      "coverage": [
        {
          "objectiveId": "D4.3.2",
          "level": "explained",
          "reference": "Read available Defender context and document the explicit entitlement/connector prerequisites; no Defender plan is enabled."
        }
      ]
    },
    {
      "id": "CP4",
      "title": "Correlate and scope security finding fixtures",
      "commands": "$fixtures=@(\n @{id='gh-code-1';host='GitHub';scope=$GhRepo;tool='CodeQL';severity='high';reachable=$true},\n @{id='ado-dep-1';host='Azure DevOps';scope=$AdoProject;tool='dependency';severity='medium';reachable=$false},\n @{id='foreign-1';host='GitHub';scope='other-team/production';tool='secret';severity='critical';reachable=$true})\n$fixtures|ConvertTo-Json|Set-Content (Join-Path $WorkRoot 'security-findings.fixture.json')\n$owned=@($fixtures|Where-Object {($_.host -eq 'GitHub' -and $_.scope -eq $GhRepo) -or ($_.host -eq 'Azure DevOps' -and $_.scope -eq $AdoProject)})\n$owned|ConvertTo-Json|Set-Content (Join-Path $WorkRoot 'owned-findings.json')\n@{fixtureOnly=$true;input=$fixtures.Count;owned=$owned.Count;excluded=$fixtures.Count-$owned.Count;blocking=@($owned|Where-Object {$_.severity -eq 'high' -and $_.reachable}).Count}|ConvertTo-Json|Set-Content (Join-Path $WorkRoot 'finding-correlation.json')\n",
      "expected": "Two owned repository/project fixtures are correlated and one foreign finding is excluded; no organization connector is created.",
      "positive": "$r=Get-Content (Join-Path $WorkRoot 'finding-correlation.json') -Raw|ConvertFrom-Json\nif($r.owned -ne 2 -or $r.blocking -ne 1){throw 'Scoped correlation result incorrect.'}\n",
      "negative": "$r=@(Get-Content (Join-Path $WorkRoot 'owned-findings.json') -Raw|ConvertFrom-Json)\nif('foreign-1' -in $r.id -or @($r|Where-Object scope -notin @($GhRepo,$AdoProject)).Count){throw 'Correlation crossed the approved collection boundary.'}\n",
      "validate": "$r=Get-Content (Join-Path $WorkRoot 'finding-correlation.json') -Raw|ConvertFrom-Json\nif($r.owned -ne 2 -or $r.blocking -ne 1){throw 'Scoped correlation result incorrect.'}\n\n$r=@(Get-Content (Join-Path $WorkRoot 'owned-findings.json') -Raw|ConvertFrom-Json)\nif('foreign-1' -in $r.id -or @($r|Where-Object scope -notin @($GhRepo,$AdoProject)).Count){throw 'Correlation crossed the approved collection boundary.'}\n",
      "evidence": "Clearly labeled input fixture, owned results, exclusions and blocking count.",
      "fix": "Real Defender correlation needs a separately approved source connector. A source host, repository ID and alert ID are different identity dimensions.",
      "coverage": [
        {
          "objectiveId": "D4.3.4",
          "level": "practiced",
          "reference": "Correlate synthetic repository findings by exact owned scope and severity; a Defender connector is explained, not configured."
        }
      ]
    },
    {
      "id": "CP5",
      "title": "Triage a synthetic finding with an evidence-based decision",
      "commands": "$finding=[ordered]@{id='training-codeql-001';severity='high';reachable=$true;owner='sample-maintainer';action='fix before release';dismissed=$false;evidence='request input reaches unsafe sink in synthetic example';falsePositive=$false}\n $finding|ConvertTo-Json|Set-Content (Join-Path $WorkRoot 'triage.json')\n\n$r=@(Get-Content (Join-Path $WorkRoot 'owned-findings.json') -Raw|ConvertFrom-Json)\n$decisions=@($r|ForEach-Object {@{id=$_.id;action=$(if($_.reachable -and $_.severity -in @('high','critical')){'block-and-remediate'}else{'investigate'});owner='sample-maintainer'}})\n$decisions|ConvertTo-Json|Set-Content (Join-Path $WorkRoot 'triage-decisions.json')\n",
      "expected": "A reachable high finding blocks release and has a named remediation owner.",
      "positive": "$f=Get-Content (Join-Path $WorkRoot 'triage.json') -Raw|ConvertFrom-Json\n if($f.action -ne 'fix before release' -or -not $f.reachable){throw 'Triage decision inconsistent with evidence.'}\n\n$d=@(Get-Content (Join-Path $WorkRoot 'triage-decisions.json') -Raw|ConvertFrom-Json)\nif(@($d|Where-Object action -eq 'block-and-remediate').Count -ne 1){throw 'Reachable high finding did not block release.'}\n",
      "negative": "$f=Get-Content (Join-Path $WorkRoot 'triage.json') -Raw|ConvertFrom-Json\n if($f.dismissed -or $f.falsePositive){throw 'Synthetic reachable finding cannot be dismissed without contrary evidence.'}\n",
      "validate": "$f=Get-Content (Join-Path $WorkRoot 'triage.json') -Raw|ConvertFrom-Json\n if($f.action -ne 'fix before release' -or -not $f.reachable){throw 'Triage decision inconsistent with evidence.'}\n\n$d=@(Get-Content (Join-Path $WorkRoot 'triage-decisions.json') -Raw|ConvertFrom-Json)\nif(@($d|Where-Object action -eq 'block-and-remediate').Count -ne 1){throw 'Reachable high finding did not block release.'}\n\n$f=Get-Content (Join-Path $WorkRoot 'triage.json') -Raw|ConvertFrom-Json\n if($f.dismissed -or $f.falsePositive){throw 'Synthetic reachable finding cannot be dismissed without contrary evidence.'}\n",
      "evidence": "Finding ID, owner, reachability rationale, and remediation criteria.",
      "fix": "Record concrete false-positive evidence before dismissal; severity changes require traceable review.",
      "coverage": []
    }
  ],
  "breakFix": {
    "trigger": "$f=Get-Content (Join-Path $WorkRoot 'triage.json') -Raw|ConvertFrom-Json;$f.dismissed=$true;$f|ConvertTo-Json|Set-Content (Join-Path $WorkRoot 'triage.json')\n",
    "diagnose": "Get-Content (Join-Path $WorkRoot 'triage.json')\n",
    "repair": "$f=Get-Content (Join-Path $WorkRoot 'triage.json') -Raw|ConvertFrom-Json;$f.dismissed=$false;$f|ConvertTo-Json|Set-Content (Join-Path $WorkRoot 'triage.json')\n",
    "assert": "$f=Get-Content (Join-Path $WorkRoot 'triage.json') -Raw|ConvertFrom-Json\nif($f.reachable -and $f.severity -eq 'high' -and $f.dismissed){throw 'AZ400-L23-FAULT'}\n",
    "expectedFailure": "AZ400-L23-FAULT"
  },
  "challenge": "In a separately authorized licensed sandbox, enable the eligible security product, generate a harmless test alert, correlate it in Defender, and document connector removal and billing cleanup.",
  "sources": [
    "https://learn.microsoft.com/en-us/azure/defender-for-cloud/defender-for-devops-introduction",
    "https://learn.microsoft.com/en-us/azure/devops/repos/security/github-advanced-security",
    "https://docs.github.com/en/code-security/getting-started/github-security-features"
  ],
  "primer": "Advanced security capabilities vary with visibility and entitlement. Defender integration does not justify organization-wide collection or subscription billing changes from a repository lab.\n\nAdvanced Security and Defender require visibility, product entitlement and owner-authorized connector scope. Reading a plan state does not enable a scanner, and enabling a billable plan is not a harmless repository default. Keep paid capability decisions outside automatic bootstrap.\n\nThe observable local exercise correlates findings using exact repository ownership and applies an explicit severity/reachability/false-positive decision. A foreign critical finding is excluded from this run rather than dismissed globally. The provider reads and connector design remain explained coverage; they do not prove a live Defender for DevOps connection or paid GitHub enforcement.",
