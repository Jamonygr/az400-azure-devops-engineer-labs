trigger:
  branches:
    include: [main]
pr:
  branches:
    include: [main]
pool:
  vmImage: ubuntu-24.04
steps:
  - checkout: self
    persistCredentials: false
  - task: UseDotNet@2
    displayName: Install SDK pinned in global.json
    inputs:
      packageType: sdk
      useGlobalJson: true
  - pwsh: ./samples/Build-Release.ps1 -Revision $env:SOURCE_REVISION -OutputPath '$(Build.ArtifactStagingDirectory)/release'
    displayName: Test, enforce coverage, and build immutable release
    env:
      SOURCE_REVISION: $(Build.SourceVersion)
  - task: PublishTestResults@2
    condition: succeededOrFailed()
    inputs:
      testResultsFormat: VSTest
      testResultsFiles: $(Build.ArtifactStagingDirectory)/release/test-results/**/*.trx
      failTaskOnFailedTests: true
  - task: PublishCodeCoverageResults@2
    inputs:
      summaryFileLocation: $(Build.ArtifactStagingDirectory)/release/test-results/**/coverage.cobertura.xml
      failIfCoverageEmpty: true
  - publish: $(Build.ArtifactStagingDirectory)/release
    artifact: todo-api
