    {
      "id": "CP3",
      "title": "Publish a CI pipeline and dormant deployment contract",
      "commands": "$p=Join-Path $WorkRoot 'capstone'\npython (Join-Path $RepoRoot 'tools/package_capstone.py') --platform azure-devops --destination $p\nif($LASTEXITCODE -ne 0){throw 'Self-contained capstone packaging failed.'}\n git -C $p add .;$staged=@(git -C $p diff --cached --name-only)\nif($staged.Count -gt 0){git -C $p commit -m \"[$RunId] Capstone CI and deployment review\"}else{Write-Output 'Reviewed files already committed; reusing the current source revision.'};git -C $p branch -M main;git -C $p push -u origin main\n (git -C $p rev-parse HEAD)|Set-Content (Join-Path $WorkRoot 'capstone-sha.txt')\n\n$coreSha=(Get-Content (Join-Path $WorkRoot 'capstone-sha.txt')).Trim()\n$coreCi=Join-Path $p 'azure-pipelines.yml'\n$coreManifest=git -C $p show \"${coreSha}:deployment/package-manifest.json\"|ConvertFrom-Json\nif($coreManifest.releaseActivated){throw 'The initial core source must keep release activation dormant.'}\n@{sourceRevision=$coreSha;ciPath='azure-pipelines.yml';ciSha256=(Get-FileHash -LiteralPath $coreCi -Algorithm SHA256).Hash;ciBlob=(git -C $p rev-parse \"${coreSha}:azure-pipelines.yml\").Trim();releaseActivated=$false}|ConvertTo-Json|Set-Content (Join-Path $WorkRoot 'core-publication.json')\n",
      "expected": "The reviewed revision contains CI and an unregistered cloud deployment template. Historical CI-only source revision and CI file hashes remain independently inspectable after the separate protected release activation.",
      "positive": "$t=Get-Content (Join-Path $WorkRoot 'capstone/azure-pipelines.yml') -Raw\n if($t -notmatch 'dotnet|DotNetCoreCLI'){throw 'Capstone build tasks absent.'}\n$m=Get-Content (Join-Path $WorkRoot 'capstone/deployment/package-manifest.json') -Raw|ConvertFrom-Json\nif($m.releaseActivated -or -not (Test-Path (Join-Path $WorkRoot 'capstone/deployment/scripts/Verify-Release.ps1'))){throw 'Default package must be complete and keep release activation explicit.'}\n",
      "negative": "$t=Get-Content (Join-Path $WorkRoot 'capstone/azure-pipelines.yml') -Raw\n if($t -match 'AzureCLI@|az deployment|azureSubscription:'){throw 'CI publication must not activate cloud deployment.'}\n",
      "validate": "$t=Get-Content (Join-Path $WorkRoot 'capstone/azure-pipelines.yml') -Raw\n if($t -notmatch 'dotnet|DotNetCoreCLI'){throw 'Capstone build tasks absent.'}\n$m=Get-Content (Join-Path $WorkRoot 'capstone/deployment/package-manifest.json') -Raw|ConvertFrom-Json\nif(-not (Test-Path (Join-Path $WorkRoot 'capstone/deployment/scripts/Verify-Release.ps1'))){throw 'The package must include its complete release verification dependency.'}\n\n$t=Get-Content (Join-Path $WorkRoot 'capstone/azure-pipelines.yml') -Raw\n if($t -match 'AzureCLI@|az deployment|azureSubscription:'){throw 'CI publication must not activate cloud deployment.'}\n\n$core=Get-Content (Join-Path $WorkRoot 'core-publication.json') -Raw|ConvertFrom-Json\n$baseline=(Get-Content (Join-Path $WorkRoot 'capstone-sha.txt')).Trim()\n$p=Join-Path $WorkRoot 'capstone'\nif($core.sourceRevision -cne $baseline -or $core.sourceRevision -notmatch '^[a-f0-9]{40}$' -or $core.releaseActivated -or $core.ciPath -cne 'azure-pipelines.yml'){throw 'Historical CI-only source evidence is invalid.'}\n$historical=git -C $p show \"${baseline}:deployment/package-manifest.json\"|ConvertFrom-Json\n$blob=(git -C $p rev-parse \"${baseline}:azure-pipelines.yml\").Trim()\n$currentBlob=(git -C $p hash-object (Join-Path $p 'azure-pipelines.yml')).Trim()\nif($historical.releaseActivated -or $blob -cne $core.ciBlob -or $currentBlob -cne $blob -or (Get-FileHash (Join-Path $p 'azure-pipelines.yml') -Algorithm SHA256).Hash -cne $core.ciSha256){throw 'CI-only publication revision or file hash differs from captured source.'}\n",
      "evidence": "Committed SHA and CI-versus-dormant template review. core-publication.json links the baseline commit, exact CI path, SHA256 and Git blob; current protected release evidence is separate.",
