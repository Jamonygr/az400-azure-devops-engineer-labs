        "D3.3.1"
      ],
      "difficulty": "foundational",
      "question": "A fresh hosted job starts a .NET build before retrieving source, and the solution cannot be found. What is missing?",
      "options": [
        {
          "key": "A",
          "text": "Checkout the intended repository revision before building",
          "rationale": "A fresh job needs source files before solution paths can resolve."
        },
        {
          "key": "B",
          "text": "Rename the package to match the solution",
          "rationale": "Package naming happens after compilation and cannot retrieve source files."
        },
        {
          "key": "C",
          "text": "Create an environment approval before building",
          "rationale": "Deployment approval does not place source files into the workspace."
        },
        {
          "key": "D",
          "text": "Increase the build matrix size",
          "rationale": "More runners repeat the missing-source failure without retrieving the repository."
        }
      ],
      "correctAnswers": [
        "A"
      ],
      "explanation": "A fresh job needs source files before solution paths can resolve. Deployment approval does not place source files into the workspace. More runners repeat the missing-source failure without retrieving the repository. Package naming happens after compilation and cannot retrieve source files.",
      "sourceIds": [
        "S1"
      ]
    },
