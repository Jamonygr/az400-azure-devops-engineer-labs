{
  "schemaVersion": "1.0.0",
  "id": "09",
  "slug": "09-github-actions-ci",
  "title": "Build the sample with GitHub Actions",
  "domain": "pipelines",
  "minutes": 120,
  "cost": "none",
  "platforms": [
    "local",
    "github"
  ],
  "objectives": [
    "D3.1.4",
    "D3.2.3",
    "D3.3.1",
    "D3.3.4",
    "D3.3.5"
  ],
  "scenario": "A developer can run tests locally but the repository has no repeatable CI evidence. Publish one build-only GitHub workflow to a fresh sandbox.",
  "role": "GitHub automation engineer",
  "outcome": "Build the sample with GitHub Actions.",
  "checkpoints": [
    {
      "id": "CP1",
      "title": "Prepare the isolated GitHub CI working copy",
      "commands": "$p=Join-Path $WorkRoot 'github-ci'\nif(Test-Path (Join-Path $p '.git')){\n $origin=git -C $p remote get-url origin\n $expected='^(https://github\\.com/|git@github\\.com:)'+[regex]::Escape($GhRepo)+'(?:\\.git)?$'\n if($origin -notmatch $expected){throw 'Existing working copy points to a different GitHub repository; refusing to reuse it.'}\n}else{gh repo clone $GhRepo $p}\n\n git -C $p config user.name 'AZ400 Learner';git -C $p config user.email 'learner@example.invalid'\n $source=Join-Path $RepoRoot 'samples'\n Get-ChildItem $source -File -Recurse|Where-Object FullName -NotMatch '[\\/](bin|obj)[\\/]'|ForEach-Object { $rel=[IO.Path]::GetRelativePath($RepoRoot,$_.FullName);$dest=Join-Path $p $rel;New-Item -ItemType Directory -Force (Split-Path $dest)|Out-Null;Copy-Item $_.FullName $dest }\n foreach ($name in @('global.json','Directory.Build.props')) { if (Test-Path (Join-Path $RepoRoot $name)) { Copy-Item (Join-Path $RepoRoot $name) $p } }\n @('**/bin/','**/obj/','.state/')|Set-Content (Join-Path $p '.gitignore')\n",
      "expected": "Only the sample and build configuration enter a fresh sandbox working copy.",
      "positive": "$p=Join-Path $WorkRoot 'github-ci'\n if (-not (Test-Path (Join-Path $p 'samples/DevOps.slnx'))) { throw 'Sample was not copied.' }\n",
      "negative": "$p=Join-Path $WorkRoot 'github-ci'\n if ((git -C $p remote get-url origin) -notmatch [regex]::Escape($GhRepo)) { throw 'Wrong GitHub sandbox remote.' }\n",
      "validate": "$p=Join-Path $WorkRoot 'github-ci'\n if (-not (Test-Path (Join-Path $p 'samples/DevOps.slnx'))) { throw 'Sample was not copied.' }\n\n$p=Join-Path $WorkRoot 'github-ci'\n if ((git -C $p remote get-url origin) -notmatch [regex]::Escape($GhRepo)) { throw 'Wrong GitHub sandbox remote.' }\n",
      "evidence": "Working-copy remote and allowlisted copied paths.",
      "fix": "Authenticate Git through the separate bootstrap; copy source files without bin/obj or credentials."
    },
    {
      "id": "CP2",
      "title": "Install the CI-only workflow",
      "commands": "$p=Join-Path $WorkRoot 'github-ci';$wf=Join-Path $p '.github/workflows';New-Item -ItemType Directory -Force $wf|Out-Null\n Copy-Item (Join-Path $LabRoot 'artifacts/github-ci.yml') (Join-Path $wf 'ci.yml')\n Get-Content (Join-Path $wf 'ci.yml')\n",
      "expected": "A YAML workflow builds/tests the sample without Azure deployment.",
      "positive": "$text=Get-Content (Join-Path $WorkRoot 'github-ci/.github/workflows/ci.yml') -Raw\n if ($text -notmatch 'dotnet' -or $text -notmatch 'pull_request') { throw 'CI build/PR trigger absent.' }\n",
      "negative": "$text=Get-Content (Join-Path $WorkRoot 'github-ci/.github/workflows/ci.yml') -Raw\n if ($text -match 'azure/login|az deployment|pull_request_target') { throw 'CI-only workflow contains an unsafe deployment trigger.' }\n",
      "validate": "$text=Get-Content (Join-Path $WorkRoot 'github-ci/.github/workflows/ci.yml') -Raw\n if ($text -notmatch 'dotnet' -or $text -notmatch 'pull_request') { throw 'CI build/PR trigger absent.' }\n\n$text=Get-Content (Join-Path $WorkRoot 'github-ci/.github/workflows/ci.yml') -Raw\n if ($text -match 'azure/login|az deployment|pull_request_target') { throw 'CI-only workflow contains an unsafe deployment trigger.' }\n",
      "evidence": "Workflow digest and event/permissions review.",
      "fix": "Keep deployment workflows dormant in the course; sandbox CI uses read-only repository permission."
    },
    {
      "id": "CP3",
      "title": "Verify locally before publishing the CI change",
      "commands": "$p=Join-Path $WorkRoot 'github-ci'\n dotnet test (Join-Path $p 'samples/DevOps.slnx') --configuration Release --logger \"trx;LogFileName=before-push.trx\" --results-directory (Join-Path $WorkRoot 'local-ci')\n if ($LASTEXITCODE -ne 0) { throw 'Do not push a known failing baseline.' }\n",
      "expected": "The same sample test command passes locally.",
      "positive": "if (-not (Get-ChildItem (Join-Path $WorkRoot 'local-ci') -Filter '*.trx' -Recurse)) { throw 'Local CI result missing.' }\n",
      "negative": "$x=[xml](Get-Content (Get-ChildItem (Join-Path $WorkRoot 'local-ci') -Filter '*.trx' -Recurse|Select-Object -First 1).FullName -Raw)\n if ([int]$x.TestRun.ResultSummary.Counters.failed -gt 0) { throw 'Local baseline failed.' }\n",
      "validate": "if (-not (Get-ChildItem (Join-Path $WorkRoot 'local-ci') -Filter '*.trx' -Recurse)) { throw 'Local CI result missing.' }\n\n$x=[xml](Get-Content (Get-ChildItem (Join-Path $WorkRoot 'local-ci') -Filter '*.trx' -Recurse|Select-Object -First 1).FullName -Raw)\n if ([int]$x.TestRun.ResultSummary.Counters.failed -gt 0) { throw 'Local baseline failed.' }\n",
      "evidence": "Local TRX and selected SDK.",
      "fix": "Match the SDK pin and restore sources used by hosted CI."
    },
    {
      "id": "CP4",
      "title": "Publish the sandbox CI workflow",
      "commands": "$p=Join-Path $WorkRoot 'github-ci';git -C $p add .;$staged=@(git -C $p diff --cached --name-only)\nif($staged.Count -gt 0){git -C $p commit -m \"[$RunId] Add sample CI\"}else{Write-Output 'Reviewed files already committed; reusing the current source revision.'}\n git -C $p branch -M main;git -C $p push -u origin main\n (git -C $p rev-parse HEAD)|Set-Content (Join-Path $WorkRoot 'ci-commit.txt')\n",
      "expected": "A fresh main commit triggers only the sandbox CI workflow.",
      "positive": "$sha=Get-Content (Join-Path $WorkRoot 'ci-commit.txt')\n $head=gh api \"repos/$GhRepo/commits/main\" --jq .sha\n if ($head -ne $sha) { throw 'Remote main differs from reviewed CI commit.' }\n",
      "negative": "$p=Join-Path $WorkRoot 'github-ci'\n if ((git -C $p ls-files) -match '(^|/)bin/|(^|/)obj/') { throw 'Build output was committed.' }\n",
      "validate": "$sha=Get-Content (Join-Path $WorkRoot 'ci-commit.txt')\n $head=gh api \"repos/$GhRepo/commits/main\" --jq .sha\n if ($head -ne $sha) { throw 'Remote main differs from reviewed CI commit.' }\n\n$p=Join-Path $WorkRoot 'github-ci'\n if ((git -C $p ls-files) -match '(^|/)bin/|(^|/)obj/') { throw 'Build output was committed.' }\n",
      "evidence": "Pushed SHA and workflow name.",
      "fix": "Review staged files before push; the destination must be the derived disposable repo."
    },
    {
      "id": "CP5",
      "title": "Inspect run provenance and test artifact availability",
      "commands": "$sha=Get-Content (Join-Path $WorkRoot 'ci-commit.txt')\n $runs=gh run list --repo $GhRepo --commit $sha --limit 5 --json databaseId,headSha,status,conclusion\n $runs|Set-Content (Join-Path $WorkRoot 'ci-runs.json')\n $r=@($runs|ConvertFrom-Json)|Select-Object -First 1;if (-not $r) { throw 'CI run not yet visible; retry this read-only checkpoint.' }\n gh run watch $r.databaseId --repo $GhRepo --exit-status\n if ($LASTEXITCODE -ne 0) { throw 'Hosted CI failed.' }\n",
      "expected": "The committed revision receives a successful hosted run; transient API lag needs retry.",
      "positive": "$sha=Get-Content (Join-Path $WorkRoot 'ci-commit.txt')\n $r=@(gh run list --repo $GhRepo --commit $sha --json headSha,status,conclusion|ConvertFrom-Json)\n if (@($r|Where-Object { $_.status -eq 'completed' -and $_.conclusion -eq 'success' }).Count -lt 1) { throw 'Successful CI run absent.' }\n",
      "negative": "$sha=Get-Content (Join-Path $WorkRoot 'ci-commit.txt')\n $r=@(gh run list --repo $GhRepo --commit $sha --json headSha|ConvertFrom-Json)\n if (@($r|Where-Object headSha -ne $sha).Count) { throw 'Run provenance mismatch.' }\n",
      "validate": "$sha=Get-Content (Join-Path $WorkRoot 'ci-commit.txt')\n $r=@(gh run list --repo $GhRepo --commit $sha --json headSha,status,conclusion|ConvertFrom-Json)\n if (@($r|Where-Object { $_.status -eq 'completed' -and $_.conclusion -eq 'success' }).Count -lt 1) { throw 'Successful CI run absent.' }\n\n$sha=Get-Content (Join-Path $WorkRoot 'ci-commit.txt')\n $r=@(gh run list --repo $GhRepo --commit $sha --json headSha|ConvertFrom-Json)\n if (@($r|Where-Object headSha -ne $sha).Count) { throw 'Run provenance mismatch.' }\n",
      "evidence": "Run URL/SHA/conclusion and artifact inventory.",
      "fix": "Check hosted minutes and Actions permissions; never treat queued or skipped runs as success."
    }
  ],
  "breakFix": {
    "trigger": "$p=Join-Path $WorkRoot 'github-ci';'fault'|Set-Content (Join-Path $p 'samples/DevOps.Api/Broken.cs')\n",
    "diagnose": "dotnet build (Join-Path $WorkRoot 'github-ci/samples/DevOps.slnx');'Expected: compiler error names Broken.cs.'\n",
    "repair": "Remove-Item -LiteralPath (Join-Path $WorkRoot 'github-ci/samples/DevOps.Api/Broken.cs')\ndotnet build (Join-Path $WorkRoot 'github-ci/samples/DevOps.slnx')\n"
  },
  "challenge": "Add a branch-only CI trigger and path filter; prove the selected commit, test artifacts, permissions, and concurrency cancellation remain correct.",
  "sources": [
    "https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net",
    "https://cli.github.com/manual/gh_run_watch"
  ],
  "primer": "Triggers choose when jobs exist, permissions choose what a token may do, and headSha ties results to source. Hosted success must be observed rather than inferred from a push.",
