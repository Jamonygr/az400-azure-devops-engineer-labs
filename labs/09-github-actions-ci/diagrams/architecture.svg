<text x="563" y="170" fill="#0f172a" font-family="sans-serif" font-size="18">locked restore</text>
</g>
<g data-node="tests"><rect x="550" y="330" width="190" height="120" rx="11" fill="#ffffff" stroke="#0284c7" stroke-width="2"/><text x="563" y="353" fill="#0284c7" font-family="sans-serif" font-size="12" font-weight="bold">CODE</text>
