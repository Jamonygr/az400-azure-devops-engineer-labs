  "questions": [
    {
      "id": "L20-Q001",
      "checkpointId": "CP1",
      "objectiveIds": [
        "D4.1.4"
      ],
      "difficulty": "foundational",
      "question": "A contributor needs to read an organization repository and discuss changes without pushing code. Which repository role is the least privileged fit?",
      "options": [
        {
          "key": "A",
          "text": "Admin",
          "rationale": "Admin grants sensitive repository administration rights far beyond the stated contributor requirement."
        },
        {
          "key": "B",
          "text": "Read",
          "rationale": "Read supports viewing and discussion without granting direct repository code push privileges."
        },
        {
          "key": "C",
          "text": "Write",
          "rationale": "Write grants direct code contribution capabilities beyond the stated read and discussion need."
        },
        {
          "key": "D",
          "text": "Maintain",
          "rationale": "Maintain includes repository management capabilities unnecessary for viewing and discussing project changes."
        }
      ],
      "correctAnswers": [
        "B"
      ],
      "explanation": "Admin grants sensitive repository administration rights far beyond the stated contributor requirement. Read supports viewing and discussion without granting direct repository code push privileges. Write grants direct code contribution capabilities beyond the stated read and discussion need. Maintain includes repository management capabilities unnecessary for viewing and discussing project changes.",
      "sourceIds": [
        "S4"
      ]
    },
    {
      "id": "L20-Q002",
      "checkpointId": "CP1",
      "objectiveIds": [
        "D4.1.4"
      ],
      "difficulty": "foundational",
      "question": "An organization member must label and manage issues without permission to push source changes. Which repository role best fits?",
      "options": [
        {
          "key": "A",
          "text": "Write",
          "rationale": "Write grants source modification privileges unnecessary for the stated issue-management responsibility."
        },
        {
          "key": "B",
          "text": "Admin",
          "rationale": "Admin adds sensitive administrative capabilities far beyond the requested issue-management task."
        },
        {
          "key": "C",
          "text": "Triage",
          "rationale": "Triage supports proactive issue and pull-request management without granting source write access."
        },
        {
          "key": "D",
          "text": "Read",
          "rationale": "Read supports viewing and discussion but lacks the requested broader issue management capabilities."
        }
      ],
      "correctAnswers": [
        "C"
      ],
      "explanation": "Write grants source modification privileges unnecessary for the stated issue-management responsibility. Admin adds sensitive administrative capabilities far beyond the requested issue-management task. Triage supports proactive issue and pull-request management without granting source write access. Read supports viewing and discussion but lacks the requested broader issue management capabilities.",
      "sourceIds": [
        "S4"
      ]
    },
    {
      "id": "L20-Q003",
