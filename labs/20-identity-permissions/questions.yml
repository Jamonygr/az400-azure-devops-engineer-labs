      "difficulty": "foundational",
      "question": "A local authorization review needs the current GitHub caller's effective permissions without modifying repository membership. Which operation is suitable?",
      "options": [
        {
          "key": "A",
          "text": "Add the caller as Admin",
          "rationale": "Granting access changes the environment rather than observing existing effective permissions."
        },
        {
          "key": "B",
          "text": "Rotate every organization token",
          "rationale": "Bulk token rotation is unrelated to a read-only review of current repository permissions."
        },
        {
          "key": "C",
          "text": "Change the repository visibility",
          "rationale": "Visibility mutation does not establish the caller's original effective access level."
        },
        {
          "key": "D",
          "text": "Read repository viewer permission metadata",
          "rationale": "Read-only effective permission metadata helps inspect the current caller's repository access."
        }
      ],
      "correctAnswers": [
        "D"
      ],
      "explanation": "Granting access changes the environment rather than observing existing effective permissions. Bulk token rotation is unrelated to a read-only review of current repository permissions. Visibility mutation does not establish the caller's original effective access level. Read-only effective permission metadata helps inspect the current caller's repository access.",
      "sourceIds": [
        "S3"
      ]
    },
    {
      "id": "L20-Q007",
      "checkpointId": "CP1",
      "objectiveIds": [
        "D4.1.4",
        "D2.2.3"
      ],
      "difficulty": "applied",
      "question": "A maintainer wants to grant Admin to every contributor so automation never encounters authorization failures. What principle should guide the alternative design?",
      "options": [
        {
          "key": "A",
          "text": "Choose the highest role by default",
          "rationale": "Highest-role defaults unnecessarily broaden sensitive access and destructive repository control."
        },
        {
          "key": "B",
          "text": "Share one administrator identity for all activity",
          "rationale": "Shared identities obscure attribution and exceed individual contributors' required permissions."
        },
        {
          "key": "C",
          "text": "Remove access review records",
          "rationale": "Discarding records does not reduce overprivilege or make authorization failures easier to investigate."
        },
        {
          "key": "D",
          "text": "Grant roles matching specific responsibilities",
          "rationale": "Least privilege selects required capabilities instead of suppressing all future authorization boundaries."
        }
      ],
      "correctAnswers": [
        "D"
      ],
      "explanation": "Highest-role defaults unnecessarily broaden sensitive access and destructive repository control. Shared identities obscure attribution and exceed individual contributors' required permissions. Discarding records does not reduce overprivilege or make authorization failures easier to investigate. Least privilege selects required capabilities instead of suppressing all future authorization boundaries.",
      "sourceIds": [
        "S4"
      ]
    },
    {
