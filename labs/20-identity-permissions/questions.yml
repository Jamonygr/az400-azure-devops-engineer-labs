      "objectiveIds": [
        "D4.1.4"
      ],
      "difficulty": "applied",
      "question": "A developer actively pushes application changes but should not administer repository access. Which standard organization repository role is appropriate?",
      "options": [
        {
          "key": "A",
          "text": "Write",
          "rationale": "Write enables code contribution without automatically requiring repository administration permissions."
        },
        {
          "key": "B",
          "text": "Read",
          "rationale": "Read does not provide the required direct push capability for active code development."
        },
        {
          "key": "C",
          "text": "Triage",
          "rationale": "Triage focuses on issue and pull-request management rather than direct source pushes."
        },
        {
          "key": "D",
          "text": "Admin",
          "rationale": "Admin grants unnecessary access-management and destructive administration capabilities for the developer's task."
        }
      ],
      "correctAnswers": [
        "A"
      ],
      "explanation": "Write enables code contribution without automatically requiring repository administration permissions. Read does not provide the required direct push capability for active code development. Triage focuses on issue and pull-request management rather than direct source pushes. Admin grants unnecessary access-management and destructive administration capabilities for the developer's task.",
      "sourceIds": [
