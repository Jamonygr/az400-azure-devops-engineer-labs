    {
      "id": "L20-Q004",
      "checkpointId": "CP1",
      "objectiveIds": [
        "D4.1.2"
      ],
      "difficulty": "applied",
      "question": "The GitHub CLI is authenticated but a repository operation is denied. Which distinction should troubleshooting preserve?",
      "options": [
        {
          "key": "A",
          "text": "A login failure is proven automatically",
          "rationale": "A resource authorization denial does not necessarily mean authentication itself failed."
        },
        {
          "key": "B",
          "text": "Authentication identity differs from resource authorization",
          "rationale": "Successful login identifies a caller without guaranteeing permission for every requested operation."
        },
        {
          "key": "C",
          "text": "Authentication guarantees access to every repository",
          "rationale": "A valid identity can still lack the role or token permission an operation requires."
        },
        {
          "key": "D",
          "text": "Repository names determine token permissions",
          "rationale": "Naming a target does not grant the authenticated caller authority to access it."
        }
      ],
      "correctAnswers": [
        "B"
      ],
      "explanation": "A resource authorization denial does not necessarily mean authentication itself failed. Successful login identifies a caller without guaranteeing permission for every requested operation. A valid identity can still lack the role or token permission an operation requires. Naming a target does not grant the authenticated caller authority to access it.",
      "sourceIds": [
        "S3"
      ]
    },
    {
      "id": "L20-Q005",
      "checkpointId": "CP1",
      "objectiveIds": [
        "D4.1.4",
        "D2.2.3"
      ],
      "difficulty": "advanced",
      "question": "An issue coordinator can triage but cannot push, while a temporary workaround proposes Admin. Which change meets the actual responsibility without granting unnecessary code or security control?",
      "options": [
        {
          "key": "A",
          "text": "Grant Admin to eliminate every permission prompt",
          "rationale": "Admin resolves more permissions than needed and unnecessarily expands sensitive control."
        },
        {
          "key": "B",
          "text": "Grant Write permanently for issue coordination",
          "rationale": "Source push capability exceeds the stated responsibility and is unnecessary for triage."
        },
        {
          "key": "C",
          "text": "Share another administrator's credentials",
          "rationale": "Shared credentials weaken accountability and grant unrelated privileges beyond the coordinator's task."
        },
        {
          "key": "D",
          "text": "Retain Triage and correct only missing issue-specific access",
          "rationale": "The role matches issue management while avoiding broader source and administrative powers."
        }
      ],
      "correctAnswers": [
        "D"
      ],
      "explanation": "Admin resolves more permissions than needed and unnecessarily expands sensitive control. Source push capability exceeds the stated responsibility and is unnecessary for triage. Shared credentials weaken accountability and grant unrelated privileges beyond the coordinator's task. The role matches issue management while avoiding broader source and administrative powers.",
      "sourceIds": [
        "S4"
      ],
      "exhibit": {
        "language": "text",
        "code": "Required: manage issues and labels\nNot required: push source, change access, delete repository\nCurrent role: Triage\nProposed workaround: Admin"
      }
    },
    {
