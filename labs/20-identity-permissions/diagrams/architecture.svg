<svg xmlns="http://www.w3.org/2000/svg" width="760" height="650" viewBox="0 0 760 650" role="img" aria-labelledby="title desc"><title id="title">Lab 20: Three separately scoped authorization planes</title><desc id="desc">GitHub permissions apply to a repository principal/token, Azure DevOps groups apply to project and repository resources, and Azure RBAC applies independently to the managed identity at the owned resource-group scope. Licensing/access levels do not replace these security permissions. The lab creates only the RG-contained identity and its read-only role assignment. Relationships: GitHub principal / app token to GitHub repository roles: repository permission; Azure DevOps security team to DevOps project + repository: project / repository roles; Entra managed identity to Owned Azure group: Reader: exact-scope Azure RBAC</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto-start-reverse"><path d="M0,0 L0,8 L8,4 z" fill="#0369a1"/></marker></defs>
<rect width="760" height="650" rx="16" fill="#f0f9ff"/>
<text x="22" y="30" fill="#0c4a6e" font-size="19" font-weight="bold" font-family="sans-serif">Lab 20: Three separately scoped authorization planes</text>
<path d="M210,160.0 H285" fill="none" stroke="#0369a1" stroke-width="2" marker-end="url(#arrow)" data-from="ghactor" data-to="ghrepo"><title>repository permission</title></path>
<circle cx="247.5" cy="160.0" r="11" fill="#ffffff" stroke="#0369a1" stroke-width="1.5"/><text x="247.5" y="164.5" text-anchor="middle" fill="#075985" font-size="13" font-weight="bold" font-family="sans-serif">1</text>
<path d="M645.0,220 V330" fill="none" stroke="#0369a1" stroke-width="2" marker-end="url(#arrow)" data-from="adoteam" data-to="project"><title>project / repository roles</title></path>
<circle cx="645.0" cy="275.0" r="11" fill="#ffffff" stroke="#0369a1" stroke-width="1.5"/><text x="645.0" y="279.5" text-anchor="middle" fill="#075985" font-size="13" font-weight="bold" font-family="sans-serif">2</text>
<path d="M285,390.0 H210" fill="none" stroke="#0369a1" stroke-width="2" marker-end="url(#arrow)" data-from="uami" data-to="group"><title>exact-scope Azure RBAC</title></path>
<circle cx="247.5" cy="390.0" r="11" fill="#ffffff" stroke="#0369a1" stroke-width="1.5"/><text x="247.5" y="394.5" text-anchor="middle" fill="#075985" font-size="13" font-weight="bold" font-family="sans-serif">3</text>
<g data-node="ghactor"><rect x="20" y="100" width="190" height="120" rx="11" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/><text x="33" y="123" fill="#7c3aed" font-family="sans-serif" font-size="12" font-weight="bold">IDENTITY</text>
<text x="33" y="148" fill="#0f172a" font-family="sans-serif" font-size="18">GitHub principal /</text>
<text x="33" y="170" fill="#0f172a" font-family="sans-serif" font-size="18">app token</text>
</g>
<g data-node="ghrepo"><rect x="285" y="100" width="190" height="120" rx="11" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/><text x="298" y="123" fill="#0284c7" font-family="sans-serif" font-size="12" font-weight="bold">PLATFORM</text>
<text x="298" y="148" fill="#0f172a" font-family="sans-serif" font-size="18">GitHub repository</text>
<text x="298" y="170" fill="#0f172a" font-family="sans-serif" font-size="18">roles</text>
</g>
<g data-node="adoteam"><rect x="550" y="100" width="190" height="120" rx="11" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/><text x="563" y="123" fill="#7c3aed" font-family="sans-serif" font-size="12" font-weight="bold">IDENTITY</text>
<text x="563" y="148" fill="#0f172a" font-family="sans-serif" font-size="18">Azure DevOps</text>
<text x="563" y="170" fill="#0f172a" font-family="sans-serif" font-size="18">security team</text>
</g>
<g data-node="project"><rect x="550" y="330" width="190" height="120" rx="11" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/><text x="563" y="353" fill="#0284c7" font-family="sans-serif" font-size="12" font-weight="bold">PLATFORM</text>
<text x="563" y="378" fill="#0f172a" font-family="sans-serif" font-size="18">DevOps project +</text>
<text x="563" y="400" fill="#0f172a" font-family="sans-serif" font-size="18">repository</text>
</g>
<g data-node="uami"><rect x="285" y="330" width="190" height="120" rx="11" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/><text x="298" y="353" fill="#7c3aed" font-family="sans-serif" font-size="12" font-weight="bold">IDENTITY</text>
<text x="298" y="378" fill="#0f172a" font-family="sans-serif" font-size="18">Entra managed</text>
<text x="298" y="400" fill="#0f172a" font-family="sans-serif" font-size="18">identity</text>
</g>
<g data-node="group"><rect x="20" y="330" width="190" height="120" rx="11" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/><text x="33" y="353" fill="#0284c7" font-family="sans-serif" font-size="12" font-weight="bold">PLATFORM</text>
<text x="33" y="378" fill="#0f172a" font-family="sans-serif" font-size="18">Owned Azure group:</text>
<text x="33" y="400" fill="#0f172a" font-family="sans-serif" font-size="18">Reader</text>
</g>
<text x="22" y="480" fill="#0c4a6e" font-family="sans-serif" font-weight="bold" font-size="16">Relationships</text>
<text x="22" y="507" fill="#0f172a" font-family="sans-serif" font-size="14.5">1. repository permission</text>
<text x="392" y="507" fill="#0f172a" font-family="sans-serif" font-size="14.5">2. project / repository roles</text>
<text x="22" y="545" fill="#0f172a" font-family="sans-serif" font-size="14.5">3. exact-scope Azure RBAC</text>
<text x="22" y="636" fill="#334155" font-family="sans-serif" font-size="12">Solid: core relationship · Dashed: separately gated integration · See walkthrough for verification limits.</text>
</svg>
