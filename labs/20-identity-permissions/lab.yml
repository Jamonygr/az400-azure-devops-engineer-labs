    "topology": "GitHub permissions apply to a repository principal/token, Azure DevOps groups apply to project and repository resources, and Azure RBAC applies independently to the managed identity at the owned resource-group scope. Licensing/access levels do not replace these security permissions. The lab creates only the RG-contained identity and its read-only role assignment."
  },
  "providers": [
    "Microsoft.ManagedIdentity",
    "Microsoft.Authorization"
  ],
  "verification": {
    "status": "offline-tested",
    "scope": "All five checkpoint commands, final validators and named fault/repair executed in CourseSecurityTelemetry.Tests.ps1 with fail-closed provider doubles. Local calculations, permission/reference/secure-file fixtures and .NET trace behavior are real; live provider calls, federation and telemetry export have not run."
  },
  "solutionNotes": "The identity and role assignment must remain within the exact owned group. A broad subscription-level grant is not an acceptable shortcut for a failing project operation."
}
