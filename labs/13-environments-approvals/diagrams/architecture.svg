<svg xmlns="http://www.w3.org/2000/svg" width="760" height="650" viewBox="0 0 760 650" role="img" aria-labelledby="title desc"><title id="title">Lab 13: Environment approval and deployment authorization</title><desc id="desc">The GitHub environment contains review and protected-branch controls; the dormant workflow must bind its exact environment name before activation. That environment name also forms the federation subject used for a separately approved Azure target. Azure Pipelines resource checks are reviewed as an independent owner-controlled contract outside editable YAML. Relationships: Dormant GitHub deploy YAML to Protected GitHub environment: explicit dispatch binding; Independent approval owner to Protected GitHub environment: approval / branch checks; Protected GitHub environment to Exact OIDC environment subject: subject boundary; Exact OIDC environment subject to Azure target (separate gate): authorized workload token; Azure environment-check contract to Independent approval owner: separate resource-owner checks</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto-start-reverse"><path d="M0,0 L0,8 L8,4 z" fill="#0369a1"/></marker></defs>
<rect width="760" height="650" rx="16" fill="#f0f9ff"/>
<text x="22" y="30" fill="#0c4a6e" font-size="19" font-weight="bold" font-family="sans-serif">Lab 13: Environment approval and deployment authorization</text>
<path d="M210,160.0 H285" fill="none" stroke="#0369a1" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)" data-from="workflow" data-to="environment"><title>explicit dispatch binding</title></path>
<circle cx="247.5" cy="160.0" r="11" fill="#ffffff" stroke="#0369a1" stroke-width="1.5"/><text x="247.5" y="164.5" text-anchor="middle" fill="#075985" font-size="13" font-weight="bold" font-family="sans-serif">1</text>
<path d="M550,160.0 H475" fill="none" stroke="#0369a1" stroke-width="2" marker-end="url(#arrow)" data-from="reviewer" data-to="environment"><title>approval / branch checks</title></path>
<circle cx="512.5" cy="160.0" r="11" fill="#ffffff" stroke="#0369a1" stroke-width="1.5"/><text x="512.5" y="164.5" text-anchor="middle" fill="#075985" font-size="13" font-weight="bold" font-family="sans-serif">2</text>
<path d="M380.0,220 V289.0 H645.0 V330" fill="none" stroke="#0369a1" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)" data-from="environment" data-to="federation"><title>subject boundary</title></path>
<circle cx="512.5" cy="289.0" r="11" fill="#ffffff" stroke="#0369a1" stroke-width="1.5"/><text x="512.5" y="293.5" text-anchor="middle" fill="#075985" font-size="13" font-weight="bold" font-family="sans-serif">3</text>
<path d="M550,390.0 H475" fill="none" stroke="#0369a1" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)" data-from="federation" data-to="target"><title>authorized workload token</title></path>
<circle cx="512.5" cy="390.0" r="11" fill="#ffffff" stroke="#0369a1" stroke-width="1.5"/><text x="512.5" y="394.5" text-anchor="middle" fill="#075985" font-size="13" font-weight="bold" font-family="sans-serif">4</text>
<path d="M115.0,330 V275.0 H645.0 V220" fill="none" stroke="#0369a1" stroke-width="2" marker-end="url(#arrow)" data-from="ado" data-to="reviewer"><title>separate resource-owner checks</title></path>
<circle cx="380.0" cy="275.0" r="11" fill="#ffffff" stroke="#0369a1" stroke-width="1.5"/><text x="380.0" y="279.5" text-anchor="middle" fill="#075985" font-size="13" font-weight="bold" font-family="sans-serif">5</text>
<g data-node="workflow"><rect x="20" y="100" width="190" height="120" rx="11" fill="#ffffff" stroke="#0284c7" stroke-width="2"/><text x="33" y="123" fill="#0284c7" font-family="sans-serif" font-size="12" font-weight="bold">CODE</text>
<text x="33" y="148" fill="#0f172a" font-family="sans-serif" font-size="18">Dormant GitHub</text>
<text x="33" y="170" fill="#0f172a" font-family="sans-serif" font-size="18">deploy YAML</text>
</g>
<g data-node="environment"><rect x="285" y="100" width="190" height="120" rx="11" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/><text x="298" y="123" fill="#0284c7" font-family="sans-serif" font-size="12" font-weight="bold">PLATFORM</text>
<text x="298" y="148" fill="#0f172a" font-family="sans-serif" font-size="18">Protected GitHub</text>
<text x="298" y="170" fill="#0f172a" font-family="sans-serif" font-size="18">environment</text>
</g>
<g data-node="reviewer"><rect x="550" y="100" width="190" height="120" rx="11" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/><text x="563" y="123" fill="#7c3aed" font-family="sans-serif" font-size="12" font-weight="bold">IDENTITY</text>
<text x="563" y="148" fill="#0f172a" font-family="sans-serif" font-size="18">Independent</text>
<text x="563" y="170" fill="#0f172a" font-family="sans-serif" font-size="18">approval owner</text>
</g>
<g data-node="federation"><rect x="550" y="330" width="190" height="120" rx="11" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/><text x="563" y="353" fill="#7c3aed" font-family="sans-serif" font-size="12" font-weight="bold">IDENTITY</text>
<text x="563" y="378" fill="#0f172a" font-family="sans-serif" font-size="18">Exact OIDC</text>
<text x="563" y="400" fill="#0f172a" font-family="sans-serif" font-size="18">environment subject</text>
</g>
<g data-node="target"><rect x="285" y="330" width="190" height="120" rx="11" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/><text x="298" y="353" fill="#0284c7" font-family="sans-serif" font-size="12" font-weight="bold">PLATFORM</text>
<text x="298" y="378" fill="#0f172a" font-family="sans-serif" font-size="18">Azure target</text>
<text x="298" y="400" fill="#0f172a" font-family="sans-serif" font-size="18">(separate gate)</text>
</g>
<g data-node="ado"><rect x="20" y="330" width="190" height="120" rx="11" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/><text x="33" y="353" fill="#ea580c" font-family="sans-serif" font-size="12" font-weight="bold">EVIDENCE</text>
<text x="33" y="378" fill="#0f172a" font-family="sans-serif" font-size="18">Azure environment-</text>
<text x="33" y="400" fill="#0f172a" font-family="sans-serif" font-size="18">check contract</text>
</g>
<text x="22" y="480" fill="#0c4a6e" font-family="sans-serif" font-weight="bold" font-size="16">Relationships</text>
<text x="22" y="507" fill="#0f172a" font-family="sans-serif" font-size="14.5">1. explicit dispatch binding</text>
<text x="392" y="507" fill="#0f172a" font-family="sans-serif" font-size="14.5">2. approval / branch checks</text>
<text x="22" y="545" fill="#0f172a" font-family="sans-serif" font-size="14.5">3. subject boundary</text>
<text x="392" y="545" fill="#0f172a" font-family="sans-serif" font-size="14.5">4. authorized workload token</text>
<text x="22" y="583" fill="#0f172a" font-family="sans-serif" font-size="14.5">5. separate resource-owner checks</text>
<text x="22" y="636" fill="#334155" font-family="sans-serif" font-size="12">Solid: core relationship · Dashed: separately gated integration · See walkthrough for verification limits.</text>
</svg>
