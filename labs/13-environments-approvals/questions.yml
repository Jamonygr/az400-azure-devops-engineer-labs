          "text": "Only a longer test timeout",
          "rationale": "Execution duration does not establish an independent release approval boundary."
        },
        {
          "key": "B",
          "text": "Only another compilation of identical source",
          "rationale": "A repeated build does not establish independent permission to deploy the release."
        },
        {
          "key": "C",
          "text": "Only a different artifact friendly name",
          "rationale": "Output naming does not authorize a production environment transition."
        },
        {
          "key": "D",
          "text": "A protected deployment environment approval",
          "rationale": "Source review and authorization to promote into an environment are separate decisions."
        }
      ],
      "correctAnswers": [
        "D"
      ],
      "explanation": "Source review and authorization to promote into an environment are separate decisions. A repeated build does not establish independent permission to deploy the release. Output naming does not authorize a production environment transition. Execution duration does not establish an independent release approval boundary.",
