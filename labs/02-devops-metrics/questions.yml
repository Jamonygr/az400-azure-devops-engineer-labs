    {
      "id": "L02-Q001",
      "checkpointId": "CP2",
      "objectiveIds": [
        "D1.2.1"
      ],
      "difficulty": "foundational",
      "question": "A request is created Monday, enters active work Thursday, and finishes Friday. Which interval measures its lead time under the Azure Boards definition?",
      "options": [
        {
          "key": "A",
          "text": "Active work to completion",
          "rationale": "That measures cycle time and excludes the initial waiting period."
        },
        {
          "key": "B",
          "text": "First commit to deployment",
          "rationale": "That is a source-to-release interval, not this work-item definition."
        },
        {
          "key": "C",
          "text": "Creation to first assignment",
          "rationale": "That measures intake delay but omits the remaining delivery time."
        },
        {
          "key": "D",
          "text": "Creation to completion",
          "rationale": "Lead time includes the queue before active work begins."
        }
      ],
      "correctAnswers": [
        "D"
      ],
      "explanation": "That measures cycle time and excludes the initial waiting period. That is a source-to-release interval, not this work-item definition. That measures intake delay but omits the remaining delivery time. Lead time includes the queue before active work begins.",
      "sourceIds": [
        "S1"
      ]
    },
    {
      "id": "L02-Q002",
      "checkpointId": "CP2",
      "objectiveIds": [
        "D1.2.1"
      ],
      "difficulty": "foundational",
      "question": "Which event starts cycle-time measurement for a work item that waits several days in the backlog before implementation?",
      "options": [
        {
          "key": "A",
          "text": "Initial creation of the work item",
          "rationale": "Creation starts lead time, including the prework queue interval."
        },
        {
          "key": "B",
          "text": "Creation of the first linked pull request",
          "rationale": "A pull-request event is not necessarily the work item's active-state transition."
        },
        {
          "key": "C",
          "text": "Assignment of the release version label",
          "rationale": "A release label does not define when implementation work began."
        },
        {
          "key": "D",
          "text": "Transition into an active work state",
          "rationale": "Cycle time starts with active work rather than backlog arrival."
        }
      ],
      "correctAnswers": [
        "D"
      ],
      "explanation": "Creation starts lead time, including the prework queue interval. A pull-request event is not necessarily the work item's active-state transition. A release label does not define when implementation work began. Cycle time starts with active work rather than backlog arrival.",
      "sourceIds": [
        "S1"
      ]
    },
    {
