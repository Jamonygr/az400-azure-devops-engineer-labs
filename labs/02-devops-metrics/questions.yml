        {
          "key": "C",
          "text": "Average both dashboards and use the combined number as a common baseline",
          "rationale": "Combining unlike definitions does not remove the underlying measurement mismatch."
        },
        {
          "key": "D",
          "text": "Normalize only by developer headcount and keep the different start states",
          "rationale": "Headcount adjustment cannot make different elapsed-time definitions equivalent."
        }
      ],
      "correctAnswers": [
        "B"
      ],
      "explanation": "The smaller value may simply omit work counted by the other definition. Comparable intervals and populations are prerequisites for interpreting a cross-team ranking. Combining unlike definitions does not remove the underlying measurement mismatch. Headcount adjustment cannot make different elapsed-time definitions equivalent.",
