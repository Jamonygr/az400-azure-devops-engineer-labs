          "text": "Six hours lead time and four hours cycle time",
          "rationale": "Lead time includes two waiting hours plus four active hours."
        },
        {
          "key": "B",
          "text": "Four hours lead time and six hours cycle time",
          "rationale": "This reverses the start events used by the two measurements."
        },
        {
          "key": "C",
          "text": "Two hours lead time and four hours cycle time",
          "rationale": "The two-hour value is waiting time, not total lead time."
        },
        {
          "key": "D",
          "text": "Six hours lead time and two hours cycle time",
          "rationale": "The two-hour interval ends at work start rather than completion."
        }
      ],
      "correctAnswers": [
        "A"
      ],
      "explanation": "Lead time includes two waiting hours plus four active hours. This reverses the start events used by the two measurements. The two-hour value is waiting time, not total lead time. The two-hour interval ends at work start rather than completion.",
