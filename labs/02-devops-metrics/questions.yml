          "rationale": "The smaller value may simply omit work counted by the other definition."
        },
        {
          "key": "B",
          "text": "Publish the state definitions, compare equivalent cohorts, and explain remaining workflow differences",
          "rationale": "Comparable intervals and populations are prerequisites for interpreting a cross-team ranking."
