<svg xmlns="http://www.w3.org/2000/svg" width="760" height="650" viewBox="0 0 760 650" role="img" aria-labelledby="title desc"><title id="title">Lab 02: Delivery observations and the metric review</title><desc id="desc">The collector reads the sandbox Actions run inventory while the exercise computes flow and quality measures from an explicitly synthetic JSON dataset. PowerShell produces a Markdown review with denominators and sample-size limits. The engineering decision follows the measurements; no synthetic value is presented as production telemetry. Relationships: GitHub Actions API to PowerShell collector: run inventory; PowerShell collector to Synthetic observations: explicit data source; Synthetic observations to Flow / quality metrics: time-window aggregates; Flow / quality metrics to Markdown metric review: values and limits; Markdown metric review to Engineering decision: one improvement action</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto-start-reverse"><path d="M0,0 L0,8 L8,4 z" fill="#0369a1"/></marker></defs>
<rect width="760" height="650" rx="16" fill="#f0f9ff"/>
<text x="22" y="30" fill="#0c4a6e" font-size="19" font-weight="bold" font-family="sans-serif">Lab 02: Delivery observations and the metric review</text>
<path d="M210,160.0 H285" fill="none" stroke="#0369a1" stroke-width="2" marker-end="url(#arrow)" data-from="api" data-to="collector"><title>run inventory</title></path>
