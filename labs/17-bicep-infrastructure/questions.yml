      "difficulty": "applied",
      "question": "A second run uses the same resource identities and desired settings. What should a declarative infrastructure deployment aim to do?",
      "options": [
        {
          "key": "A",
          "text": "Create an additional copy",
          "rationale": "Repeated duplication indicates changing identities instead of desired-state resource convergence."
        },
        {
          "key": "B",
          "text": "Skip property checks forever",
          "rationale": "Existing resources can drift and still require comparison with desired configuration."
        },
        {
          "key": "C",
          "text": "Rename every existing resource",
          "rationale": "Renaming changes resource identities and obstructs straightforward idempotent configuration reconciliation."
        },
        {
          "key": "D",
          "text": "Converge to the same state",
          "rationale": "Stable resource identities allow retries to reconcile intended configuration without duplication."
        }
      ],
      "correctAnswers": [
        "D"
      ],
      "explanation": "Repeated duplication indicates changing identities instead of desired-state resource convergence. Existing resources can drift and still require comparison with desired configuration. Renaming changes resource identities and obstructs straightforward idempotent configuration reconciliation. Stable resource identities allow retries to reconcile intended configuration without duplication.",
      "sourceIds": [
