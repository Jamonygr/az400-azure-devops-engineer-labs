    {
      "id": "L17-Q019",
      "checkpointId": "CP2",
      "objectiveIds": [
        "D3.5.3"
      ],
      "difficulty": "applied",
      "question": "The selected group has a different run's ownership marker although the current identity can write there. What should execution do?",
      "options": [
        {
          "key": "A",
          "text": "Deploy and repair ownership later",
          "rationale": "Postdeployment metadata changes cannot establish the original resource ownership authorization."
        },
        {
          "key": "B",
          "text": "Change only the local run ID",
          "rationale": "Changing local metadata does not authorize adopting the existing resource group."
        },
        {
          "key": "C",
          "text": "Refuse the mismatched context",
          "rationale": "Write authorization does not establish ownership under this run's lifecycle journal."
        },
        {
          "key": "D",
