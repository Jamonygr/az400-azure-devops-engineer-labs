  "questions": [
    {
      "id": "L17-Q001",
      "checkpointId": "CP1",
      "objectiveIds": [
        "D3.5.3"
      ],
      "difficulty": "foundational",
      "question": "A pull request changes a Bicep property and must fail before any Azure authentication. Which check fits?",
      "options": [
        {
          "key": "A",
          "text": "Run production what-if only",
          "rationale": "What-if requires Azure context rather than purely offline validation."
        },
        {
          "key": "B",
          "text": "Review resource names only",
          "rationale": "Name inspection cannot validate the declaration's property types or syntax."
        },
        {
          "key": "C",
          "text": "Compile and lint locally",
          "rationale": "Local compilation catches source mistakes without contacting Azure services."
        },
        {
          "key": "D",
          "text": "Deploy and read errors",
          "rationale": "Deployment can change resources before exposing the source mistake."
        }
      ],
      "correctAnswers": [
        "C"
      ],
      "explanation": "What-if requires Azure context rather than purely offline validation. Name inspection cannot validate the declaration's property types or syntax. Local compilation catches source mistakes without contacting Azure services. Deployment can change resources before exposing the source mistake.",
      "sourceIds": [
        "S2"
      ],
      "exhibit": {
        "language": "bicep",
        "code": "resource account 'Microsoft.Storage/storageAccounts@2025-01-01' = {\n  name: 'example'\n  properties: { typoProperty: true }\n}"
      }
    },
    {
      "id": "L17-Q002",
      "checkpointId": "CP1",
      "objectiveIds": [
        "D3.5.3"
      ],
      "difficulty": "foundational",
      "question": "Three environments need the same resource declarations but different locations and account names. How should the team organize them?",
      "options": [
        {
          "key": "A",
          "text": "Use a parameterized module",
          "rationale": "Modules share declarations while explicit parameters capture environment specific choices."
        },
        {
          "key": "B",
          "text": "Copy all declarations three times",
          "rationale": "Duplicated declarations can drift when security changes reach fewer copies."
        },
        {
          "key": "C",
          "text": "Hardcode production settings everywhere",
          "rationale": "Hardcoded values prevent callers selecting the intended environment configuration."
        },
        {
          "key": "D",
          "text": "Patch generated JSON with regex",
          "rationale": "Text replacement obscures typed inputs and the intended source contract."
        }
      ],
      "correctAnswers": [
        "A"
      ],
      "explanation": "Modules share declarations while explicit parameters capture environment specific choices. Duplicated declarations can drift when security changes reach fewer copies. Hardcoded values prevent callers selecting the intended environment configuration. Text replacement obscures typed inputs and the intended source contract.",
      "sourceIds": [
        "S3"
      ]
    },
    {
      "id": "L17-Q003",
      "checkpointId": "CP2",
      "objectiveIds": [
        "D3.5.3"
      ],
      "difficulty": "applied",
      "question": "A reviewer needs to see proposed changes to existing resources before approving this template. Which operation provides that evidence?",
      "options": [
        {
          "key": "A",
          "text": "Compile without Azure context",
          "rationale": "Compilation checks source rather than comparing deployed resource configuration."
        },
        {
          "key": "B",
          "text": "Run deployment before review",
          "rationale": "Applying changes first defeats review of the planned resource modifications."
        },
        {
          "key": "C",
          "text": "Run scoped what-if",
          "rationale": "What-if predicts changes using the selected template, parameters and scope."
        },
        {
          "key": "D",
          "text": "Read deployment history only",
          "rationale": "Historical records do not evaluate the newly proposed infrastructure declaration."
        }
      ],
      "correctAnswers": [
        "C"
      ],
      "explanation": "Compilation checks source rather than comparing deployed resource configuration. Applying changes first defeats review of the planned resource modifications. What-if predicts changes using the selected template, parameters and scope. Historical records do not evaluate the newly proposed infrastructure declaration.",
      "sourceIds": [
        "S1"
      ]
    },
    {
      "id": "L17-Q004",
      "checkpointId": "CP1",
      "objectiveIds": [
        "D3.5.3"
      ],
      "difficulty": "applied",
      "question": "A consumer module needs the exact resource ID created by another module. Which interface avoids duplicated naming logic?",
      "options": [
        {
          "key": "A",
          "text": "Parse a deployment display name",
          "rationale": "An operation name is not the created resource's complete identifier."
        },
        {
          "key": "B",
          "text": "Search every subscription by prefix",
          "rationale": "Prefix discovery can select unrelated resources outside the intended deployment scope."
        },
        {
          "key": "C",
          "text": "Expose a resource ID output",
          "rationale": "Explicit outputs provide a stable reference between dependent infrastructure modules."
        },
        {
          "key": "D",
          "text": "Duplicate its name algorithm",
          "rationale": "Duplicated naming logic couples consumers to the producer's implementation details."
        }
      ],
      "correctAnswers": [
        "C"
      ],
      "explanation": "An operation name is not the created resource's complete identifier. Prefix discovery can select unrelated resources outside the intended deployment scope. Explicit outputs provide a stable reference between dependent infrastructure modules. Duplicated naming logic couples consumers to the producer's implementation details.",
      "sourceIds": [
        "S3"
      ]
    },
    {
      "id": "L17-Q005",
      "checkpointId": "CP2",
      "objectiveIds": [
        "D3.5.3"
      ],
      "difficulty": "advanced",
      "question": "Approval covered test parameters, but the queued job changes both subscription and SKU. Which action preserves a meaningful production gate?",
      "options": [
        {
          "key": "A",
          "text": "Review a fresh production preview",
          "rationale": "Approval must cover the actual artifact, target scope and parameter choices."
        },
        {
          "key": "B",
          "text": "Reuse approval for identical source",
          "rationale": "Different parameters and scopes can materially change resources and spending."
        },
        {
          "key": "C",
          "text": "Deploy then attach old approval",
          "rationale": "Earlier unrelated evidence cannot authorize newly selected production resource changes."
        },
        {
          "key": "D",
          "text": "Approve changed parameters after a local compile only",
          "rationale": "Compilation checks syntax and types but does not evaluate target-specific provider changes or cost."
        }
      ],
      "correctAnswers": [
        "A"
      ],
      "explanation": "Approval must cover the actual artifact, target scope and parameter choices. Different parameters and scopes can materially change resources and spending. Earlier unrelated evidence cannot authorize newly selected production resource changes. Compilation checks syntax and types but does not evaluate target-specific provider changes or cost.",
      "sourceIds": [
        "S1",
        "S3"
      ],
      "exhibit": {
        "language": "powershell",
        "code": "az deployment group what-if --subscription $TestSub --resource-group $TestGroup --parameters sku=B1\n# Later queued operation:\naz deployment group create --subscription $ProdSub --resource-group $ProdGroup --parameters sku=S1"
      }
    },
    {
      "id": "L17-Q006",
      "checkpointId": "CP1",
      "objectiveIds": [
        "D3.5.3"
      ],
      "difficulty": "foundational",
      "question": "The app module supports optional private networking, and development callers have no subnet. Which input contract best supports both topologies?",
      "options": [
        {
          "key": "A",
          "text": "Hide a fixed subnet ID",
          "rationale": "A hidden environment dependency prevents safe reuse across deployment scopes."
        },
        {
          "key": "B",
          "text": "Choose the first existing subnet",
          "rationale": "List order cannot identify the caller's intended network integration target."
        },
        {
          "key": "C",
          "text": "Make subnet optional and conditional",
          "rationale": "An explicit optional input supports callers with and without integration infrastructure."
        },
        {
          "key": "D",
          "text": "Require a placeholder production subnet",
          "rationale": "A placeholder introduces unnecessary dependencies and can select incorrect network context."
        }
      ],
      "correctAnswers": [
        "C"
      ],
      "explanation": "A hidden environment dependency prevents safe reuse across deployment scopes. List order cannot identify the caller's intended network integration target. An explicit optional input supports callers with and without integration infrastructure. A placeholder introduces unnecessary dependencies and can select incorrect network context.",
      "sourceIds": [
        "S3"
      ]
    },
    {
      "id": "L17-Q007",
      "checkpointId": "CP1",
      "objectiveIds": [
        "D3.5.3"
      ],
      "difficulty": "applied",
      "question": "Refactoring left an unused Bicep parameter that no caller needs. Which change improves the public module contract?",
      "options": [
        {
          "key": "A",
          "text": "Mention it in a comment",
          "rationale": "Comments cannot make an unused parameter affect the deployed resources."
        },
        {
          "key": "B",
          "text": "Pass different values per environment",
          "rationale": "Changing unused values still has no effect on resource declarations."
        },
        {
          "key": "C",
          "text": "Remove the unused input",
          "rationale": "Removing obsolete inputs makes the intended deployment interface easier to understand."
        },
        {
          "key": "D",
          "text": "Disable the complete analyzer",
          "rationale": "Global suppression hides unrelated warnings without improving the module contract."
        }
      ],
      "correctAnswers": [
        "C"
      ],
      "explanation": "Comments cannot make an unused parameter affect the deployed resources. Changing unused values still has no effect on resource declarations. Removing obsolete inputs makes the intended deployment interface easier to understand. Global suppression hides unrelated warnings without improving the module contract.",
      "sourceIds": [
        "S2"
      ],
      "exhibit": {
        "language": "bicep",
        "code": "param obsoleteRegion string\nparam location string = resourceGroup().location\n// All resources use location; none reference obsoleteRegion."
      }
    },
    {
      "id": "L17-Q008",
      "checkpointId": "CP1",
      "objectiveIds": [
        "D3.5.3"
      ],
      "difficulty": "applied",
      "question": "Storage names must stay stable on retries but differ across resource groups. Which suffix input supports that requirement?",
      "options": [
        {
          "key": "A",
          "text": "Use one fixed global name",
          "rationale": "A fixed name can collide across independently deployed resource groups."
        },
        {
          "key": "B",
          "text": "Generate a random suffix each run",
          "rationale": "Random names prevent straightforward reconciliation with previously created owned resources."
        },
        {
          "key": "C",
          "text": "Use the resource group ID",
          "rationale": "A scoped stable identifier supports repeatable names across deployment retries."
        },
        {
          "key": "D",
          "text": "Use the current timestamp",
          "rationale": "Time changes on retries and creates additional resource identities instead."
        }
      ],
      "correctAnswers": [
        "C"
      ],
      "explanation": "A fixed name can collide across independently deployed resource groups. Random names prevent straightforward reconciliation with previously created owned resources. A scoped stable identifier supports repeatable names across deployment retries. Time changes on retries and creates additional resource identities instead.",
      "sourceIds": [
        "S3"
      ]
    },
    {
      "id": "L17-Q009",
      "checkpointId": "CP1",
      "objectiveIds": [
        "D3.5.3"
      ],
      "difficulty": "applied",
      "question": "The team wants one Bicep linter finding to fail pull requests consistently. Where should its enforcement severity be set?",
      "options": [
        {
          "key": "A",
          "text": "Only in an editor-local configuration",
          "rationale": "An editor-local preference does not enforce the same rule in shared CI builds."
        },
        {
          "key": "B",
          "text": "In the deployment parameter file only",
          "rationale": "Deployment parameters select template inputs rather than the local analyzer rule severity used by repository compilation."
        },
        {
          "key": "C",
          "text": "In repository bicepconfig.json",
          "rationale": "Repository configuration makes the selected analysis rule an enforceable build gate."
        },
        {
          "key": "D",
          "text": "In a rule-specific inline suppression at each occurrence",
          "rationale": "Suppressing the finding removes that diagnostic rather than configuring the shared rule to reject future violations."
        }
      ],
      "correctAnswers": [
        "C"
      ],
      "explanation": "An editor-local preference does not enforce the same rule in shared CI builds. Deployment parameters select template inputs rather than the local analyzer rule severity used by repository compilation. Repository configuration makes the selected analysis rule an enforceable build gate. Suppressing the finding removes that diagnostic rather than configuring the shared rule to reject future violations.",
      "sourceIds": [
        "S2"
      ]
    },
