          "text": "Inspect the expression and live state",
          "rationale": "Runtime evaluation limitations can produce differences that need additional review."
        },
        {
          "key": "B",
          "text": "Assume destructive replacement is certain",
          "rationale": "A modification record does not always mean a resource replacement occurs."
        },
        {
          "key": "C",
          "text": "Delete the existing resource immediately",
          "rationale": "Deleting changes state without explaining the unresolved expression's actual meaning."
        },
        {
          "key": "D",
          "text": "Suppress every future preview",
          "rationale": "Blanket suppression hides genuine changes unrelated to the evaluation limitation."
        }
      ],
      "correctAnswers": [
        "A"
      ],
      "explanation": "Runtime evaluation limitations can produce differences that need additional review. A modification record does not always mean a resource replacement occurs. Deleting changes state without explaining the unresolved expression's actual meaning. Blanket suppression hides genuine changes unrelated to the evaluation limitation.",
