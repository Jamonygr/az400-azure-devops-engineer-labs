      "question": "A webhook receiver sometimes receives the same delivery twice. Creating two follow-up work items would corrupt the queue. Which receiver design addresses this?",
      "options": [
        {
          "key": "A",
          "text": "Assume GitHub delivers each event exactly once and remove duplicate checks",
          "rationale": "Robust webhook handling must account for repeat deliveries."
        },
        {
          "key": "B",
          "text": "Assign a new random event identity on every retry",
          "rationale": "A new random identity hides the fact that two requests represent the same delivery."
        },
        {
          "key": "C",
          "text": "Track a stable delivery identifier and make processing idempotent",
          "rationale": "Delivery deduplication prevents repeat handling from creating duplicate work for the same event."
        },
        {
          "key": "D",
          "text": "Compare only the issue title and discard every later matching title",
          "rationale": "Distinct events can legitimately share a title, so this can suppress real work."
        }
      ],
      "correctAnswers": [
