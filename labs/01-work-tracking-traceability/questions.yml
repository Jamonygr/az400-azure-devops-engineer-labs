      "id": "L01-Q001",
      "checkpointId": "CP4",
      "objectiveIds": [
        "D1.1.1"
      ],
      "difficulty": "foundational",
      "question": "Short-lived branches: A team waits three weeks to integrate feature work, and conflicts delay feedback despite daily successful local tests. Which workflow change reduces the delay before developers discover conflicts with colleagues' changes?",
      "options": [
        {
          "key": "A",
          "text": "Run the existing branch's local tests twice daily",
          "rationale": "More isolated tests do not exercise integration. Short feedback cycles reduce integration batch size."
        },
        {
          "key": "B",
          "text": "Merge features only when the release branch freezes",
          "rationale": "This postpones integration until the busiest period. Short feedback cycles reduce integration batch size."
        },
        {
          "key": "C",
          "text": "Create a separate permanent branch for each developer",
          "rationale": "Permanent isolation increases divergence rather than reducing it. Short feedback cycles reduce integration batch size."
        },
        {
          "key": "D",
          "text": "Integrate small pull requests into the default branch frequently",
          "rationale": "Short feedback cycles reduce integration batch size."
        }
      ],
      "correctAnswers": [
        "D"
      ],
      "explanation": "Short feedback cycles reduce integration batch size. More isolated tests do not exercise integration. This postpones integration until the busiest period. Permanent isolation increases divergence rather than reducing it.",
      "sourceIds": [
        "S3"
      ],
      "exhibit": {
        "language": "text",
        "code": "main:       A---B---C---D\nfeature:    A---E---F---G  (21 days unmerged)\nLocal tests on E, F, G: passed\nIntegration conflict at merge: shared dependency version"
      }
    },
