      ],
      "difficulty": "foundational",
      "question": "A GitHub pull request implements issue 42 in the same repository. The author wants the issue to close when the change reaches the default branch. Which description text expresses that intent?",
      "options": [
        {
          "key": "A",
          "text": "Related to #42",
          "rationale": "This references the issue but does not use a supported automatic closing keyword."
        },
        {
          "key": "B",
          "text": "Fixes PR 42",
          "rationale": "This does not identify issue 42 using the supported issue-reference syntax."
        },
        {
          "key": "C",
          "text": "AB#42",
          "rationale": "This is Azure Boards reference syntax rather than a GitHub issue-closing instruction."
        },
        {
          "key": "D",
          "text": "Fixes #42",
          "rationale": "A supported closing keyword followed by the local issue reference links the work and requests closure on the qualifying merge."
        }
      ],
      "correctAnswers": [
        "D"
      ],
      "explanation": "This references the issue but does not use a supported automatic closing keyword. This does not identify issue 42 using the supported issue-reference syntax. This is Azure Boards reference syntax rather than a GitHub issue-closing instruction. A supported closing keyword followed by the local issue reference links the work and requests closure on the qualifying merge.",
      "sourceIds": [
        "S1"
      ]
    },
