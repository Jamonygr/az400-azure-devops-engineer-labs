<text x="22" y="480" fill="#0c4a6e" font-family="sans-serif" font-weight="bold" font-size="16">Relationships</text>
<text x="22" y="507" fill="#0f172a" font-family="sans-serif" font-size="14.5">1. reciprocal hyperlinks</text>
<text x="392" y="507" fill="#0f172a" font-family="sans-serif" font-size="14.5">2. change reference</text>
<text x="22" y="545" fill="#0f172a" font-family="sans-serif" font-size="14.5">3. source revision</text>
<text x="392" y="545" fill="#0f172a" font-family="sans-serif" font-size="14.5">4. delivery evidence</text>
<text x="22" y="583" fill="#0f172a" font-family="sans-serif" font-size="14.5">5. scoped issue API</text>
<text x="392" y="583" fill="#0f172a" font-family="sans-serif" font-size="14.5">6. scoped Boards API</text>
<text x="22" y="621" fill="#0f172a" font-family="sans-serif" font-size="14.5">7. task and issue IDs</text>
<text x="22" y="668" fill="#334155" font-family="sans-serif" font-size="12">Solid: core relationship · Dashed: separately gated integration · See walkthrough for verification limits.</text>
