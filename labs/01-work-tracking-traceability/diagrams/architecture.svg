<svg xmlns="http://www.w3.org/2000/svg" width="760" height="682" viewBox="0 0 760 682" role="img" aria-labelledby="title desc"><title id="title">Lab 01: Cross-platform work-item traceability</title><desc id="desc">GitHub issues and Azure Boards tasks contain reciprocal links inside the owned repository and project. PowerShell queries both APIs and writes a local traceability index. Commit and build references are the next evidence layer added by the job challenge; the hyperlinks alone do not prove delivery. Relationships: GitHub issue to Azure Boards task: reciprocal hyperlinks; Azure Boards task to Git commit reference: change reference; Git commit reference to Build run reference: source revision; Build run reference to Traceability JSON index: delivery evidence; PowerShell / gh / az to GitHub issue: scoped issue API; PowerShell / gh / az to Azure Boards task: scoped Boards API; Azure Boards task to Traceability JSON index: task and issue IDs</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto-start-reverse"><path d="M0,0 L0,8 L8,4 z" fill="#0369a1"/></marker></defs>
<rect width="760" height="682" rx="16" fill="#f0f9ff"/>
<text x="22" y="30" fill="#0c4a6e" font-size="19" font-weight="bold" font-family="sans-serif">Lab 01: Cross-platform work-item traceability</text>
<path d="M210,160.0 H285" fill="none" stroke="#0369a1" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)" data-from="issue" data-to="boards"><title>reciprocal hyperlinks</title></path>
<circle cx="247.5" cy="160.0" r="11" fill="#ffffff" stroke="#0369a1" stroke-width="1.5"/><text x="247.5" y="164.5" text-anchor="middle" fill="#075985" font-size="13" font-weight="bold" font-family="sans-serif">1</text>
<path d="M475,160.0 H550" fill="none" stroke="#0369a1" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)" data-from="boards" data-to="commit"><title>change reference</title></path>
<circle cx="512.5" cy="160.0" r="11" fill="#ffffff" stroke="#0369a1" stroke-width="1.5"/><text x="512.5" y="164.5" text-anchor="middle" fill="#075985" font-size="13" font-weight="bold" font-family="sans-serif">2</text>
<path d="M645.0,220 V330" fill="none" stroke="#0369a1" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)" data-from="commit" data-to="build"><title>source revision</title></path>
<circle cx="645.0" cy="275.0" r="11" fill="#ffffff" stroke="#0369a1" stroke-width="1.5"/><text x="645.0" y="279.5" text-anchor="middle" fill="#075985" font-size="13" font-weight="bold" font-family="sans-serif">3</text>
<path d="M550,390.0 H475" fill="none" stroke="#0369a1" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)" data-from="build" data-to="index"><title>delivery evidence</title></path>
<circle cx="512.5" cy="390.0" r="11" fill="#ffffff" stroke="#0369a1" stroke-width="1.5"/><text x="512.5" y="394.5" text-anchor="middle" fill="#075985" font-size="13" font-weight="bold" font-family="sans-serif">4</text>
<path d="M115.0,330 V220" fill="none" stroke="#0369a1" stroke-width="2" marker-end="url(#arrow)" data-from="learner" data-to="issue"><title>scoped issue API</title></path>
<circle cx="115.0" cy="275.0" r="11" fill="#ffffff" stroke="#0369a1" stroke-width="1.5"/><text x="115.0" y="279.5" text-anchor="middle" fill="#075985" font-size="13" font-weight="bold" font-family="sans-serif">5</text>
<path d="M115.0,330 V289.0 H380.0 V220" fill="none" stroke="#0369a1" stroke-width="2" marker-end="url(#arrow)" data-from="learner" data-to="boards"><title>scoped Boards API</title></path>
<circle cx="247.5" cy="289.0" r="11" fill="#ffffff" stroke="#0369a1" stroke-width="1.5"/><text x="247.5" y="293.5" text-anchor="middle" fill="#075985" font-size="13" font-weight="bold" font-family="sans-serif">6</text>
<path d="M380.0,220 V330" fill="none" stroke="#0369a1" stroke-width="2" marker-end="url(#arrow)" data-from="boards" data-to="index"><title>task and issue IDs</title></path>
<circle cx="380.0" cy="275.0" r="11" fill="#ffffff" stroke="#0369a1" stroke-width="1.5"/><text x="380.0" y="279.5" text-anchor="middle" fill="#075985" font-size="13" font-weight="bold" font-family="sans-serif">7</text>
