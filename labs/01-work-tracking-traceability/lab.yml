    "topology": "GitHub issues and Azure Boards tasks contain reciprocal links inside the owned repository and project. PowerShell queries both APIs and writes a local traceability index. Commit and build references are the next evidence layer added by the job challenge; the hyperlinks alone do not prove delivery."
  },
  "verification": {
    "status": "not-run",
    "scope": "All checkpoint/fault scripts parse; the named fault lifecycle is independently tested with explicit provider doubles. Full normal provider execution and live cloud delivery have not run."
  },
  "solutionNotes": "The reciprocal URLs must resolve to the exact owned project/repository. A passing work-item index is useful planning evidence, but source-to-production traceability remains a separate integration milestone."
}
