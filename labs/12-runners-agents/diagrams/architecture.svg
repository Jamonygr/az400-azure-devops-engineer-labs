<svg xmlns="http://www.w3.org/2000/svg" width="760" height="650" viewBox="0 0 760 650" role="img" aria-labelledby="title desc"><title id="title">Lab 12: Agent trust boundaries and outbound control planes</title><desc id="desc">GitHub and Azure DevOps control planes communicate through explicit outbound HTTPS boundaries. Hosted ephemeral workers handle untrusted code; a separately designed private-network worker handles approved private jobs. Both depend on a maintained pinned tool/image baseline. Inventory and TCP reachability checks do not register a machine or prove hosted parallelism availability. Relationships: GitHub Actions control plane to Outbound HTTPS boundary: job / runner API; Azure DevOps control plane to Outbound HTTPS boundary: pool / agent API; Outbound HTTPS boundary to Hosted ephemeral worker: controlled outbound access; Outbound HTTPS boundary to Private-network worker design: approved private job path; Pinned tool / image baseline to Hosted ephemeral worker: known toolchain; Pinned tool / image baseline to Private-network worker design: maintained image contract</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto-start-reverse"><path d="M0,0 L0,8 L8,4 z" fill="#0369a1"/></marker></defs>
<rect width="760" height="650" rx="16" fill="#f0f9ff"/>
<text x="22" y="30" fill="#0c4a6e" font-size="19" font-weight="bold" font-family="sans-serif">Lab 12: Agent trust boundaries and outbound control planes</text>
<path d="M210,160.0 H550" fill="none" stroke="#0369a1" stroke-width="2" marker-end="url(#arrow)" data-from="github" data-to="https"><title>job / runner API</title></path>
<circle cx="380.0" cy="160.0" r="11" fill="#ffffff" stroke="#0369a1" stroke-width="1.5"/><text x="380.0" y="164.5" text-anchor="middle" fill="#075985" font-size="13" font-weight="bold" font-family="sans-serif">1</text>
<path d="M475,160.0 H550" fill="none" stroke="#0369a1" stroke-width="2" marker-end="url(#arrow)" data-from="ado" data-to="https"><title>pool / agent API</title></path>
<circle cx="512.5" cy="160.0" r="11" fill="#ffffff" stroke="#0369a1" stroke-width="1.5"/><text x="512.5" y="164.5" text-anchor="middle" fill="#075985" font-size="13" font-weight="bold" font-family="sans-serif">2</text>
<path d="M645.0,220 V330" fill="none" stroke="#0369a1" stroke-width="2" marker-end="url(#arrow)" data-from="https" data-to="hosted"><title>controlled outbound access</title></path>
<circle cx="645.0" cy="275.0" r="11" fill="#ffffff" stroke="#0369a1" stroke-width="1.5"/><text x="645.0" y="279.5" text-anchor="middle" fill="#075985" font-size="13" font-weight="bold" font-family="sans-serif">3</text>
<path d="M645.0,220 V261.0 H380.0 V330" fill="none" stroke="#0369a1" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)" data-from="https" data-to="private"><title>approved private job path</title></path>
<circle cx="512.5" cy="261.0" r="11" fill="#ffffff" stroke="#0369a1" stroke-width="1.5"/><text x="512.5" y="265.5" text-anchor="middle" fill="#075985" font-size="13" font-weight="bold" font-family="sans-serif">4</text>
<path d="M210,390.0 H550" fill="none" stroke="#0369a1" stroke-width="2" marker-end="url(#arrow)" data-from="image" data-to="hosted"><title>known toolchain</title></path>
<circle cx="380.0" cy="390.0" r="11" fill="#ffffff" stroke="#0369a1" stroke-width="1.5"/><text x="380.0" y="394.5" text-anchor="middle" fill="#075985" font-size="13" font-weight="bold" font-family="sans-serif">5</text>
<path d="M210,390.0 H285" fill="none" stroke="#0369a1" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)" data-from="image" data-to="private"><title>maintained image contract</title></path>
<circle cx="247.5" cy="390.0" r="11" fill="#ffffff" stroke="#0369a1" stroke-width="1.5"/><text x="247.5" y="394.5" text-anchor="middle" fill="#075985" font-size="13" font-weight="bold" font-family="sans-serif">6</text>
<g data-node="github"><rect x="20" y="100" width="190" height="120" rx="11" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/><text x="33" y="123" fill="#0284c7" font-family="sans-serif" font-size="12" font-weight="bold">PLATFORM</text>
<text x="33" y="148" fill="#0f172a" font-family="sans-serif" font-size="18">GitHub Actions</text>
<text x="33" y="170" fill="#0f172a" font-family="sans-serif" font-size="18">control plane</text>
</g>
<g data-node="ado"><rect x="285" y="100" width="190" height="120" rx="11" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/><text x="298" y="123" fill="#0284c7" font-family="sans-serif" font-size="12" font-weight="bold">PLATFORM</text>
<text x="298" y="148" fill="#0f172a" font-family="sans-serif" font-size="18">Azure DevOps</text>
<text x="298" y="170" fill="#0f172a" font-family="sans-serif" font-size="18">control plane</text>
</g>
<g data-node="https"><rect x="550" y="100" width="190" height="120" rx="11" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/><text x="563" y="123" fill="#0284c7" font-family="sans-serif" font-size="12" font-weight="bold">PLATFORM</text>
<text x="563" y="148" fill="#0f172a" font-family="sans-serif" font-size="18">Outbound HTTPS</text>
<text x="563" y="170" fill="#0f172a" font-family="sans-serif" font-size="18">boundary</text>
</g>
<g data-node="hosted"><rect x="550" y="330" width="190" height="120" rx="11" fill="#ffffff" stroke="#0284c7" stroke-width="2"/><text x="563" y="353" fill="#0284c7" font-family="sans-serif" font-size="12" font-weight="bold">CODE</text>
<text x="563" y="378" fill="#0f172a" font-family="sans-serif" font-size="18">Hosted ephemeral</text>
<text x="563" y="400" fill="#0f172a" font-family="sans-serif" font-size="18">worker</text>
</g>
<g data-node="private"><rect x="285" y="330" width="190" height="120" rx="11" fill="#ffffff" stroke="#0284c7" stroke-width="2"/><text x="298" y="353" fill="#0284c7" font-family="sans-serif" font-size="12" font-weight="bold">CODE</text>
<text x="298" y="378" fill="#0f172a" font-family="sans-serif" font-size="18">Private-network</text>
<text x="298" y="400" fill="#0f172a" font-family="sans-serif" font-size="18">worker design</text>
</g>
<g data-node="image"><rect x="20" y="330" width="190" height="120" rx="11" fill="#ecfdf5" stroke="#059669" stroke-width="2"/><text x="33" y="353" fill="#059669" font-family="sans-serif" font-size="12" font-weight="bold">DATA</text>
<text x="33" y="378" fill="#0f172a" font-family="sans-serif" font-size="18">Pinned tool / image</text>
