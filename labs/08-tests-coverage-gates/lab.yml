{
  "schemaVersion": "1.0.0",
  "id": "08",
  "slug": "08-tests-coverage-gates",
  "title": "Run tests, collect coverage, and enforce quality",
  "domain": "pipelines",
  "minutes": 120,
  "cost": "none",
  "platforms": [
    "local"
  ],
  "objectives": [
    "D1.2.4",
    "D3.2.1",
    "D3.2.2",
    "D3.2.3",
    "D3.2.4"
  ],
  "scenario": "The team has a green build but cannot show which API behaviors or code paths were tested. Produce test results, coverage, and an explicit release decision.",
  "role": "Quality engineer",
  "outcome": "Run tests, collect coverage, and enforce quality.",
  "checkpoints": [
    {
      "id": "CP1",
      "title": "Restore locked sample dependencies",
      "commands": "dotnet restore (Join-Path $RepoRoot 'samples/DevOps.slnx') --locked-mode\n if ($LASTEXITCODE -ne 0) { throw 'Locked restore failed.' }\n Get-ChildItem (Join-Path $RepoRoot 'samples') -Filter packages.lock.json -Recurse|Select-Object FullName\n",
      "expected": "The lock files resolve without implicit dependency changes.",
      "positive": "$locks=Get-ChildItem (Join-Path $RepoRoot 'samples') -Filter packages.lock.json -Recurse\n if ($locks.Count -lt 2) { throw 'Both API and test dependency locks are required.' }\n",
      "negative": "$locks=Get-ChildItem (Join-Path $RepoRoot 'samples') -Filter packages.lock.json -Recurse\n if (@($locks|Where-Object Length -eq 0).Count) { throw 'Empty dependency lock.' }\n",
      "validate": "$locks=Get-ChildItem (Join-Path $RepoRoot 'samples') -Filter packages.lock.json -Recurse\n if ($locks.Count -lt 2) { throw 'Both API and test dependency locks are required.' }\n\n$locks=Get-ChildItem (Join-Path $RepoRoot 'samples') -Filter packages.lock.json -Recurse\n if (@($locks|Where-Object Length -eq 0).Count) { throw 'Empty dependency lock.' }\n",
      "evidence": "Lock hashes and restore result.",
      "fix": "Update lock files in a reviewed source change; never relax locked-mode silently."
    },
    {
      "id": "CP2",
      "title": "Run tests and retain machine-readable results",
      "commands": "dotnet test (Join-Path $RepoRoot 'samples/DevOps.slnx') --configuration Release --logger \"trx;LogFileName=quality.trx\" --results-directory (Join-Path $WorkRoot 'results')\n if ($LASTEXITCODE -ne 0) { throw 'Test gate failed.' }\n",
      "expected": "The result summary contains passing API tests.",
      "positive": "$t=Get-ChildItem (Join-Path $WorkRoot 'results') -Filter '*.trx' -Recurse|Select-Object -First 1\n $x=[xml](Get-Content $t.FullName -Raw);if ([int]$x.TestRun.ResultSummary.Counters.passed -lt 1) { throw 'No passing tests.' }\n",
      "negative": "$t=Get-ChildItem (Join-Path $WorkRoot 'results') -Filter '*.trx' -Recurse|Select-Object -First 1\n $x=[xml](Get-Content $t.FullName -Raw);if ([int]$x.TestRun.ResultSummary.Counters.failed -gt 0) { throw 'Failed tests cannot pass release gate.' }\n",
      "validate": "$t=Get-ChildItem (Join-Path $WorkRoot 'results') -Filter '*.trx' -Recurse|Select-Object -First 1\n $x=[xml](Get-Content $t.FullName -Raw);if ([int]$x.TestRun.ResultSummary.Counters.passed -lt 1) { throw 'No passing tests.' }\n\n$t=Get-ChildItem (Join-Path $WorkRoot 'results') -Filter '*.trx' -Recurse|Select-Object -First 1\n $x=[xml](Get-Content $t.FullName -Raw);if ([int]$x.TestRun.ResultSummary.Counters.failed -gt 0) { throw 'Failed tests cannot pass release gate.' }\n",
      "evidence": "TRX counts and failure messages with sensitive payloads removed.",
      "fix": "Repair the failing behavior or test fixture; do not mark a failing test run successful."
    },
    {
      "id": "CP3",
      "title": "Collect coverage independently of test count",
      "commands": "dotnet test (Join-Path $RepoRoot 'samples/DevOps.slnx') --configuration Release --settings (Join-Path $RepoRoot 'samples/coverage.runsettings') --collect 'XPlat Code Coverage' --results-directory (Join-Path $WorkRoot 'coverage')\n if ($LASTEXITCODE -ne 0) { throw 'Coverage test run failed.' }\n Get-ChildItem (Join-Path $WorkRoot 'coverage') -Filter coverage.cobertura.xml -Recurse|Select-Object FullName\n",
      "expected": "Cobertura reports include measured line and branch coverage.",
      "positive": "$f=Get-ChildItem (Join-Path $WorkRoot 'coverage') -Filter coverage.cobertura.xml -Recurse|Select-Object -First 1\n $c=[xml](Get-Content $f.FullName -Raw);if ([double]$c.coverage.'line-rate' -le 0) { throw 'No measured line coverage.' }\n",
      "negative": "$f=Get-ChildItem (Join-Path $WorkRoot 'coverage') -Filter coverage.cobertura.xml -Recurse|Select-Object -First 1\n $c=[xml](Get-Content $f.FullName -Raw);if ([double]$c.coverage.'line-rate' -gt 1) { throw 'Coverage fraction out of range.' }\n",
      "validate": "$f=Get-ChildItem (Join-Path $WorkRoot 'coverage') -Filter coverage.cobertura.xml -Recurse|Select-Object -First 1\n $c=[xml](Get-Content $f.FullName -Raw);if ([double]$c.coverage.'line-rate' -le 0) { throw 'No measured line coverage.' }\n\n$f=Get-ChildItem (Join-Path $WorkRoot 'coverage') -Filter coverage.cobertura.xml -Recurse|Select-Object -First 1\n $c=[xml](Get-Content $f.FullName -Raw);if ([double]$c.coverage.'line-rate' -gt 1) { throw 'Coverage fraction out of range.' }\n",
      "evidence": "Cobertura summary and instrumentation scope.",
      "fix": "Confirm coverlet collector is installed and the tested assembly is included."
    },
    {
      "id": "CP4",
      "title": "Evaluate a documented release quality threshold",
      "commands": "$f=Get-ChildItem (Join-Path $WorkRoot 'coverage') -Filter coverage.cobertura.xml -Recurse|Select-Object -First 1\n $c=[xml](Get-Content $f.FullName -Raw);$lineRate=[double]$c.coverage.'line-rate'\n [ordered]@{minimum=0.65;actual=$lineRate;passed=($lineRate -ge 0.65);scope='sample API lines'}|ConvertTo-Json|Set-Content (Join-Path $WorkRoot 'coverage-gate.json')\n if ($lineRate -lt 0.65) { throw 'Line coverage below documented 65% learning threshold.' }\n",
      "expected": "The threshold is explicit and fails when measured coverage is inadequate.",
      "positive": "$g=Get-Content (Join-Path $WorkRoot 'coverage-gate.json') -Raw|ConvertFrom-Json\n if (-not $g.passed -or $g.actual -lt $g.minimum) { throw 'Coverage release gate failed.' }\n",
      "negative": "$g=Get-Content (Join-Path $WorkRoot 'coverage-gate.json') -Raw|ConvertFrom-Json\n if ($g.minimum -le 0) { throw 'Disabled coverage gate.' }\n",
      "validate": "$g=Get-Content (Join-Path $WorkRoot 'coverage-gate.json') -Raw|ConvertFrom-Json\n if (-not $g.passed -or $g.actual -lt $g.minimum) { throw 'Coverage release gate failed.' }\n\n$g=Get-Content (Join-Path $WorkRoot 'coverage-gate.json') -Raw|ConvertFrom-Json\n if ($g.minimum -le 0) { throw 'Disabled coverage gate.' }\n",
      "evidence": "Actual value, threshold, tested scope, and gate decision.",
      "fix": "Improve exercised behavior; threshold changes require reviewed justification."
    },
    {
      "id": "CP5",
      "title": "Separate test layers and external load gates",
      "commands": "$strategy=[ordered]@{unit='pure behavior checks';integration='WebApplicationFactory with isolated SQLite';load='separate approved endpoint and budget';release=@('tests pass','coverage>=0.65','security checks clear');productionTrafficAllowed=$false}\n $strategy|ConvertTo-Json|Set-Content (Join-Path $WorkRoot 'test-strategy.json')\n",
      "expected": "Test layers and release gates are explicit; load testing requires a separate sandbox endpoint.",
      "positive": "$s=Get-Content (Join-Path $WorkRoot 'test-strategy.json') -Raw|ConvertFrom-Json\n if ($s.integration -notmatch 'isolated SQLite' -or $s.release.Count -ne 3) { throw 'Test layers/gates incomplete.' }\n",
      "negative": "$s=Get-Content (Join-Path $WorkRoot 'test-strategy.json') -Raw|ConvertFrom-Json\n if ($s.productionTrafficAllowed) { throw 'This exercise cannot send production load.' }\n",
      "validate": "$s=Get-Content (Join-Path $WorkRoot 'test-strategy.json') -Raw|ConvertFrom-Json\n if ($s.integration -notmatch 'isolated SQLite' -or $s.release.Count -ne 3) { throw 'Test layers/gates incomplete.' }\n\n$s=Get-Content (Join-Path $WorkRoot 'test-strategy.json') -Raw|ConvertFrom-Json\n if ($s.productionTrafficAllowed) { throw 'This exercise cannot send production load.' }\n",
      "evidence": "Layer-to-risk matrix and approval requirements for future load tests.",
      "fix": "Keep load generation outside ordinary PR CI and bound concurrency, duration, and cost."
    }
  ],
  "breakFix": {
    "trigger": "$g=Get-Content (Join-Path $WorkRoot 'coverage-gate.json') -Raw|ConvertFrom-Json;$g.minimum=1.01;$g.passed=$false;$g|ConvertTo-Json|Set-Content (Join-Path $WorkRoot 'coverage-gate.json')\n",
    "diagnose": "Get-Content (Join-Path $WorkRoot 'coverage-gate.json')\n",
    "repair": "$g=Get-Content (Join-Path $WorkRoot 'coverage-gate.json') -Raw|ConvertFrom-Json;$g.minimum=0.65;$g.passed=$g.actual -ge $g.minimum;$g|ConvertTo-Json|Set-Content (Join-Path $WorkRoot 'coverage-gate.json')\n"
  },
  "challenge": "Add tests for a missing API validation boundary, show the coverage delta, and explain why high coverage alone does not prove security or resilience.",
  "sources": [
    "https://learn.microsoft.com/en-us/dotnet/core/testing/unit-testing-code-coverage",
    "https://learn.microsoft.com/en-us/aspnet/core/test/integration-tests",
    "https://learn.microsoft.com/en-us/azure/devops/pipelines/test/review-continuous-test-results-after-build"
  ],
  "primer": "Passing tests, line coverage, security checks, and approval solve different risks. This course uses a 65% measured-line threshold for the sample; it is not a universal quality target.",
