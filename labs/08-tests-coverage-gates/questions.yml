        "D3.2.2"
      ],
      "difficulty": "foundational",
      "question": "A load test must satisfy P95 latency under 500 ms and error rate under 1 percent at the target demand. Which result meets both stated thresholds?",
      "options": [
        {
          "key": "A",
          "text": "P95 of 420 ms with 0.4 percent errors at the target demand",
          "rationale": "Both the tail latency and error proportion satisfy the declared workload-specific limits."
        },
        {
          "key": "B",
          "text": "Mean latency 200 ms with P95 of 900 ms and 0.2 percent errors",
          "rationale": "A fast mean does not satisfy the stated P95 limit."
        },
        {
          "key": "C",
          "text": "P95 of 350 ms with 3 percent errors",
          "rationale": "The latency passes while the error-rate requirement fails."
        },
        {
          "key": "D",
          "text": "P95 of 400 ms with 0.3 percent errors at one tenth of target demand",
          "rationale": "Passing under a different much lighter workload does not establish the requested capacity."
        }
      ],
      "correctAnswers": [
        "A"
      ],
      "explanation": "Both the tail latency and error proportion satisfy the declared workload-specific limits. A fast mean does not satisfy the stated P95 limit. The latency passes while the error-rate requirement fails. Passing under a different much lighter workload does not establish the requested capacity.",
