  "questions": [
    {
      "id": "L08-Q001",
      "checkpointId": "CP5",
      "objectiveIds": [
        "D3.2.2"
      ],
      "difficulty": "foundational",
      "question": "A deterministic price-calculation function needs feedback before any cloud environment exists. Which test layer is the best first fit?",
      "options": [
        {
          "key": "A",
          "text": "A manual release approval with no executed assertion",
          "rationale": "Approval does not evaluate whether the calculation returns the required result."
        },
        {
          "key": "B",
          "text": "A database migration smoke test only",
          "rationale": "Schema behavior does not directly test the price-calculation contract."
        },
        {
          "key": "C",
          "text": "Focused local unit tests with explicit expected results",
          "rationale": "The isolated calculation can be checked quickly without deploying external dependencies."
        },
        {
          "key": "D",
          "text": "A full production load test as the only validation",
          "rationale": "That is expensive indirect feedback for an isolated pure function."
        }
      ],
      "correctAnswers": [
        "C"
      ],
      "explanation": "Approval does not evaluate whether the calculation returns the required result. Schema behavior does not directly test the price-calculation contract. The isolated calculation can be checked quickly without deploying external dependencies. That is expensive indirect feedback for an isolated pure function.",
      "sourceIds": [
        "S2",
        "S3"
      ]
    },
    {
      "id": "L08-Q002",
      "checkpointId": "CP5",
      "objectiveIds": [
        "D3.2.2"
      ],
      "difficulty": "foundational",
      "question": "Unit tests use a database mock and pass, but the actual deployed schema lacks a required column. What missing test layer addresses the failure?",
      "options": [
        {
          "key": "A",
          "text": "An integration test against a representative database schema",
          "rationale": "The failure occurs at a real dependency contract omitted by the mock."
        },
        {
          "key": "B",
          "text": "More repetitions of the same database mock",
          "rationale": "Repeated isolated behavior does not create real schema interaction."
        },
        {
          "key": "C",
          "text": "A test that checks only repository branch naming",
          "rationale": "A source workflow property does not exercise the database boundary."
        },
        {
          "key": "D",
          "text": "A release-note spelling check",
          "rationale": "Documentation correctness does not validate the runtime schema."
        }
      ],
      "correctAnswers": [
        "A"
      ],
      "explanation": "The failure occurs at a real dependency contract omitted by the mock. Repeated isolated behavior does not create real schema interaction. A source workflow property does not exercise the database boundary. Documentation correctness does not validate the runtime schema.",
      "sourceIds": [
        "S2",
        "S3"
      ]
    },
    {
      "id": "L08-Q003",
      "checkpointId": "CP5",
      "objectiveIds": [
        "D3.2.2"
      ],
      "difficulty": "foundational",
      "question": "The API passes functional checks for one user but slows sharply with hundreds of concurrent requests. Which test addresses the unresolved risk?",
      "options": [
        {
          "key": "A",
          "text": "Only a database migration dry run",
          "rationale": "Schema planning does not establish end-to-end service capacity."
        },
        {
          "key": "B",
          "text": "A representative load test with response-time and error acceptance criteria",
          "rationale": "The question concerns behavior under concurrent demand rather than single-request correctness."
        },
        {
          "key": "C",
          "text": "Only a unit test of one controller's return type",
          "rationale": "That does not exercise contention and capacity at the required workload."
        },
        {
          "key": "D",
          "text": "Only another static analysis pass of method names",
          "rationale": "Naming analysis does not measure runtime concurrency behavior."
        }
      ],
      "correctAnswers": [
        "B"
      ],
      "explanation": "Schema planning does not establish end-to-end service capacity. The question concerns behavior under concurrent demand rather than single-request correctness. That does not exercise contention and capacity at the required workload. Naming analysis does not measure runtime concurrency behavior.",
      "sourceIds": [
        "S2",
        "S3"
      ]
    },
    {
      "id": "L08-Q004",
      "checkpointId": "CP5",
      "objectiveIds": [
        "D3.2.2"
      ],
      "difficulty": "foundational",
      "question": "Which unit-test dependency design makes an isolated calculation test deterministic?",
      "options": [
        {
          "key": "A",
          "text": "Depend on whichever records happen to exist in the shared production database",
          "rationale": "Uncontrolled data couples the result to unrelated activity."
        },
        {
          "key": "B",
          "text": "Order all tests alphabetically so one test prepares another's hidden state",
          "rationale": "A deterministic suite should not rely on accidental test ordering."
        },
        {
          "key": "C",
          "text": "Supply controlled inputs and replace unrelated external dependencies through suitable boundaries",
          "rationale": "The test should exercise the intended behavior without uncontrolled network or clock effects."
        },
        {
          "key": "D",
          "text": "Use the current production exchange rate from the internet in every assertion",
          "rationale": "A changing external input can alter results independently of the code under test."
        }
      ],
      "correctAnswers": [
        "C"
      ],
      "explanation": "Uncontrolled data couples the result to unrelated activity. A deterministic suite should not rely on accidental test ordering. The test should exercise the intended behavior without uncontrolled network or clock effects. A changing external input can alter results independently of the code under test.",
      "sourceIds": [
        "S2",
        "S3"
      ]
    },
    {
      "id": "L08-Q005",
      "checkpointId": "CP5",
      "objectiveIds": [
        "D3.2.2"
      ],
      "difficulty": "foundational",
      "question": "What must a representative integration database provide for a meaningful schema-compatibility test?",
      "options": [
        {
          "key": "A",
          "text": "The relevant schema and behavior needed by the application contract",
          "rationale": "The test environment must exercise the boundary at risk, not merely any database connection."
        },
        {
          "key": "B",
          "text": "Exactly the same unrelated customer records as production",
          "rationale": "Sensitive production data is not inherently required to validate this schema relationship."
        },
        {
          "key": "C",
          "text": "The cheapest storage option regardless of unsupported behavior",
          "rationale": "A nonrepresentative dependency can hide the very contract failure being tested."
        },
        {
          "key": "D",
          "text": "Only an open TCP port with no database operations",
          "rationale": "Connectivity alone does not establish the application's schema behavior."
        }
      ],
      "correctAnswers": [
        "A"
      ],
      "explanation": "The test environment must exercise the boundary at risk, not merely any database connection. Sensitive production data is not inherently required to validate this schema relationship. A nonrepresentative dependency can hide the very contract failure being tested. Connectivity alone does not establish the application's schema behavior.",
      "sourceIds": [
        "S2",
        "S3"
      ]
    },
    {
      "id": "L08-Q006",
      "checkpointId": "CP5",
      "objectiveIds": [
        "D3.2.2"
      ],
      "difficulty": "foundational",
      "question": "Which workload input matters when using a load test to support a capacity claim?",
      "options": [
        {
          "key": "A",
          "text": "Only the latest release tag's text",
          "rationale": "A label does not describe traffic mix or demand timing."
        },
        {
          "key": "B",
          "text": "Only the number of assertions in unit tests",
          "rationale": "Unit-suite size does not define production concurrency."
        },
        {
          "key": "C",
          "text": "A request mix arrival pattern and concurrency representative of the intended users",
          "rationale": "Capacity evidence depends on the actual shape of demand being simulated."
        },
        {
          "key": "D",
          "text": "Only the number of source files in the repository",
          "rationale": "Repository size is not a request workload model."
        }
      ],
      "correctAnswers": [
        "C"
      ],
      "explanation": "A label does not describe traffic mix or demand timing. Unit-suite size does not define production concurrency. Capacity evidence depends on the actual shape of demand being simulated. Repository size is not a request workload model.",
      "sourceIds": [
        "S3"
      ]
    },
    {
      "id": "L08-Q007",
      "checkpointId": "CP5",
      "objectiveIds": [
        "D3.2.2"
      ],
      "difficulty": "foundational",
      "question": "A calculation test executes the code but never checks the returned total. What confidence is missing?",
      "options": [
        {
          "key": "A",
          "text": "Evidence that the calculation method can be invoked without throwing",
          "rationale": "Successful invocation does not establish that a wrong returned value would fail this test."
        },
        {
          "key": "B",
          "text": "Evidence that the method returns a value of the expected type",
          "rationale": "Type correctness alone does not verify the required numeric total."
        },
        {
          "key": "C",
          "text": "Evidence that the test is discovered and counted by the runner",
          "rationale": "Discovery and execution count do not establish a meaningful correctness assertion."
        },
        {
          "key": "D",
          "text": "Evidence that an incorrect result would cause the test to fail",
          "rationale": "Execution alone does not establish a meaningful behavioral assertion."
        }
      ],
      "correctAnswers": [
        "D"
      ],
      "explanation": "Successful invocation does not establish that a wrong returned value would fail this test. Type correctness alone does not verify the required numeric total. Discovery and execution count do not establish a meaningful correctness assertion. Execution alone does not establish a meaningful behavioral assertion.",
      "sourceIds": [
        "S3"
      ],
      "exhibit": {
        "language": "csharp",
        "code": "[Fact]\npublic void Calculates_total()\n{\n    var actual = Price.Calculate(100m, 0.20m);\n    // No assertion checks actual.\n}"
      }
    },
