        {
          "key": "C",
          "text": "Use code coverage as the only acceptance condition for both layers",
          "rationale": "Execution percentage does not prove either the asserted rule or real boundary compatibility."
        },
        {
          "key": "D",
          "text": "Use focused unit tests for isolated rules and representative integration tests for the database contract",
          "rationale": "Different layers address different risks without making every check depend on full deployment."
        }
      ],
      "correctAnswers": [
        "D"
      ],
      "explanation": "A mock does not exercise the actual external schema contract. That loses useful fast feedback and makes diagnosis less focused. Execution percentage does not prove either the asserted rule or real boundary compatibility. Different layers address different risks without making every check depend on full deployment.",
