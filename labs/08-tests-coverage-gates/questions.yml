      "difficulty": "foundational",
      "question": "How should integration-test data be handled in a shared training environment?",
      "options": [
        {
          "key": "A",
          "text": "Let every parallel test overwrite the same shared row without coordination",
          "rationale": "Uncontrolled shared mutation can create flakes and corrupt test assumptions."
        },
        {
          "key": "B",
          "text": "Disable cleanup and reuse every previous run's unknown state",
          "rationale": "Accumulated state makes later results harder to reproduce and attribute."
        },
        {
          "key": "C",
          "text": "Use isolated controlled fixtures and clean up only the test-owned data",
          "rationale": "The test should avoid modifying unrelated or sensitive production records."
        },
        {
          "key": "D",
          "text": "Use live customer records so no fixture preparation is needed",
          "rationale": "That creates avoidable privacy and modification risks."
        }
      ],
      "correctAnswers": [
        "C"
      ],
      "explanation": "Uncontrolled shared mutation can create flakes and corrupt test assumptions. Accumulated state makes later results harder to reproduce and attribute. The test should avoid modifying unrelated or sensitive production records. That creates avoidable privacy and modification risks.",
