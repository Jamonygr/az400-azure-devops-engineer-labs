          "text": "Every possible branch condition was exercised",
          "rationale": "Line coverage does not necessarily establish branch coverage."
        },
        {
          "key": "B",
          "text": "Those included lines were exercised during the measured tests",
          "rationale": "Execution coverage does not by itself establish strong assertions or complete correctness."
        },
        {
          "key": "C",
          "text": "Every included line has an assertion proving its business behavior",
          "rationale": "Executed lines need not have meaningful assertions about every outcome."
        },
        {
          "key": "D",
          "text": "The application has only a 20 percentchance of a production defect",
          "rationale": "Coverage is not a calibrated probability of failure."
        }
      ],
      "correctAnswers": [
        "B"
      ],
      "explanation": "Line coverage does not necessarily establish branch coverage. Execution coverage does not by itself establish strong assertions or complete correctness. Executed lines need not have meaningful assertions about every outcome. Coverage is not a calibrated probability of failure.",
