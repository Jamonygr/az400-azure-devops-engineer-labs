          "rationale": "That suggests it is not checking the intended compatibility risk."
        },
        {
          "key": "C",
          "text": "The database server's display name matches the application name",
          "rationale": "Naming does not prove operational schema compatibility."
        },
        {
          "key": "D",
          "text": "The test runner reports more skipped tests",
          "rationale": "Skipped cases do not demonstrate the required defect was detected."
        }
      ],
      "correctAnswers": [
