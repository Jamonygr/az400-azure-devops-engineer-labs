<svg xmlns="http://www.w3.org/2000/svg" width="760" height="650" viewBox="0 0 760 650" role="img" aria-labelledby="title desc"><title id="title">Lab 08: API integration tests and measured coverage gates</title><desc id="desc">WebApplicationFactory hosts the sample API in process, with an isolated SQLite database for integration behavior. xUnit exercises HTTP boundaries and Coverlet/TRX provide independent coverage and test results. The sample release gate evaluates measured coverage and passing tests; external load testing requires a separately approved target and budget. Relationships: WebApplicationFactory to ASP.NET Core sample API: in-process host; ASP.NET Core sample API to Isolated SQLite database: isolated test data; xUnit API tests to WebApplicationFactory: HTTP behavior probes; xUnit API tests to Coverlet + TRX reports: test + coverage output; Coverlet + TRX reports to 65% sample coverage gate: measured release decision</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto-start-reverse"><path d="M0,0 L0,8 L8,4 z" fill="#0369a1"/></marker></defs>
