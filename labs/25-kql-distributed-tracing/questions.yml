    {
      "id": "L25-Q001",
      "checkpointId": "CP2",
      "objectiveIds": [
        "D5.2.4"
      ],
      "difficulty": "foundational",
      "question": "A KQL request table has a Boolean success column. Which aggregation counts only failed rows?",
      "options": [
        {
          "key": "A",
          "text": "sum(durationMs)",
          "rationale": "Summing duration computes time rather than the number of failed requests."
        },
        {
          "key": "B",
          "text": "countif(success == false)",
          "rationale": "The Boolean predicate selects failed rows before the aggregation counts them."
        },
        {
          "key": "C",
          "text": "count()",
          "rationale": "An unqualified count includes successful and failed rows together."
        },
        {
          "key": "D",
          "text": "countif(success == true)",
          "rationale": "This predicate counts successes rather than failures."
        }
      ],
      "correctAnswers": [
        "B"
      ],
      "explanation": "Summing duration computes time rather than the number of failed requests. The Boolean predicate selects failed rows before the aggregation counts them. An unqualified count includes successful and failed rows together. This predicate counts successes rather than failures.",
      "sourceIds": [
        "S5"
      ],
      "exhibit": {
        "language": "kusto",
        "code": "datatable(success:bool)[true,false,true,false]"
      }
    },
    {
      "id": "L25-Q002",
      "checkpointId": "CP4",
      "objectiveIds": [
        "D5.2.3",
        "D5.2.4"
      ],
      "difficulty": "foundational",
      "question": "A correlation query must retain every request, including requests with no dependency span. Which join kind fits?",
      "options": [
        {
          "key": "A",
          "text": "leftouter with dependencies on the left",
          "rationale": "This preserves dependencies rather than all requests."
        },
        {
          "key": "B",
          "text": "leftsemi with requests on the left",
          "rationale": "A left semi join keeps only requests that have a matching right-side record."
        },
        {
          "key": "C",
          "text": "leftouter with requests on the left",
          "rationale": "A left outer join preserves unmatched records from its left input."
        },
        {
          "key": "D",
          "text": "inner with requests on the left",
          "rationale": "An inner join returns only requests with matching dependency records."
        }
      ],
      "correctAnswers": [
        "C"
      ],
      "explanation": "This preserves dependencies rather than all requests. A left semi join keeps only requests that have a matching right-side record. A left outer join preserves unmatched records from its left input. An inner join returns only requests with matching dependency records.",
      "sourceIds": [
        "S4"
      ]
    },
    {
      "id": "L25-Q003",
      "checkpointId": "CP3",
      "objectiveIds": [
        "D5.2.3"
      ],
      "difficulty": "foundational",
      "question": "Two service spans belong to one distributed transaction but have different span IDs. Which identity is shared across the trace?",
      "options": [
        {
          "key": "A",
          "text": "The span ID",
          "rationale": "Each span has its own identity rather than every span sharing one span ID."
        },
        {
          "key": "B",
          "text": "The service process ID",
          "rationale": "A trace can cross processes and machines with different process identifiers."
        },
        {
          "key": "C",
          "text": "The HTTP response status code",
          "rationale": "Many unrelated requests share status codes, and status is not trace identity."
        },
        {
          "key": "D",
          "text": "The trace ID",
          "rationale": "A trace groups spans under a shared trace identity while individual spans have distinct identities."
        }
      ],
      "correctAnswers": [
        "D"
      ],
      "explanation": "Each span has its own identity rather than every span sharing one span ID. A trace can cross processes and machines with different process identifiers. Many unrelated requests share status codes, and status is not trace identity. A trace groups spans under a shared trace identity while individual spans have distinct identities.",
      "sourceIds": [
        "S2"
      ]
    },
    {
      "id": "L25-Q004",
      "checkpointId": "CP2",
      "objectiveIds": [
        "D5.2.4"
      ],
      "difficulty": "foundational",
      "question": "An operator wants only the last hour of request telemetry before calculating latency. Which KQL operator filters the input rows?",
      "options": [
        {
          "key": "A",
          "text": "sort",
          "rationale": "Sorting changes row order rather than which timestamps are included."
        },
        {
          "key": "B",
          "text": "where",
          "rationale": "The where operator selects rows satisfying the requested time predicate."
        },
        {
          "key": "C",
          "text": "project",
          "rationale": "Projection selects columns rather than enforcing the requested row condition."
        },
        {
          "key": "D",
          "text": "summarize",
          "rationale": "Aggregation groups or reduces rows but does not itself express the initial time filter."
        }
      ],
      "correctAnswers": [
        "B"
      ],
      "explanation": "Sorting changes row order rather than which timestamps are included. The where operator selects rows satisfying the requested time predicate. Projection selects columns rather than enforcing the requested row condition. Aggregation groups or reduces rows but does not itself express the initial time filter.",
      "sourceIds": [
        "S1"
      ]
    },
    {
      "id": "L25-Q005",
      "checkpointId": "CP2",
      "objectiveIds": [
        "D5.2.2",
        "D5.2.4"
      ],
      "difficulty": "foundational",
      "question": "The API's average duration is low, but a minority of requests is very slow. Which aggregation directly describes a high latency percentile?",
      "options": [
        {
          "key": "A",
          "text": "countif(Success == false)",
          "rationale": "Failure count does not directly describe the latency distribution."
        },
        {
          "key": "B",
          "text": "max(TimeGenerated)",
          "rationale": "The latest event time describes freshness rather than request duration."
        },
        {
          "key": "C",
          "text": "percentile(DurationMs, 95)",
          "rationale": "This estimates a high point of the duration distribution rather than its arithmetic mean."
        },
        {
          "key": "D",
          "text": "avg(DurationMs)",
          "rationale": "The mean can conceal the slow minority the operator needs to examine."
        }
      ],
      "correctAnswers": [
        "C"
      ],
      "explanation": "Failure count does not directly describe the latency distribution. The latest event time describes freshness rather than request duration. This estimates a high point of the duration distribution rather than its arithmetic mean. The mean can conceal the slow minority the operator needs to examine.",
      "sourceIds": [
        "S6"
      ]
    },
