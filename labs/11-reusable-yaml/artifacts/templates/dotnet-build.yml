parameters:
  - name: configuration
    type: string
    default: Release
    values: [Release, Debug]
steps:
  - task: UseDotNet@2
    inputs:
      packageType: sdk
      useGlobalJson: true
  - pwsh: ./samples/Build-Release.ps1 -Revision $env:SOURCE_REVISION -Configuration $env:BUILD_CONFIGURATION -OutputPath '$(Build.ArtifactStagingDirectory)/release'
    displayName: Locked build, tests, coverage and immutable packaging
    env:
      SOURCE_REVISION: $(Build.SourceVersion)
      BUILD_CONFIGURATION: ${{ parameters.configuration }}
  - publish: $(Build.ArtifactStagingDirectory)/release
    artifact: todo-api
