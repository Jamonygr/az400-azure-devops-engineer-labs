name: Reusable .NET build
on:
  workflow_call:
    inputs:
      configuration:
        type: string
        default: Release
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Validate input allowlist
        env:
          BUILD_CONFIGURATION: ${{ inputs.configuration }}
        run: '[[ "$BUILD_CONFIGURATION" == Release || "$BUILD_CONFIGURATION" == Debug ]]'
      - run: dotnet restore samples/DevOps.slnx --locked-mode
      - name: Test
        env:
          BUILD_CONFIGURATION: ${{ inputs.configuration }}
        run: dotnet test samples/DevOps.slnx --configuration "$BUILD_CONFIGURATION" --no-restore
      - name: Publish
        env:
          BUILD_CONFIGURATION: ${{ inputs.configuration }}
        run: dotnet publish samples/DevOps.Api/DevOps.Api.csproj --configuration "$BUILD_CONFIGURATION" --no-restore --output publish /p:UseAppHost=false
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: todo-api
          path: publish/
