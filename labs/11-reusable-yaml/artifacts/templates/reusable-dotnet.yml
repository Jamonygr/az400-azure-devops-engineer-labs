name: Reusable .NET build
on:
  workflow_call:
    inputs:
      configuration:
        type: string
        default: Release
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Validate input allowlist
        env:
          BUILD_CONFIGURATION: ${{ inputs.configuration }}
        run: '[[ "$BUILD_CONFIGURATION" == Release || "$BUILD_CONFIGURATION" == Debug ]]'
      - name: Locked build, tests, coverage and immutable packaging
        shell: pwsh
        env:
          SOURCE_REVISION: ${{ github.sha }}
          BUILD_CONFIGURATION: ${{ inputs.configuration }}
        run: ./samples/Build-Release.ps1 -Revision $env:SOURCE_REVISION -Configuration $env:BUILD_CONFIGURATION -OutputPath publish
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: todo-api
          path: publish/

