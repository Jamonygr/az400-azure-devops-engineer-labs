<path d="M380.0,330 V220" fill="none" stroke="#0369a1" stroke-width="2" marker-end="url(#arrow)" data-from="variables" data-to="template"><title>authorized runtime values</title></path>
<circle cx="380.0" cy="275.0" r="11" fill="#ffffff" stroke="#0369a1" stroke-width="1.5"/><text x="380.0" y="279.5" text-anchor="middle" fill="#075985" font-size="13" font-weight="bold" font-family="sans-serif">3</text>
<path d="M115.0,330 V261.0 H645.0 V220" fill="none" stroke="#0369a1" stroke-width="2" marker-end="url(#arrow)" data-from="dag" data-to="build"><title>job dependency order</title></path>
<circle cx="380.0" cy="261.0" r="11" fill="#ffffff" stroke="#0369a1" stroke-width="1.5"/><text x="380.0" y="265.5" text-anchor="middle" fill="#075985" font-size="13" font-weight="bold" font-family="sans-serif">4</text>
