<svg xmlns="http://www.w3.org/2000/svg" width="760" height="650" viewBox="0 0 760 650" role="img" aria-labelledby="title desc"><title id="title">Lab 11: Reusable YAML inputs and protected variable injection</title><desc id="desc">The consumer YAML supplies typed template parameters while a scoped Azure DevOps variable group supplies authorized runtime values. Explicit needs/dependsOn edges order jobs. The GitHub reusable workflow is a parallel reviewed contract; its existence does not grant inherited secrets or activate a remote workflow. Relationships: Consumer YAML contract to Azure build template: typed parameters; Azure build template to .NET build job: rendered build steps; Scoped variable group to Azure build template: authorized runtime values; needs / dependsOn DAG to .NET build job: job dependency order; Consumer YAML contract to GitHub reusable workflow: alternative call contract</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto-start-reverse"><path d="M0,0 L0,8 L8,4 z" fill="#0369a1"/></marker></defs>
<rect width="760" height="650" rx="16" fill="#f0f9ff"/>
<text x="22" y="30" fill="#0c4a6e" font-size="19" font-weight="bold" font-family="sans-serif">Lab 11: Reusable YAML inputs and protected variable injection</text>
<path d="M210,160.0 H285" fill="none" stroke="#0369a1" stroke-width="2" marker-end="url(#arrow)" data-from="consumer" data-to="template"><title>typed parameters</title></path>
