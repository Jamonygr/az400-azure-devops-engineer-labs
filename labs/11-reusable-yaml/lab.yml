{
  "schemaVersion": "1.0.0",
  "id": "11",
  "slug": "11-reusable-yaml",
  "title": "Reuse YAML templates and variables",
  "domain": "pipelines",
  "minutes": 120,
  "cost": "none",
  "platforms": [
    "local",
    "azure-devops"
  ],
  "objectives": [
    "D3.3.5",
    "D3.3.6",
    "D3.3.8"
  ],
  "scenario": "Build logic is diverging between teams. Define reusable YAML interfaces, typed inputs, variable groups, and explicit job dependencies.",
  "role": "Pipeline framework maintainer",
  "outcome": "Reuse YAML templates and variables.",
  "checkpoints": [
    {
      "id": "CP1",
      "title": "Exercise the reusable workflow input contract",
      "commands": "Copy-Item (Join-Path $LabRoot 'artifacts/templates/reusable-dotnet.yml') (Join-Path $WorkRoot 'reusable-dotnet.yml')\nCopy-Item (Join-Path $LabRoot 'artifacts/consumer-github.yml') (Join-Path $WorkRoot 'consumer-github.yml')\n@'\nimport json,sys,yaml\nfrom pathlib import Path\nr=Path(sys.argv[1]); raw=yaml.safe_load((r/'reusable-dotnet.yml').read_text());on=raw.get('on',raw.get(True,{}));call=on['workflow_call']\nassert call['inputs'] and raw['permissions'].get('contents')=='read'\nconsumer=yaml.safe_load((r/'consumer-github.yml').read_text());jobs=consumer['jobs']\nassert any('reusable-dotnet.yml' in v.get('uses','') for v in jobs.values())\nassert 'secrets: inherit' not in (r/'consumer-github.yml').read_text()\nprint(json.dumps({'inputs':list(call['inputs']),'consumerJobs':list(jobs),'explicitContract':True}))\n'@|python - $WorkRoot|Set-Content (Join-Path $WorkRoot 'github-template-contract.json')\nif($LASTEXITCODE -ne 0){throw 'Reusable workflow contract failed.'}\n",
      "expected": "The consumer references the reusable workflow, typed inputs exist, and repository permission stays read-only.",
      "positive": "$r=Get-Content (Join-Path $WorkRoot 'github-template-contract.json') -Raw|ConvertFrom-Json\nif(-not $r.explicitContract -or @($r.inputs).Count -lt 1){throw 'Reusable input contract absent.'}\n",
      "negative": "$t=Get-Content (Join-Path $WorkRoot 'consumer-github.yml') -Raw\nif($t -match 'secrets: inherit|write-all'){throw 'Consumer broadened the reusable contract.'}\n",
      "validate": "$r=Get-Content (Join-Path $WorkRoot 'github-template-contract.json') -Raw|ConvertFrom-Json\nif(-not $r.explicitContract -or @($r.inputs).Count -lt 1){throw 'Reusable input contract absent.'}\n\n$t=Get-Content (Join-Path $WorkRoot 'consumer-github.yml') -Raw\nif($t -match 'secrets: inherit|write-all'){throw 'Consumer broadened the reusable contract.'}\n",
      "evidence": "Parsed interface and consumer job names; explicitly offline contract practice, not a hosted run.",
      "fix": "Reusable workflows are called as jobs. Offline parsing verifies the authored interface; separately activated provider execution is needed to prove service compilation.",
      "coverage": [
        {
          "objectiveId": "D3.3.8",
          "level": "practiced",
          "reference": "Parse a reusable workflow consumer and resolve its declared inputs and minimum permissions locally."
        }
      ]
    },
    {
      "id": "CP2",
      "title": "Reject an invalid parameter and execute valid build behavior",
      "commands": "Copy-Item (Join-Path $LabRoot 'artifacts/templates/dotnet-build.yml') (Join-Path $WorkRoot 'dotnet-build.yml')\nCopy-Item (Join-Path $LabRoot 'artifacts/consumer-azure-pipelines.yml') (Join-Path $WorkRoot 'consumer-azure-pipelines.yml')\n@'\nimport json,sys,yaml\nfrom pathlib import Path\nr=Path(sys.argv[1]);t=yaml.safe_load((r/'dotnet-build.yml').read_text());p=next(x for x in t['parameters'] if x['name']=='configuration')\nassert p['type']=='string' and 'Release' in p['values'] and 'Production' not in p['values']\nassert any('Build-Release.ps1' in x.get('pwsh','') for x in t['steps'])\nprint(json.dumps({'selected':'Release','rejected':'Production','allowed':p['values']}))\n'@|python - $WorkRoot|Set-Content (Join-Path $WorkRoot 'template-parameters.json')\nif($LASTEXITCODE -ne 0){throw 'Typed template parameter contract failed.'}\n$config=(Get-Content (Join-Path $WorkRoot 'template-parameters.json') -Raw|ConvertFrom-Json).selected\ndotnet test (Join-Path $RepoRoot 'samples/DevOps.slnx') --configuration $config --logger 'trx;LogFileName=reusable.trx' --results-directory (Join-Path $WorkRoot 'template-tests')\nif($LASTEXITCODE -ne 0){throw 'Selected reusable build behavior failed.'}\n",
      "expected": "Release is accepted, Production is rejected, and selected test behavior passes locally.",
      "positive": "$p=Get-Content (Join-Path $WorkRoot 'template-parameters.json') -Raw|ConvertFrom-Json\n$f=Get-ChildItem (Join-Path $WorkRoot 'template-tests') -Filter '*.trx' -Recurse|Select-Object -First 1;$x=[xml](Get-Content $f.FullName -Raw)\nif($p.selected -ne 'Release' -or [int]$x.TestRun.ResultSummary.Counters.passed -lt 1){throw 'Valid template behavior unproven.'}\n",
      "negative": "$p=Get-Content (Join-Path $WorkRoot 'template-parameters.json') -Raw|ConvertFrom-Json\nif($p.rejected -in $p.allowed){throw 'Invalid template value accepted.'}\n",
      "validate": "$p=Get-Content (Join-Path $WorkRoot 'template-parameters.json') -Raw|ConvertFrom-Json\n$f=Get-ChildItem (Join-Path $WorkRoot 'template-tests') -Filter '*.trx' -Recurse|Select-Object -First 1;$x=[xml](Get-Content $f.FullName -Raw)\nif($p.selected -ne 'Release' -or [int]$x.TestRun.ResultSummary.Counters.passed -lt 1){throw 'Valid template behavior unproven.'}\n\n$p=Get-Content (Join-Path $WorkRoot 'template-parameters.json') -Raw|ConvertFrom-Json\nif($p.rejected -in $p.allowed){throw 'Invalid template value accepted.'}\n",
      "evidence": "Allowed/rejected parameter decisions and passing TRX; local validation is not provider template expansion.",
      "fix": "Use parameters for compile-time structure, variables for runtime data, and valid enum values rather than arbitrary substitution.",
      "coverage": [
        {
          "objectiveId": "D3.3.5",
          "level": "practiced",
          "reference": "Consume the typed Release parameter and execute the selected .NET test configuration."
        }
      ]
    },
    {
      "id": "CP3",
      "title": "Create an explicitly nonsecret variable group",
      "commands": "$g=az pipelines variable-group create --organization $AdoOrganization --project $AdoProject --name \"build-$RunId\" --variables BuildConfiguration=Release TargetFramework=net10.0 --authorize false -o json|ConvertFrom-Json\n $g.id|Set-Content (Join-Path $WorkRoot 'variable-group-id.txt')\n",
      "expected": "A sandbox variable group exists without blanket pipeline authorization.",
      "positive": "$id=Get-Content (Join-Path $WorkRoot 'variable-group-id.txt')\n $g=az pipelines variable-group show --organization $AdoOrganization --project $AdoProject --group-id $id -o json|ConvertFrom-Json\n if ($g.variables.BuildConfiguration.value -ne 'Release') { throw 'Build variable mismatch.' }\n",
      "negative": "$id=Get-Content (Join-Path $WorkRoot 'variable-group-id.txt')\n $g=az pipelines variable-group show --organization $AdoOrganization --project $AdoProject --group-id $id -o json|ConvertFrom-Json\n if ($g.authorized) { throw 'Variable group must not be authorized for every pipeline.' }\n",
      "validate": "$id=Get-Content (Join-Path $WorkRoot 'variable-group-id.txt')\n $g=az pipelines variable-group show --organization $AdoOrganization --project $AdoProject --group-id $id -o json|ConvertFrom-Json\n if ($g.variables.BuildConfiguration.value -ne 'Release') { throw 'Build variable mismatch.' }\n\n$id=Get-Content (Join-Path $WorkRoot 'variable-group-id.txt')\n $g=az pipelines variable-group show --organization $AdoOrganization --project $AdoProject --group-id $id -o json|ConvertFrom-Json\n if ($g.authorized) { throw 'Variable group must not be authorized for every pipeline.' }\n",
      "evidence": "Variable group ID and nonsecret values.",
      "fix": "Authorize only a designated sandbox pipeline; store secrets through protected secret facilities.",
      "coverage": []
    },
    {
      "id": "CP4",
      "title": "Model build-test-package ordering as a DAG",
      "commands": "$dag=@([ordered]@{job='build';needs=@()},[ordered]@{job='test';needs=@('build')},[ordered]@{job='package';needs=@('test')})\n $dag|ConvertTo-Json -Depth 5|Set-Content (Join-Path $WorkRoot 'job-graph.json')\n $done=@();foreach($j in $dag){foreach($d in $j.needs){if($d -notin $done){throw \"Unresolved dependency $d\"}};$done+=$j.job}\n $done|Set-Content (Join-Path $WorkRoot 'execution-order.txt')\n",
      "expected": "Each job depends only on completed prerequisites; package follows successful tests.",
      "positive": "$o=@(Get-Content (Join-Path $WorkRoot 'execution-order.txt'))\n if (($o -join ',') -ne 'build,test,package') { throw 'Invalid topological execution order.' }\n",
      "negative": "$jobs=@(Get-Content (Join-Path $WorkRoot 'job-graph.json') -Raw|ConvertFrom-Json);$names=@($jobs.job);$done=@()\nif(@($jobs|ForEach-Object needs|Where-Object {$_ -notin $names}).Count){throw 'AZ400-L11-FAULT'}\nwhile($done.Count -lt $jobs.Count){$ready=@($jobs|Where-Object {$_.job -notin $done -and @($_.needs|Where-Object {$_ -notin $done}).Count -eq 0});if($ready.Count -eq 0){throw 'AZ400-L11-FAULT'};$done+=@($ready.job)}\n",
      "validate": "$o=@(Get-Content (Join-Path $WorkRoot 'execution-order.txt'))\n if (($o -join ',') -ne 'build,test,package') { throw 'Invalid topological execution order.' }\n\n$jobs=@(Get-Content (Join-Path $WorkRoot 'job-graph.json') -Raw|ConvertFrom-Json);$names=@($jobs.job);$done=@()\nif(@($jobs|ForEach-Object needs|Where-Object {$_ -notin $names}).Count){throw 'AZ400-L11-FAULT'}\nwhile($done.Count -lt $jobs.Count){$ready=@($jobs|Where-Object {$_.job -notin $done -and @($_.needs|Where-Object {$_ -notin $done}).Count -eq 0});if($ready.Count -eq 0){throw 'AZ400-L11-FAULT'};$done+=@($ready.job)}\n",
      "evidence": "DAG and successful execution order.",
      "fix": "Fix dependsOn/needs references; do not serialize independent tests unless resource contention requires it.",
      "coverage": [
        {
          "objectiveId": "D3.3.6",
          "level": "practiced",
          "reference": "Topologically sort the dependency graph and reject an indirect build/package cycle."
        }
      ]
    },
    {
      "id": "CP5",
      "title": "Exercise the shared template build command locally",
      "commands": "dotnet build (Join-Path $RepoRoot 'samples/DevOps.slnx') --configuration Release\n if($LASTEXITCODE -ne 0){throw 'Reusable build baseline failed.'}\n Get-FileHash (Join-Path $WorkRoot 'dotnet-build.yml')|ConvertTo-Json|Set-Content (Join-Path $WorkRoot 'template-digest.json')\n",
      "expected": "The reusable build command succeeds and the reviewed template is fingerprinted.",
      "positive": "$h=Get-Content (Join-Path $WorkRoot 'template-digest.json') -Raw|ConvertFrom-Json\n if((Get-FileHash (Join-Path $WorkRoot 'dotnet-build.yml')).Hash -ne $h.Hash){throw 'Template drift detected.'}\n",
      "negative": "$h=Get-Content (Join-Path $WorkRoot 'template-digest.json') -Raw|ConvertFrom-Json\n if($h.Algorithm -ne 'SHA256'){throw 'Unexpected template digest algorithm.'}\n",
      "validate": "$h=Get-Content (Join-Path $WorkRoot 'template-digest.json') -Raw|ConvertFrom-Json\n if((Get-FileHash (Join-Path $WorkRoot 'dotnet-build.yml')).Hash -ne $h.Hash){throw 'Template drift detected.'}\n\n$h=Get-Content (Join-Path $WorkRoot 'template-digest.json') -Raw|ConvertFrom-Json\n if($h.Algorithm -ne 'SHA256'){throw 'Unexpected template digest algorithm.'}\n",
      "evidence": "Build result and template SHA256.",
      "fix": "Match local command arguments with the template, and review breaking input changes before reuse.",
      "coverage": []
    }
  ],
  "breakFix": {
    "trigger": "$d=Get-Content (Join-Path $WorkRoot 'job-graph.json') -Raw|ConvertFrom-Json;$d[0].needs=@('package');$d|ConvertTo-Json -Depth 5|Set-Content (Join-Path $WorkRoot 'job-graph.json')\n",
    "diagnose": "$d=Get-Content (Join-Path $WorkRoot 'job-graph.json') -Raw|ConvertFrom-Json;$d|Format-Table job,needs\n",
    "repair": "$d=Get-Content (Join-Path $WorkRoot 'job-graph.json') -Raw|ConvertFrom-Json;$d[0].needs=@();$d|ConvertTo-Json -Depth 5|Set-Content (Join-Path $WorkRoot 'job-graph.json')\n",
    "assert": "$jobs=@(Get-Content (Join-Path $WorkRoot 'job-graph.json') -Raw|ConvertFrom-Json);$names=@($jobs.job);$done=@()\nif(@($jobs|ForEach-Object needs|Where-Object {$_ -notin $names}).Count){throw 'AZ400-L11-FAULT'}\nwhile($done.Count -lt $jobs.Count){$ready=@($jobs|Where-Object {$_.job -notin $done -and @($_.needs|Where-Object {$_ -notin $done}).Count -eq 0});if($ready.Count -eq 0){throw 'AZ400-L11-FAULT'};$done+=@($ready.job)}\n",
    "expectedFailure": "AZ400-L11-FAULT"
  },
  "challenge": "Call the templates from a separate disposable consumer repository using a pinned revision and demonstrate one deliberate input validation failure.",
