      ],
      "difficulty": "foundational",
      "question": "A template accepts configuration values Debug and Release. A caller supplies Production. What should parameter validation do?",
      "options": [
        {
          "key": "A",
          "text": "Ignore every parameter and use machine defaults",
          "rationale": "Machine defaults discard the explicit consumer configuration and undermine repeatable execution."
        },
        {
          "key": "B",
          "text": "Reject the unsupported configuration value",
          "rationale": "A typed allowed-values contract should reject values outside its declared choices."
        },
        {
          "key": "C",
          "text": "Treat it as Release without reporting substitution",
          "rationale": "Silent coercion conceals a caller mismatch against the reviewed interface contract."
        },
        {
          "key": "D",
          "text": "Broaden the service connection permission set",
          "rationale": "Authorization changes cannot make an unsupported value satisfy the template contract."
        }
      ],
      "correctAnswers": [
        "B"
      ],
      "explanation": "A typed allowed-values contract should reject values outside its declared choices. Silent coercion conceals a caller mismatch against the reviewed interface contract. Machine defaults discard the explicit consumer configuration and undermine repeatable execution. Authorization changes cannot make an unsupported value satisfy the template contract.",
      "sourceIds": [
        "S1"
      ],
      "exhibit": {
        "language": "yaml",
        "code": "parameters:\n- name: configuration\n  type: string\n  values: [Debug, Release]\n# caller: Production"
      }
