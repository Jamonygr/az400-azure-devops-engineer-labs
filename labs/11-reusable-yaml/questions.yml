      "objectiveIds": [
        "D3.3.8"
      ],
      "difficulty": "foundational",
      "question": "A caller wants to reuse an entire GitHub workflow rather than one action step. Where should the uses reference appear?",
      "options": [
        {
          "key": "A",
          "text": "Only in a repository Markdown link",
          "rationale": "Documentation references do not create executable reusable workflow calls or dependencies."
        },
        {
          "key": "B",
          "text": "At the calling job level",
          "rationale": "Reusable workflows are invoked as jobs rather than embedded ordinary action steps."
        },
        {
          "key": "C",
          "text": "Inside a composite action run step without a calling job",
          "rationale": "Reusable workflows use the job-call contract rather than an ordinary composite action step interface."
        },
        {
          "key": "D",
          "text": "Inside an arbitrary shell command string",
          "rationale": "A shell command does not establish a reusable workflow job invocation."
        }
      ],
      "correctAnswers": [
        "B"
      ],
      "explanation": "Reusable workflows are invoked as jobs rather than embedded ordinary action steps. A shell command does not establish a reusable workflow job invocation. Reusable workflows use the job-call contract rather than an ordinary composite action step interface. Documentation references do not create executable reusable workflow calls or dependencies.",
      "sourceIds": [
        "S3"
      ]
    },
    {
