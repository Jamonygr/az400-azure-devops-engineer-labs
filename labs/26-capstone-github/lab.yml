    {
      "id": "CP3",
      "title": "Publish CI while preserving the dormant deployment gate",
      "commands": "$p=Join-Path $WorkRoot 'capstone'\npython (Join-Path $RepoRoot 'tools/package_capstone.py') --platform github --destination $p\nif($LASTEXITCODE -ne 0){throw 'Self-contained capstone packaging failed.'}\n git -C $p add .;$staged=@(git -C $p diff --cached --name-only)\nif($staged.Count -gt 0){git -C $p commit -m \"[$RunId] Deliver tested observable API and gated deployment review\"}else{Write-Output 'Reviewed files already committed; reusing the current source revision.'};git -C $p branch -M main;git -C $p push -u origin main\n (git -C $p rev-parse HEAD)|Set-Content (Join-Path $WorkRoot 'capstone-sha.txt')\n\n$coreSha=(Get-Content (Join-Path $WorkRoot 'capstone-sha.txt')).Trim()\n$coreCi=Join-Path $p '.github/workflows/ci.yml'\n$coreManifest=git -C $p show \"${coreSha}:deployment/package-manifest.json\"|ConvertFrom-Json\nif($coreManifest.releaseActivated){throw 'The initial core source must keep release activation dormant.'}\n@{sourceRevision=$coreSha;ciPath='.github/workflows/ci.yml';ciSha256=(Get-FileHash -LiteralPath $coreCi -Algorithm SHA256).Hash;ciBlob=(git -C $p rev-parse \"${coreSha}:.github/workflows/ci.yml\").Trim();releaseActivated=$false}|ConvertTo-Json|Set-Content (Join-Path $WorkRoot 'core-publication.json')\n",
      "expected": "A reviewed commit enables CI; cloud deployment remains outside the active workflow directory. Historical CI-only source revision and CI file hashes remain independently inspectable after the separate protected release activation.",
      "positive": "$t=Get-Content (Join-Path $WorkRoot 'capstone/.github/workflows/ci.yml') -Raw\n if($t -notmatch 'dotnet' -or $t -notmatch 'contents: read'){throw 'Capstone CI lacks build/read permission contract.'}\n$m=Get-Content (Join-Path $WorkRoot 'capstone/deployment/package-manifest.json') -Raw|ConvertFrom-Json\nif($m.releaseActivated -or -not (Test-Path (Join-Path $WorkRoot 'capstone/deployment/scripts/Verify-Release.ps1'))){throw 'Default package must be complete and keep release activation explicit.'}\n",
      "negative": "$t=Get-Content (Join-Path $WorkRoot 'capstone/.github/workflows/ci.yml') -Raw\n if($t -match 'azure/login|az deployment|pull_request_target'){throw 'Publishing capstone CI must not start cloud deployment.'}\n",
      "validate": "$t=Get-Content (Join-Path $WorkRoot 'capstone/.github/workflows/ci.yml') -Raw\n if($t -notmatch 'dotnet' -or $t -notmatch 'contents: read'){throw 'Capstone CI lacks build/read permission contract.'}\n$m=Get-Content (Join-Path $WorkRoot 'capstone/deployment/package-manifest.json') -Raw|ConvertFrom-Json\nif(-not (Test-Path (Join-Path $WorkRoot 'capstone/deployment/scripts/Verify-Release.ps1'))){throw 'The package must include its complete release verification dependency.'}\n\n$t=Get-Content (Join-Path $WorkRoot 'capstone/.github/workflows/ci.yml') -Raw\n if($t -match 'azure/login|az deployment|pull_request_target'){throw 'Publishing capstone CI must not start cloud deployment.'}\n\n$core=Get-Content (Join-Path $WorkRoot 'core-publication.json') -Raw|ConvertFrom-Json\n$baseline=(Get-Content (Join-Path $WorkRoot 'capstone-sha.txt')).Trim()\n$p=Join-Path $WorkRoot 'capstone'\nif($core.sourceRevision -cne $baseline -or $core.sourceRevision -notmatch '^[a-f0-9]{40}$' -or $core.releaseActivated -or $core.ciPath -cne '.github/workflows/ci.yml'){throw 'Historical CI-only source evidence is invalid.'}\n$historical=git -C $p show \"${baseline}:deployment/package-manifest.json\"|ConvertFrom-Json\n$blob=(git -C $p rev-parse \"${baseline}:.github/workflows/ci.yml\").Trim()\n$currentBlob=(git -C $p hash-object (Join-Path $p '.github/workflows/ci.yml')).Trim()\nif($historical.releaseActivated -or $blob -cne $core.ciBlob -or $currentBlob -cne $blob -or (Get-FileHash (Join-Path $p '.github/workflows/ci.yml') -Algorithm SHA256).Hash -cne $core.ciSha256){throw 'CI-only publication revision or file hash differs from captured source.'}\n",
      "evidence": "Exact commit SHA and active-versus-dormant file locations. core-publication.json links the baseline commit, exact CI path, SHA256 and Git blob; current protected release evidence is separate.",
      "fix": "Activate a separately reviewed deployment only after federation, SQL/network prerequisites, environment approval, and costs are authorized.",
      "coverage": [
        {
          "objectiveId": "D3.3.5",
          "level": "practiced",
          "reference": "Publish CI plus a dependency-complete dormant deployment bundle."
