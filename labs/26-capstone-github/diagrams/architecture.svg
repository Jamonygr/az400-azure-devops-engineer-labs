<svg xmlns="http://www.w3.org/2000/svg" width="760" height="650" viewBox="0 0 760 650" role="img" aria-labelledby="title desc"><title id="title">Lab 26: GitHub delivery evidence and the protected live extension</title><desc id="desc">The core connects accepted GitHub work to the exact sandbox source revision, passing hosted CI, and retained quality/artifact provenance. The protected environment and workload federation form the boundary for the optional live extension. App/SQL/telemetry deployment, progressive rollout, and recovery need their explicit prerequisites and evidence; the core dossier reports cloudDeployed=false. Relationships: Accepted GitHub issue to Owned GitHub source revision: acceptance traceability; Owned GitHub source revision to Actions CI + quality gates: reviewed CI-only workflow; Actions CI + quality gates to Commit-bound tests / artifact: exact source provenance; Commit-bound tests / artifact to Protected environment + WIF: separate release approval; Protected environment + WIF to Azure app / SQL / telemetry: optional protected live extension</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto-start-reverse"><path d="M0,0 L0,8 L8,4 z" fill="#0369a1"/></marker></defs>
<rect width="760" height="650" rx="16" fill="#f0f9ff"/>
<text x="22" y="30" fill="#0c4a6e" font-size="19" font-weight="bold" font-family="sans-serif">Lab 26: GitHub delivery evidence and the protected live extension</text>
