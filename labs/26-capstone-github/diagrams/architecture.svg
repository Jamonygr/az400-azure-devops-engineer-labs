<text x="22" y="480" fill="#0c4a6e" font-family="sans-serif" font-weight="bold" font-size="16">Relationships</text>
<text x="22" y="507" fill="#0f172a" font-family="sans-serif" font-size="14.5">1. acceptance traceability</text>
