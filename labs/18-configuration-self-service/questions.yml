          "text": "A new ownership identity each run",
          "rationale": "Changing ownership context obstructs controlled management of the same declared resource."
        },
        {
          "key": "B",
          "text": "The same intended final state",
          "rationale": "Repeated reconciliation should converge on desired settings without accumulating additional changes."
        },
        {
          "key": "C",
          "text": "An increasing number of files",
          "rationale": "Accumulating copies suggests imperative repetition rather than stable desired-state convergence."
        },
        {
          "key": "D",
          "text": "A fresh random setting every run",
          "rationale": "Random settings prevent convergence to the same approved configuration declaration."
        }
      ],
      "correctAnswers": [
        "B"
      ],
      "explanation": "Changing ownership context obstructs controlled management of the same declared resource. Repeated reconciliation should converge on desired settings without accumulating additional changes. Accumulating copies suggests imperative repetition rather than stable desired-state convergence. Random settings prevent convergence to the same approved configuration declaration.",
      "sourceIds": [
        "S1"
      ],
      "exhibit": {
        "language": "json",
        "code": "{\"desired\":{\"mode\":\"safe\"},\"firstRun\":{\"changed\":true},\"secondRun\":{\"changed\":false,\"mode\":\"safe\"}}"
      }
    },
