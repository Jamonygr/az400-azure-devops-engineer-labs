    {
      "id": "L18-Q001",
      "checkpointId": "CP1",
      "objectiveIds": [
        "D3.5.4"
      ],
      "difficulty": "foundational",
      "question": "An engineer describes the required service settings instead of a sequence of manual edits. Which configuration-management concept does this illustrate?",
      "options": [
        {
          "key": "A",
          "text": "A chronological command transcript",
          "rationale": "A transcript records actions rather than the required resulting configuration state."
        },
        {
          "key": "B",
          "text": "A production incident timeline",
          "rationale": "An incident timeline describes events rather than the intended server configuration."
        },
        {
          "key": "C",
          "text": "A release artifact retention policy",
          "rationale": "Retention governs stored evidence rather than the machine's declared operating settings."
        },
        {
          "key": "D",
          "text": "A desired-state declaration",
          "rationale": "A desired-state document describes the condition that reconciliation should establish."
        }
      ],
      "correctAnswers": [
        "D"
      ],
      "explanation": "A transcript records actions rather than the required resulting configuration state. An incident timeline describes events rather than the intended server configuration. Retention governs stored evidence rather than the machine's declared operating settings. A desired-state document describes the condition that reconciliation should establish.",
      "sourceIds": [
        "S1"
      ]
    },
    {
      "id": "L18-Q002",
      "checkpointId": "CP2",
      "objectiveIds": [
        "D3.5.2"
      ],
      "difficulty": "foundational",
      "question": "The current configuration differs from the approved declaration, and the team wants a report before repair. Which operation fits?",
      "options": [
        {
          "key": "A",
          "text": "Replace evidence with expected values",
          "rationale": "Expected values cannot substitute for observations of the actual current configuration."
        },
        {
          "key": "B",
          "text": "Audit current against desired state",
          "rationale": "Audit identifies mismatches without requiring those settings to be changed immediately."
        },
        {
          "key": "C",
          "text": "Apply every available configuration",
          "rationale": "Unreviewed application changes state before the requested audit report is produced."
        },
        {
          "key": "D",
          "text": "Delete the desired-state document",
          "rationale": "Removing the declaration discards the reference needed to identify configuration drift."
        }
      ],
      "correctAnswers": [
        "B"
      ],
      "explanation": "Expected values cannot substitute for observations of the actual current configuration. Audit identifies mismatches without requiring those settings to be changed immediately. Unreviewed application changes state before the requested audit report is produced. Removing the declaration discards the reference needed to identify configuration drift.",
      "sourceIds": [
        "S1"
      ]
    },
    {
      "id": "L18-Q003",
      "checkpointId": "CP1",
      "objectiveIds": [
        "D3.5.4"
      ],
      "difficulty": "applied",
      "question": "The lab's declared JSON setting is correct but its actual file contains another value. Which comparison demonstrates drift?",
      "options": [
        {
          "key": "A",
          "text": "Compare only file modification timestamps",
          "rationale": "A timestamp change cannot identify whether the declared setting value actually differs."
        },
        {
          "key": "B",
          "text": "Check only the previous repair exit status",
          "rationale": "An earlier successful repair does not observe the current configuration value after later edits."
        },
        {
          "key": "C",
          "text": "Compare observed and declared values",
          "rationale": "Drift is a discrepancy between the observed state and the declared target."
        },
        {
          "key": "D",
          "text": "Compare two copies of the declaration",
          "rationale": "Matching desired documents does not inspect the actual configuration being managed."
        }
      ],
      "correctAnswers": [
        "C"
      ],
      "explanation": "A timestamp change cannot identify whether the declared setting value actually differs. An earlier successful repair does not observe the current configuration value after later edits. Drift is a discrepancy between the observed state and the declared target. Matching desired documents does not inspect the actual configuration being managed.",
      "sourceIds": [
        "S1"
      ]
    },
    {
      "id": "L18-Q004",
      "checkpointId": "CP1",
      "objectiveIds": [
        "D3.5.4"
      ],
      "difficulty": "applied",
      "question": "A reconciliation script writes the desired value even when it already matches. What property should a well-designed repeated run preserve?",
      "options": [
