<svg xmlns="http://www.w3.org/2000/svg" width="760" height="650" viewBox="0 0 760 650" role="img" aria-labelledby="title desc"><title id="title">Lab 18: Desired-state reconciliation and self-service catalog</title><desc id="desc">The desired-state document gives a local reconciler an exact owned path and target value. Audit reports preserve both drift and repaired compliance. A separate versioned catalog describes the self-service environment contract; synchronizing it with Azure Deployment Environments requires the approved dev-center/project bootstrap and is not claimed by the local reconciliation exercise. Relationships: Desired-state JSON to PowerShell reconciler: declared content / owner; PowerShell reconciler to Owned local service.conf: bounded repair; Owned local service.conf to Before / after compliance JSON: independent audit; Desired-state JSON to Before / after compliance JSON: expected value; Versioned environment catalog to Azure Deployment Environments: separate approved sync; Versioned environment catalog to Desired-state JSON: versioned configuration intent</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto-start-reverse"><path d="M0,0 L0,8 L8,4 z" fill="#0369a1"/></marker></defs>
<rect width="760" height="650" rx="16" fill="#f0f9ff"/>
<text x="22" y="30" fill="#0c4a6e" font-size="19" font-weight="bold" font-family="sans-serif">Lab 18: Desired-state reconciliation and self-service catalog</text>
