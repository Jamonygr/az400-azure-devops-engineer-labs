{
  "schemaVersion": "1.0.0",
  "id": "03",
  "slug": "03-collaboration-documentation",
  "title": "Publish documentation and configure integrations",
  "domain": "process",
  "minutes": 120,
  "cost": "none",
  "platforms": [
    "local",
    "azure-devops"
  ],
  "objectives": [
    "D1.3.1",
    "D1.3.2",
    "D1.3.3",
    "D1.3.4",
    "D1.3.5",
    "D1.3.6"
  ],
  "scenario": "A change is ready for review but operational handoff and external integration ownership are unclear. Generate a reproducible release handoff and a bounded integration proposal.",
  "role": "Release coordinator",
  "outcome": "Publish documentation and configure integrations.",
  "checkpoints": [
    {
      "id": "CP1",
      "title": "Generate release notes from Git history",
      "commands": "git -C $RepoRoot log -10 --pretty=format:'- %h %s' | Set-Content (Join-Path $WorkRoot 'release-notes.md')\n Get-Content (Join-Path $WorkRoot 'release-notes.md')\n",
      "expected": "Recent committed changes become a reproducible release-note draft.",
      "positive": "$n=Get-Content (Join-Path $WorkRoot 'release-notes.md') -Raw\n if ($n -notmatch '[0-9a-f]{7}') { throw 'No commit identities in release notes.' }\n",
      "negative": "$n=Get-Content (Join-Path $WorkRoot 'release-notes.md') -Raw\n if ($n -match '(?i)ghp_[a-z0-9]{20}') { throw 'Credential-like value in release draft.' }\n",
      "validate": "$n=Get-Content (Join-Path $WorkRoot 'release-notes.md') -Raw\n if ($n -notmatch '[0-9a-f]{7}') { throw 'No commit identities in release notes.' }\n\n$n=Get-Content (Join-Path $WorkRoot 'release-notes.md') -Raw\n if ($n -match '(?i)ghp_[a-z0-9]{20}') { throw 'Credential-like value in release draft.' }\n",
      "evidence": "Draft notes and exact source commit range.",
      "fix": "Create notes from committed sandbox changes and review text before publication.",
      "coverage": [
        {
          "objectiveId": "D1.3.3",
          "level": "practiced",
          "reference": "Read actual recent Git commit history and render traceable release-note subjects."
        }
      ]
    },
    {
      "id": "CP2",
      "title": "Author a process diagram and API handoff",
      "commands": "@('# Release handoff','```mermaid','flowchart LR','  Commit --> Build','  Build --> Test','  Test --> Approval','  Approval --> Deploy','```','API: GET /health/ready returns readiness status.')|Set-Content (Join-Path $WorkRoot 'handoff.md')\n",
      "expected": "Markdown captures both release sequence and a concrete API contract.",
      "positive": "$d=Get-Content (Join-Path $WorkRoot 'handoff.md') -Raw\n if ($d -notmatch 'flowchart LR' -or $d -notmatch '/health/ready') { throw 'Handoff lacks process/API contract.' }\n",
      "negative": "$d=Get-Content (Join-Path $WorkRoot 'handoff.md') -Raw\n if ($d -match 'password=|client_secret=') { throw 'Sensitive configuration in documentation.' }\n",
      "validate": "$d=Get-Content (Join-Path $WorkRoot 'handoff.md') -Raw\n if ($d -notmatch 'flowchart LR' -or $d -notmatch '/health/ready') { throw 'Handoff lacks process/API contract.' }\n\n$d=Get-Content (Join-Path $WorkRoot 'handoff.md') -Raw\n if ($d -match 'password=|client_secret=') { throw 'Sensitive configuration in documentation.' }\n",
      "evidence": "handoff.md and an explanation of approval ownership.",
      "fix": "Keep Mermaid syntax supported by your renderer and document status codes, not screenshots.",
      "coverage": [
        {
          "objectiveId": "D1.3.2",
          "level": "practiced",
          "reference": "Generate release notes from actual Git history in CP1 and add a reviewed API handoff in CP2."
        }
      ]
    },
    {
      "id": "CP3",
      "title": "Authenticate and reject webhook payloads locally",
      "commands": "$hook=[ordered]@{name='web';active=$false;events=@('workflow_run');config=@{url='https://receiver.example.invalid/az400';content_type='json';insecure_ssl='0'}}\n$hook|ConvertTo-Json -Depth 5|Set-Content (Join-Path $WorkRoot 'webhook-proposal.json')\n@'\nimport hashlib,hmac,json\nKEY=b\"az400-nonsecret-training-fixture\"\ndef accepts(body,signature):\n expected=\"sha256=\"+hmac.new(KEY,body,hashlib.sha256).hexdigest()\n return isinstance(signature,str) and signature.startswith(\"sha256=\") and hmac.compare_digest(signature,expected)\nbody=b'{\"event\":\"workflow_run\",\"conclusion\":\"failure\"}'\nsignature=\"sha256=\"+hmac.new(KEY,body,hashlib.sha256).hexdigest()\nresult={\"validAccepted\":accepts(body,signature),\"tamperedRejected\":not accepts(body+b\" \",signature),\"missingRejected\":not accepts(body,None),\"fixtureOnly\":True}\nif not all(result[k] for k in (\"validAccepted\",\"tamperedRejected\",\"missingRejected\")):raise SystemExit(\"webhook signature boundary failed\")\nprint(json.dumps(result))\n\n'@|Set-Content (Join-Path $WorkRoot 'verify_webhook.py')\npython (Join-Path $WorkRoot 'verify_webhook.py')|Set-Content (Join-Path $WorkRoot 'webhook-verification.json')\nif($LASTEXITCODE -ne 0){throw 'Webhook signature tests failed.'}\n",
      "expected": "A real HMAC-SHA256 verification function accepts original bytes and rejects tampering and missing signatures; the external webhook stays inactive.",
      "positive": "$r=python (Join-Path $WorkRoot 'verify_webhook.py')|ConvertFrom-Json\nif(-not $r.validAccepted -or -not $r.tamperedRejected){throw 'Webhook authenticity boundary failed.'}\n",
      "negative": "$h=Get-Content (Join-Path $WorkRoot 'webhook-proposal.json') -Raw|ConvertFrom-Json\n$r=Get-Content (Join-Path $WorkRoot 'webhook-verification.json') -Raw|ConvertFrom-Json\nif($h.active -or $h.config.insecure_ssl -ne '0' -or -not $r.missingRejected){throw 'Webhook transport/signature gate failed.'}\n",
      "validate": "$r=python (Join-Path $WorkRoot 'verify_webhook.py')|ConvertFrom-Json\nif(-not $r.validAccepted -or -not $r.tamperedRejected){throw 'Webhook authenticity boundary failed.'}\n\n$h=Get-Content (Join-Path $WorkRoot 'webhook-proposal.json') -Raw|ConvertFrom-Json\n$r=Get-Content (Join-Path $WorkRoot 'webhook-verification.json') -Raw|ConvertFrom-Json\nif($h.active -or $h.config.insecure_ssl -ne '0' -or -not $r.missingRejected){throw 'Webhook transport/signature gate failed.'}\n",
      "evidence": "Signature test outcomes and inactive event subscription; never retain a real webhook secret.",
      "fix": "Compute HMAC over exact request bytes and compare in constant time. Receiver routing, replay protection, and approved external activation are separate controls.",
      "coverage": [
        {
          "objectiveId": "D1.3.4",
          "level": "practiced",
          "reference": "Verify HMAC-SHA256 for original, tampered, and unsigned local webhook payloads; no delivery endpoint is activated."
        }
      ]
    },
    {
      "id": "CP4",
      "title": "Create a sandbox project wiki from Markdown",
      "commands": "$page=Join-Path $WorkRoot 'handoff.md'\n $wiki=az devops wiki create --organization $AdoOrganization --project $AdoProject --name \"handoff-$RunId\" --type projectWiki -o json|ConvertFrom-Json\n $wiki.id|Set-Content (Join-Path $WorkRoot 'wiki-id.txt')\n az devops wiki page create --organization $AdoOrganization --project $AdoProject --wiki $wiki.id --path '/Release handoff' --file-path $page -o json|Set-Content (Join-Path $WorkRoot 'wiki-page.json')\n",
      "expected": "A sandbox wiki contains the process handoff.",
      "positive": "$id=Get-Content (Join-Path $WorkRoot 'wiki-id.txt')\n $p=az devops wiki page show --organization $AdoOrganization --project $AdoProject --wiki $id --path '/Release handoff' --include-content -o json|ConvertFrom-Json\n if ($p.page.content -notmatch 'flowchart LR') { throw 'Wiki omitted process diagram.' }\n",
      "negative": "$w=Get-Content (Join-Path $WorkRoot 'wiki-page.json') -Raw|ConvertFrom-Json\n if (-not $w.page.path -or $w.page.path -notmatch 'Release handoff') { throw 'Wrong wiki page boundary.' }\n",
      "validate": "$id=Get-Content (Join-Path $WorkRoot 'wiki-id.txt')\n $p=az devops wiki page show --organization $AdoOrganization --project $AdoProject --wiki $id --path '/Release handoff' --include-content -o json|ConvertFrom-Json\n if ($p.page.content -notmatch 'flowchart LR') { throw 'Wiki omitted process diagram.' }\n\n$w=Get-Content (Join-Path $WorkRoot 'wiki-page.json') -Raw|ConvertFrom-Json\n if (-not $w.page.path -or $w.page.path -notmatch 'Release handoff') { throw 'Wrong wiki page boundary.' }\n",
      "evidence": "Wiki ID/path and content digest.",
      "fix": "Use the fresh project wiki; do not replace an organization knowledge base.",
      "coverage": [
        {
          "objectiveId": "D1.3.1",
          "level": "practiced",
          "reference": "Create and read the run-owned Azure DevOps wiki page with a Mermaid flow."
        }
      ]
    },
    {
      "id": "CP5",
      "title": "Evaluate notification filtering and sanitized handoffs locally",
      "commands": "$review=[ordered]@{boardsProject=$AdoProject;githubRepository=$GhRepo;teamsChannel='UNCONFIGURED';notifications=@('release failure');externalAuthorizationRequired=$true;messagesSent=0}\n $review|ConvertTo-Json|Set-Content (Join-Path $WorkRoot 'integration-review.json')\n$events=@(@{id='release-failed';kind='release failure';repository=$GhRepo;secret='synthetic-only'},@{id='issue-edited';kind='issue edit';repository=$GhRepo;secret='synthetic-only'},@{id='foreign-release';kind='release failure';repository='another/owner';secret='synthetic-only'})\n$queued=@($events|Where-Object {$_.kind -in $review.notifications -and $_.repository -eq $GhRepo}|ForEach-Object {@{id=$_.id;summary='Release failed; investigate the access-controlled build record.';destination='UNCONFIGURED'}})\n@{fixtureOnly=$true;inputCount=$events.Count;queued=$queued;messagesSent=0}|ConvertTo-Json -Depth 6|Set-Content (Join-Path $WorkRoot 'notification-preview.json')\n",
      "expected": "Three synthetic events exercise repository and event filters; only the owned failed release produces a sanitized preview. No external message is sent.",
      "positive": "$r=Get-Content (Join-Path $WorkRoot 'integration-review.json') -Raw|ConvertFrom-Json\n if (-not $r.externalAuthorizationRequired -or $r.notifications[0] -ne 'release failure') { throw 'Integration needs explicit authorization and event selection.' }\n$p=Get-Content (Join-Path $WorkRoot 'notification-preview.json') -Raw|ConvertFrom-Json\nif($p.inputCount -ne 3 -or @($p.queued).Count -ne 1 -or $p.queued[0].id -ne 'release-failed'){throw 'Notification filter failed its owned/routine/foreign cases.'}\n",
      "negative": "$r=Get-Content (Join-Path $WorkRoot 'integration-review.json') -Raw|ConvertFrom-Json\n if ($r.messagesSent -ne 0) { throw 'This review must not send external notifications.' }\n$text=Get-Content (Join-Path $WorkRoot 'notification-preview.json') -Raw\nif($text -match 'synthetic-only|\"secret\"' -or ($text|ConvertFrom-Json).messagesSent -ne 0){throw 'Notification preview leaked input fields or sent external traffic.'}\n",
      "validate": "$r=Get-Content (Join-Path $WorkRoot 'integration-review.json') -Raw|ConvertFrom-Json\n if (-not $r.externalAuthorizationRequired -or $r.notifications[0] -ne 'release failure') { throw 'Integration needs explicit authorization and event selection.' }\n$p=Get-Content (Join-Path $WorkRoot 'notification-preview.json') -Raw|ConvertFrom-Json\nif($p.inputCount -ne 3 -or @($p.queued).Count -ne 1 -or $p.queued[0].id -ne 'release-failed'){throw 'Notification filter failed its owned/routine/foreign cases.'}\n\n$r=Get-Content (Join-Path $WorkRoot 'integration-review.json') -Raw|ConvertFrom-Json\n if ($r.messagesSent -ne 0) { throw 'This review must not send external notifications.' }\n$text=Get-Content (Join-Path $WorkRoot 'notification-preview.json') -Raw\nif($text -match 'synthetic-only|\"secret\"' -or ($text|ConvertFrom-Json).messagesSent -ne 0){throw 'Notification preview leaked input fields or sent external traffic.'}\n",
      "evidence": "Input count, selected event identity, sanitized preview and separate account-level authorization requirements.",
      "fix": "Authorize external applications only through the separate account-bootstrap procedure, then test with approved recipients.",
      "coverage": [
        {
          "objectiveId": "D1.3.5",
          "level": "explained",
          "reference": "Review a Boards notification contract; configuring the account-level integration remains a bootstrap task."
        },
        {
          "objectiveId": "D1.3.6",
          "level": "explained",
          "reference": "Review a Teams notification payload and connection prerequisites; no external message is sent."
        }
      ]
    }
  ],
  "breakFix": {
    "trigger": "$h=Get-Content (Join-Path $WorkRoot 'webhook-proposal.json') -Raw|ConvertFrom-Json;$h.config.insecure_ssl='1';$h|ConvertTo-Json -Depth 5|Set-Content (Join-Path $WorkRoot 'webhook-proposal.json')\n",
    "diagnose": "Get-Content (Join-Path $WorkRoot 'webhook-proposal.json') -Raw|ConvertFrom-Json|Select-Object -ExpandProperty config\n",
    "repair": "$h=Get-Content (Join-Path $WorkRoot 'webhook-proposal.json') -Raw|ConvertFrom-Json;$h.config.insecure_ssl='0';$h|ConvertTo-Json -Depth 5|Set-Content (Join-Path $WorkRoot 'webhook-proposal.json')\n",
    "assert": "$h=Get-Content (Join-Path $WorkRoot 'webhook-proposal.json') -Raw|ConvertFrom-Json\nif($h.config.insecure_ssl -ne '0' -or $h.config.url -notmatch '^https://'){throw 'AZ400-L03-FAULT'}\n",
    "expectedFailure": "AZ400-L03-FAULT"
  },
  "challenge": "Produce release notes with changes, migration requirements, rollback, and links to accepted work without exposing internal identifiers.",
  "sources": [
    "https://learn.microsoft.com/en-us/azure/devops/project/wiki/wiki-create-repo",
    "https://docs.github.com/en/webhooks/using-webhooks/best-practices-for-using-webhooks",
    "https://learn.microsoft.com/en-us/azure/devops/boards/github/connect-to-github"
  ],
  "primer": "Documentation is a versioned delivery artifact. Webhooks need authenticated receivers and narrow event subscriptions; external app authorization is a separate privileged action.\n\nGenerate release notes from actual history, then add user impact and operational guidance through review. Commit subjects provide provenance, but they cannot infer customer impact or database compatibility. A diagram in a wiki should describe the handoff that operators actually need.\n\nThe HMAC fixture uses a clearly nonsecret training key. Verify the exact raw bytes with constant-time comparison before parsing a webhook event; appending whitespace invalidates the signature. Real receivers additionally need replay/event-ID deduplication, narrow event selection, TLS, key rotation and bounded delivery retries. The inactive webhook and Teams/Boards proposals require separate account authorization.",
