<svg xmlns="http://www.w3.org/2000/svg" width="760" height="650" viewBox="0 0 760 650" role="img" aria-labelledby="title desc"><title id="title">Lab 03: Documentation publication and integration contracts</title><desc id="desc">Git history and Markdown become a versioned release/API handoff published to the disposable Azure DevOps wiki. An inactive webhook payload defines a separate notification contract. Activating a signed receiver or Teams integration requires its owner and separate bootstrap consent; this lab sends no external messages. Relationships: Git history + Markdown to Release / API handoff: generate and review; Release / API handoff to Azure DevOps wiki: owned wiki API; Release / API handoff to Inactive webhook JSON: event contract; Inactive webhook JSON to Approved receiver / Teams: future signed delivery; Integration owner to Approved receiver / Teams: separate app consent; Integration owner to Inactive webhook JSON: scope and HMAC review</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto-start-reverse"><path d="M0,0 L0,8 L8,4 z" fill="#0369a1"/></marker></defs>
