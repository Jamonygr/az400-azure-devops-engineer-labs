          "text": "The current page title and its navigation category",
          "rationale": "Those identify presentation structure rather than the person or revision responsible."
        },
        {
          "key": "B",
          "text": "The number of people with read access",
          "rationale": "Reader inventory does not identify who changed the instruction."
        },
        {
          "key": "C",
          "text": "The newest release tag in an unrelated application repository",
          "rationale": "That tag does not establish the wiki page's editing history."
        },
        {
          "key": "D",
          "text": "The page's source revision and associated change discussion",
          "rationale": "Version history connects the exact instruction change to its author and review context."
        }
      ],
      "correctAnswers": [
        "D"
      ],
      "explanation": "Version history connects the exact instruction change to its author and review context. Those identify presentation structure rather than the person or revision responsible. Reader inventory does not identify who changed the instruction. That tag does not establish the wiki page's editing history.",
      "sourceIds": [
        "S1"
      ]
    },
