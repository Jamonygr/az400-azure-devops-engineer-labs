      "difficulty": "applied",
      "question": "The same webhook delivery is retried after a timeout and creates two release requests. Which receiver property is missing?",
      "options": [
        {
          "key": "A",
          "text": "A longer HTTP timeout without event identity tracking",
          "rationale": "More waiting may reduce some retries but does not prevent duplicate effects when retries occur."
        },
        {
          "key": "B",
          "text": "A unique release-request title generated for every retry",
          "rationale": "A new identity per retry hides that the event represents the same logical work."
        },
        {
          "key": "C",
          "text": "More parallel workers with independent process-local event lists",
          "rationale": "Independent workers can each accept the same delivery and create duplicate side effects."
        },
        {
          "key": "D",
          "text": "Idempotent processing for a repeated delivery identity",
          "rationale": "A repeated transport event should not repeat the same intended side effect."
        }
      ],
      "correctAnswers": [
