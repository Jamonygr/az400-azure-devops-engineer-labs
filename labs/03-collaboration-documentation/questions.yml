    {
      "id": "L03-Q001",
      "checkpointId": "CP4",
      "objectiveIds": [
        "D1.3.1"
      ],
      "difficulty": "foundational",
      "question": "An operations runbook is edited without review and now names the wrong service. Which repository practice best improves accountability for future edits?",
      "options": [
        {
          "key": "A",
          "text": "Edit the rendered page directly and keep the repository unchanged",
          "rationale": "The published instructions would diverge from the maintained source of truth."
        },
        {
          "key": "B",
          "text": "Review version-controlled documentation changes through pull requests",
          "rationale": "The proposed change receives review and retains an attributable revision history."
        },
        {
          "key": "C",
          "text": "Replace the wiki page after every incident without preserving earlier versions",
          "rationale": "That removes the revision evidence needed to understand and reverse a bad edit."
        },
        {
          "key": "D",
          "text": "Allow only emailed copies of the runbook",
          "rationale": "Email copies fragment the source and do not establish a reviewed shared version."
        }
      ],
      "correctAnswers": [
        "B"
      ],
      "explanation": "The published instructions would diverge from the maintained source of truth. The proposed change receives review and retains an attributable revision history. That removes the revision evidence needed to understand and reverse a bad edit. Email copies fragment the source and do not establish a reviewed shared version.",
      "sourceIds": [
        "S1"
      ]
    },
