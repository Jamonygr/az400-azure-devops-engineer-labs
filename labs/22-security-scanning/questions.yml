    {
      "id": "L22-Q001",
      "checkpointId": "CP1",
      "objectiveIds": [
        "D4.3.1"
      ],
      "difficulty": "foundational",
      "question": "The team inventories NuGet dependencies but currently sees only direct references. Which command option includes packages introduced by other packages?",
      "options": [
        {
          "key": "A",
          "text": "no-restore alone",
          "rationale": "Skipping restoration changes execution behavior rather than expanding inventory to transitive references."
        },
        {
          "key": "B",
          "text": "include-transitive",
          "rationale": "Transitive dependency inventory includes packages resolved through the project's direct package references."
        },
        {
          "key": "C",
          "text": "outdated alone",
          "rationale": "Outdated reporting finds newer versions rather than requesting complete transitive dependency visibility."
        },
        {
          "key": "D",
          "text": "include-prerelease alone",
          "rationale": "Prerelease selection does not independently include dependencies introduced by other packages."
        }
      ],
      "correctAnswers": [
        "B"
      ],
      "explanation": "Skipping restoration changes execution behavior rather than expanding inventory to transitive references. Transitive dependency inventory includes packages resolved through the project's direct package references. Outdated reporting finds newer versions rather than requesting complete transitive dependency visibility. Prerelease selection does not independently include dependencies introduced by other packages.",
      "sourceIds": [
        "S4"
      ]
    },
