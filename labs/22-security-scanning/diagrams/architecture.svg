<svg xmlns="http://www.w3.org/2000/svg" width="760" height="682" viewBox="0 0 760 682" role="img" aria-labelledby="title desc"><title id="title">Lab 22: Separate assurance surfaces feeding a release decision</title><desc id="desc">Direct/transitive package locks are checked against current vulnerability advisories, while source, container, secret, and licensing surfaces require distinct evidence. The core performs dependency queries, a synthetic leakage rule, and a license review queue; the CodeQL/container contracts remain separate live scanner integrations. Unknown licensing or an unexecuted scanner cannot become a green release decision. Relationships: Sample source + package locks to NuGet vulnerability advisories: dependency inventory lookup; Sample source + package locks to CodeQL workflow contract: C# analysis target; NuGet vulnerability advisories to Reviewed security release gate: dated severity findings; CodeQL workflow contract to Reviewed security release gate: separate scan result; Container image + scan contract to Reviewed security release gate: image severity result; Sample source + package locks to License / secret review evidence: licenses / synthetic leak rule; License / secret review evidence to Reviewed security release gate: explicit approval status</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto-start-reverse"><path d="M0,0 L0,8 L8,4 z" fill="#0369a1"/></marker></defs>
<rect width="760" height="682" rx="16" fill="#f0f9ff"/>
<text x="22" y="30" fill="#0c4a6e" font-size="19" font-weight="bold" font-family="sans-serif">Lab 22: Separate assurance surfaces feeding a release decision</text>
