          "text": "Add repository contents write permission",
          "rationale": "Content write does not change the OIDC subject or repair Azure trust matching."
        },
        {
          "key": "C",
          "text": "Configure the exact production-environment subject",
          "rationale": "Adding an environment changes the default subject, so trust must match that protected workload."
        },
        {
          "key": "D",
          "text": "Remove the environment and bypass its approval",
          "rationale": "Removing protection changes the required release governance instead of correcting intended federation claims."
        }
      ],
      "correctAnswers": [
        "C"
      ],
      "explanation": "Broad trust unnecessarily expands which workloads can obtain the production Azure identity. Content write does not change the OIDC subject or repair Azure trust matching. Adding an environment changes the default subject, so trust must match that protected workload. Removing protection changes the required release governance instead of correcting intended federation claims.",
