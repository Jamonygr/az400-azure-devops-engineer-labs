      "difficulty": "applied",
      "question": "The workflow can request an OIDC token but Azure rejects the exchange. Which fields should be compared to the federated credential?",
      "options": [
        {
          "key": "A",
          "text": "Issuer, subject and audience",
          "rationale": "Federation requires the presented workload claims to match the configured trust relationship."
        },
        {
          "key": "B",
          "text": "Only the Azure client ID and resource group",
          "rationale": "Application selection and target scope alone do not validate issuer, subject and audience trust matching."
        },
        {
          "key": "C",
          "text": "Only the Azure role names assigned to the principal",
          "rationale": "Authorization roles cannot repair a mismatch in the workload token exchange trust claims."
        },
        {
          "key": "D",
          "text": "Only the token expiry time and issuance time",
          "rationale": "Token timing does not establish the configured subject, issuer and audience trust relationship."
