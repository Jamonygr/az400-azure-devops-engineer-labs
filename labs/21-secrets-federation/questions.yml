        {
          "key": "A",
          "text": "Authorize the fallback connection for every pipeline",
          "rationale": "Broad use expands the credential's reach beyond the reviewed migration recovery need."
        },
        {
          "key": "B",
          "text": "Explicit expiry, access limits and a removal plan",
          "rationale": "Temporary fallback credentials still require bounded exposure and a deliberate retirement lifecycle."
        },
        {
          "key": "C",
          "text": "Remove all expiration and monitoring",
          "rationale": "Unlimited fallback lifetime increases credential exposure and makes migration cleanup less reliable."
        },
        {
          "key": "D",
          "text": "Commit the fallback secret beside the new YAML",
          "rationale": "Source publication exposes the reusable credential rather than safely preserving a limited fallback."
