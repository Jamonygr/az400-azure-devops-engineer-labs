    {
      "id": "L21-Q001",
      "checkpointId": "CP2",
      "objectiveIds": [
        "D4.2.2",
        "D4.1.2"
      ],
      "difficulty": "foundational",
      "question": "A GitHub deployment job needs Azure access without storing a long-lived client secret. Which authentication pattern should be selected?",
      "options": [
        {
          "key": "A",
          "text": "A personal administrator token in workflow source",
          "rationale": "Committed personal credentials expose privileged access and do not implement workload federation."
        },
        {
          "key": "B",
          "text": "An App Service publish profile for every Azure operation",
          "rationale": "Publish profiles are deployment credentials rather than general secret-free Azure workload authentication."
        },
        {
          "key": "C",
          "text": "OIDC workload identity federation",
          "rationale": "Federation exchanges trusted workload identity for short-lived Azure authentication without a stored client secret."
        },
        {
          "key": "D",
          "text": "A shared client secret in repository settings",
          "rationale": "A stored reusable secret retains the credential rotation and leakage burden federation avoids."
        }
      ],
      "correctAnswers": [
        "C"
      ],
      "explanation": "Committed personal credentials expose privileged access and do not implement workload federation. Publish profiles are deployment credentials rather than general secret-free Azure workload authentication. Federation exchanges trusted workload identity for short-lived Azure authentication without a stored client secret. A stored reusable secret retains the credential rotation and leakage burden federation avoids.",
      "sourceIds": [
        "S2"
      ]
    },
    {
      "id": "L21-Q002",
      "checkpointId": "CP2",
      "objectiveIds": [
        "D4.2.2",
        "D4.1.2"
      ],
      "difficulty": "foundational",
      "question": "The Azure login action cannot request a GitHub OIDC token because the job lacks permission. Which permission is required?",
      "options": [
        {
          "key": "A",
          "text": "packages write",
          "rationale": "Package publication permission does not provide the required workload identity token permission."
        },
        {
          "key": "B",
          "text": "id-token write",
          "rationale": "This permission allows the job to request an OIDC token for federation."
        },
        {
          "key": "C",
          "text": "contents write",
          "rationale": "Repository content write permission does not authorize requesting an OIDC identity token."
        },
        {
          "key": "D",
          "text": "actions write",
          "rationale": "Workflow management permission is different from the job's OIDC token request capability."
        }
      ],
      "correctAnswers": [
        "B"
      ],
      "explanation": "Package publication permission does not provide the required workload identity token permission. This permission allows the job to request an OIDC token for federation. Repository content write permission does not authorize requesting an OIDC identity token. Workflow management permission is different from the job's OIDC token request capability.",
      "sourceIds": [
        "S2"
      ]
    },
    {
      "id": "L21-Q003",
      "checkpointId": "CP2",
      "objectiveIds": [
        "D4.2.2",
        "D4.1.2"
      ],
      "difficulty": "applied",
      "question": "A GitHub job uses environment production. Which default subject should its Azure federated credential match for repository owner/course?",
      "options": [
        {
          "key": "A",
          "text": "repo:owner/course:environment:production",
          "rationale": "Environment jobs use an environment-qualified subject rather than the normal branch subject."
        },
        {
          "key": "B",
          "text": "repo:owner/course:ref:refs/heads/main",
          "rationale": "The branch-qualified default does not match this job's environment-qualified subject claim."
        },
        {
          "key": "C",
          "text": "repo:owner/course:pull_request",
          "rationale": "A pull-request subject does not match the protected production environment job."
        },
        {
          "key": "D",
          "text": "repo:other/course:environment:production",
          "rationale": "The different repository owner makes the subject identify another workload context."
        }
      ],
      "correctAnswers": [
        "A"
      ],
      "explanation": "Environment jobs use an environment-qualified subject rather than the normal branch subject. The branch-qualified default does not match this job's environment-qualified subject claim. A pull-request subject does not match the protected production environment job. The different repository owner makes the subject identify another workload context.",
      "sourceIds": [
        "S2"
      ],
      "exhibit": {
        "language": "yaml",
        "code": "repository: owner/course\njob:\n  environment: production\n  permissions:\n    contents: read\n    id-token: write"
      }
    },
    {
