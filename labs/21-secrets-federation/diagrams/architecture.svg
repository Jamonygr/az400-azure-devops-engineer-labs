<text x="563" y="400" fill="#0f172a" font-family="sans-serif" font-size="18">identity</text>
</g>
<g data-node="target"><rect x="285" y="330" width="190" height="120" rx="11" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/><text x="298" y="353" fill="#0284c7" font-family="sans-serif" font-size="12" font-weight="bold">PLATFORM</text>
<text x="298" y="378" fill="#0f172a" font-family="sans-serif" font-size="18">Scoped Azure target</text>
<text x="298" y="400" fill="#0f172a" font-family="sans-serif" font-size="18">role</text>
</g>
<g data-node="secrets"><rect x="20" y="330" width="190" height="120" rx="11" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/><text x="33" y="353" fill="#ea580c" font-family="sans-serif" font-size="12" font-weight="bold">EVIDENCE</text>
<text x="33" y="378" fill="#0f172a" font-family="sans-serif" font-size="18">Key Vault / secure-</text>
<text x="33" y="400" fill="#0f172a" font-family="sans-serif" font-size="18">file contract</text>
</g>
<text x="22" y="480" fill="#0c4a6e" font-family="sans-serif" font-weight="bold" font-size="16">Relationships</text>
<text x="22" y="507" fill="#0f172a" font-family="sans-serif" font-size="14.5">1. short-lived workload assertion</text>
<text x="392" y="507" fill="#0f172a" font-family="sans-serif" font-size="14.5">2. issuer / audience / subject</text>
<text x="22" y="545" fill="#0f172a" font-family="sans-serif" font-size="14.5">3. federated credential binding</text>
<text x="392" y="545" fill="#0f172a" font-family="sans-serif" font-size="14.5">4. least-privilege access</text>
<text x="22" y="583" fill="#0f172a" font-family="sans-serif" font-size="14.5">5. runtime retrieval contract</text>
<text x="22" y="636" fill="#334155" font-family="sans-serif" font-size="12">Solid: core relationship · Dashed: separately gated integration · See walkthrough for verification limits.</text>
</svg>
