<svg xmlns="http://www.w3.org/2000/svg" width="760" height="650" viewBox="0 0 760 650" role="img" aria-labelledby="title desc"><title id="title">Lab 21: GitHub OIDC to Entra federation and an RG identity</title><desc id="desc">The actual federated-credential resource binds the exact GitHub repository/environment subject and token-exchange audience to an RG-owned managed identity. A running job would obtain a short-lived assertion from GitHub and exchange it through Entra for scoped target access. The core configures that binding; target-role use, Key Vault retrieval, and secure-file consumption require separately verified integration and never store token bytes in evidence. Relationships: GitHub environment job to GitHub OIDC issuer: short-lived workload assertion; GitHub OIDC issuer to Entra federation validation: issuer / audience / subject; Entra federation validation to RG-owned managed identity: federated credential binding; RG-owned managed identity to Scoped Azure target role: least-privilege access; Scoped Azure target role to Key Vault / secure-file contract: runtime retrieval contract</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto-start-reverse"><path d="M0,0 L0,8 L8,4 z" fill="#0369a1"/></marker></defs>
<rect width="760" height="650" rx="16" fill="#f0f9ff"/>
<text x="22" y="30" fill="#0c4a6e" font-size="19" font-weight="bold" font-family="sans-serif">Lab 21: GitHub OIDC to Entra federation and an RG identity</text>
<path d="M210,160.0 H285" fill="none" stroke="#0369a1" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)" data-from="job" data-to="issuer"><title>short-lived workload assertion</title></path>
<circle cx="247.5" cy="160.0" r="11" fill="#ffffff" stroke="#0369a1" stroke-width="1.5"/><text x="247.5" y="164.5" text-anchor="middle" fill="#075985" font-size="13" font-weight="bold" font-family="sans-serif">1</text>
<path d="M475,160.0 H550" fill="none" stroke="#0369a1" stroke-width="2" marker-end="url(#arrow)" data-from="issuer" data-to="entra"><title>issuer / audience / subject</title></path>
<circle cx="512.5" cy="160.0" r="11" fill="#ffffff" stroke="#0369a1" stroke-width="1.5"/><text x="512.5" y="164.5" text-anchor="middle" fill="#075985" font-size="13" font-weight="bold" font-family="sans-serif">2</text>
<path d="M645.0,220 V330" fill="none" stroke="#0369a1" stroke-width="2" marker-end="url(#arrow)" data-from="entra" data-to="uami"><title>federated credential binding</title></path>
<circle cx="645.0" cy="275.0" r="11" fill="#ffffff" stroke="#0369a1" stroke-width="1.5"/><text x="645.0" y="279.5" text-anchor="middle" fill="#075985" font-size="13" font-weight="bold" font-family="sans-serif">3</text>
<path d="M550,390.0 H475" fill="none" stroke="#0369a1" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)" data-from="uami" data-to="target"><title>least-privilege access</title></path>
<circle cx="512.5" cy="390.0" r="11" fill="#ffffff" stroke="#0369a1" stroke-width="1.5"/><text x="512.5" y="394.5" text-anchor="middle" fill="#075985" font-size="13" font-weight="bold" font-family="sans-serif">4</text>
<path d="M285,390.0 H210" fill="none" stroke="#0369a1" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)" data-from="target" data-to="secrets"><title>runtime retrieval contract</title></path>
<circle cx="247.5" cy="390.0" r="11" fill="#ffffff" stroke="#0369a1" stroke-width="1.5"/><text x="247.5" y="394.5" text-anchor="middle" fill="#075985" font-size="13" font-weight="bold" font-family="sans-serif">5</text>
<g data-node="job"><rect x="20" y="100" width="190" height="120" rx="11" fill="#ffffff" stroke="#0284c7" stroke-width="2"/><text x="33" y="123" fill="#0284c7" font-family="sans-serif" font-size="12" font-weight="bold">CODE</text>
<text x="33" y="148" fill="#0f172a" font-family="sans-serif" font-size="18">GitHub environment</text>
<text x="33" y="170" fill="#0f172a" font-family="sans-serif" font-size="18">job</text>
</g>
