{
  "schemaVersion": "1.0.0",
  "id": "21",
  "slug": "21-secrets-federation",
  "title": "Federate pipeline identity and protect secrets",
  "domain": "security",
  "minutes": 120,
  "cost": "none or approved hosted-run allowance",
  "platforms": [
    "local",
    "azure",
    "github"
  ],
  "objectives": [
    "D4.1.2",
    "D4.1.3",
    "D4.2.1",
    "D4.2.2",
    "D4.2.3",
    "D4.2.4"
  ],
  "scenario": "A deployment uses a long-lived secret and logs too much configuration. Bind one exact federated subject and define safe secret/file handling.",
  "role": "Automation security engineer",
  "outcome": "Federate pipeline identity and protect secrets.",
  "checkpoints": [
    {
      "id": "CP1",
      "title": "Create the run-owned federation identity",
      "commands": "$m=az identity create --subscription $SubscriptionId --resource-group $ResourceGroup --location $Location --name \"federated-$RunId\" -o json|ConvertFrom-Json\n $m|ConvertTo-Json -Depth 8|Set-Content (Join-Path $WorkRoot 'federated-identity.json')\n",
      "expected": "A managed identity provides a federation target without creating a client secret.",
      "positive": "$m=Get-Content (Join-Path $WorkRoot 'federated-identity.json') -Raw|ConvertFrom-Json\n if(-not $m.clientId -or -not $m.principalId){throw 'Federation identity IDs absent.'}\n",
      "negative": "$m=Get-Content (Join-Path $WorkRoot 'federated-identity.json') -Raw|ConvertFrom-Json\n if($m.id -notlike \"*/resourceGroups/$ResourceGroup/*\"){throw 'Unowned federation target.'}\n",
      "validate": "$m=Get-Content (Join-Path $WorkRoot 'federated-identity.json') -Raw|ConvertFrom-Json\n if(-not $m.clientId -or -not $m.principalId){throw 'Federation identity IDs absent.'}\n\n$m=Get-Content (Join-Path $WorkRoot 'federated-identity.json') -Raw|ConvertFrom-Json\n if($m.id -notlike \"*/resourceGroups/$ResourceGroup/*\"){throw 'Unowned federation target.'}\n",
      "evidence": "Managed identity ID and explicitly nonsecret client/tenant metadata.",
      "fix": "Use an RG-contained managed identity and least-privilege role, never a copied application password."
    },
    {
      "id": "CP2",
      "title": "Bind the exact GitHub environment subject",
      "commands": "$subject=\"repo:${GhRepo}:environment:release-$RunId\"\n az identity federated-credential create --subscription $SubscriptionId --resource-group $ResourceGroup --identity-name \"federated-$RunId\" --name github-release --issuer 'https://token.actions.githubusercontent.com' --subject $subject --audiences 'api://AzureADTokenExchange' -o json|Set-Content (Join-Path $WorkRoot 'federated-credential.json')\n",
      "expected": "Federation accepts one repository/environment subject and the Azure token-exchange audience.",
      "positive": "$f=az identity federated-credential show --subscription $SubscriptionId --resource-group $ResourceGroup --identity-name \"federated-$RunId\" --name github-release -o json|ConvertFrom-Json\n if($f.subject -ne \"repo:${GhRepo}:environment:release-$RunId\"){throw 'Federation subject mismatch.'}\n",
      "negative": "$f=Get-Content (Join-Path $WorkRoot 'federated-credential.json') -Raw|ConvertFrom-Json\n if($f.subject -match '\\*' -or $f.issuer -ne 'https://token.actions.githubusercontent.com'){throw 'Untrusted or wildcard issuer/subject.'}\n",
      "validate": "$f=az identity federated-credential show --subscription $SubscriptionId --resource-group $ResourceGroup --identity-name \"federated-$RunId\" --name github-release -o json|ConvertFrom-Json\n if($f.subject -ne \"repo:${GhRepo}:environment:release-$RunId\"){throw 'Federation subject mismatch.'}\n\n$f=Get-Content (Join-Path $WorkRoot 'federated-credential.json') -Raw|ConvertFrom-Json\n if($f.subject -match '\\*' -or $f.issuer -ne 'https://token.actions.githubusercontent.com'){throw 'Untrusted or wildcard issuer/subject.'}\n",
      "evidence": "Issuer, subject, audience; no assertion JWT is retained.",
      "fix": "Environment-bound and branch-bound subjects differ; copy the exact emitted subject and keep audience exact."
    },
    {
      "id": "CP3",
      "title": "Review Key Vault reference handling",
      "commands": "Copy-Item (Join-Path $LabRoot 'artifacts/keyvault-reference.json') (Join-Path $WorkRoot 'keyvault-reference.json')\n $policy=[ordered]@{fetch='at job runtime through federated identity';retainValue=$false;masking='defense in depth';rotation='new version with rollback plan';vaultProvisioned=$false}\n $policy|ConvertTo-Json|Set-Content (Join-Path $WorkRoot 'vault-policy.json')\n",
      "expected": "Vault references and runtime retrieval are distinct from storing secret values in Git.",
      "positive": "$p=Get-Content (Join-Path $WorkRoot 'vault-policy.json') -Raw|ConvertFrom-Json\n if($p.fetch -notmatch 'federated identity' -or $p.rotation -notmatch 'new version'){throw 'Secret lifecycle policy incomplete.'}\n",
      "negative": "$p=Get-Content (Join-Path $WorkRoot 'vault-policy.json') -Raw|ConvertFrom-Json\n if($p.retainValue -or $p.vaultProvisioned){throw 'Reference review cannot expose values or claim a vault deployment.'}\n",
      "validate": "$p=Get-Content (Join-Path $WorkRoot 'vault-policy.json') -Raw|ConvertFrom-Json\n if($p.fetch -notmatch 'federated identity' -or $p.rotation -notmatch 'new version'){throw 'Secret lifecycle policy incomplete.'}\n\n$p=Get-Content (Join-Path $WorkRoot 'vault-policy.json') -Raw|ConvertFrom-Json\n if($p.retainValue -or $p.vaultProvisioned){throw 'Reference review cannot expose values or claim a vault deployment.'}\n",
      "evidence": "Reference shape and runtime identity requirements, without secret values.",
      "fix": "Key Vault uses separate data-plane RBAC; RG Contributor alone cannot read secret values."
    },
    {
      "id": "CP4",
      "title": "Model secure-file access and deletion after use",
      "commands": "$secureFile=[ordered]@{name='synthetic-signing-input';content='NOT-A-REAL-KEY';authorizedPipeline='single-disposable-pipeline';deleteAfterJob=$true}\n $secureFile|ConvertTo-Json|Set-Content (Join-Path $WorkRoot 'secure-file-contract.json')\n",
      "expected": "A synthetic file contract narrows pipeline authorization and cleanup lifetime.",
      "positive": "$s=Get-Content (Join-Path $WorkRoot 'secure-file-contract.json') -Raw|ConvertFrom-Json\n if(-not $s.deleteAfterJob -or $s.content -ne 'NOT-A-REAL-KEY'){throw 'Secure-file lifetime/fixture violated.'}\n",
      "negative": "$s=Get-Content (Join-Path $WorkRoot 'secure-file-contract.json') -Raw|ConvertFrom-Json\n if($s.authorizedPipeline -eq 'all'){throw 'Secure files must not be broadly authorized.'}\n",
      "validate": "$s=Get-Content (Join-Path $WorkRoot 'secure-file-contract.json') -Raw|ConvertFrom-Json\n if(-not $s.deleteAfterJob -or $s.content -ne 'NOT-A-REAL-KEY'){throw 'Secure-file lifetime/fixture violated.'}\n\n$s=Get-Content (Join-Path $WorkRoot 'secure-file-contract.json') -Raw|ConvertFrom-Json\n if($s.authorizedPipeline -eq 'all'){throw 'Secure files must not be broadly authorized.'}\n",
      "evidence": "Nonsecret file metadata and access decision.",
      "fix": "Store real certificates only in approved protected secure-file/key facilities; never echo their bytes."
    },
    {
      "id": "CP5",
      "title": "Check evidence for a synthetic leakage marker",
      "commands": "$safe='status=complete; value=<redacted>';Set-Content (Join-Path $WorkRoot 'redacted-log.txt') $safe\n $marker='AZ400_SYNTHETIC_SECRET_DO_NOT_USE'\n $leaks=Select-String -Path (Join-Path $WorkRoot 'redacted-log.txt') -SimpleMatch $marker\n [ordered]@{markerFound=[bool]$leaks;redacted=$safe.Contains('<redacted>')}|ConvertTo-Json|Set-Content (Join-Path $WorkRoot 'leak-check.json')\n",
      "expected": "The evidence contains a redaction marker and no synthetic secret.",
      "positive": "$r=Get-Content (Join-Path $WorkRoot 'leak-check.json') -Raw|ConvertFrom-Json\n if(-not $r.redacted){throw 'Expected redaction evidence absent.'}\n",
      "negative": "if(Select-String -Path (Join-Path $WorkRoot 'redacted-log.txt') -SimpleMatch 'AZ400_SYNTHETIC_SECRET_DO_NOT_USE'){throw 'Synthetic secret leaked into log.'}\n",
      "validate": "$r=Get-Content (Join-Path $WorkRoot 'leak-check.json') -Raw|ConvertFrom-Json\n if(-not $r.redacted){throw 'Expected redaction evidence absent.'}\n\nif(Select-String -Path (Join-Path $WorkRoot 'redacted-log.txt') -SimpleMatch 'AZ400_SYNTHETIC_SECRET_DO_NOT_USE'){throw 'Synthetic secret leaked into log.'}\n",
      "evidence": "Pass/fail leakage check only; never include the real credential being checked.",
      "fix": "Masking can miss transformed values; minimize secret exposure and avoid debug tracing around token exchange."
    }
  ],
  "breakFix": {
    "trigger": "Add-Content (Join-Path $WorkRoot 'redacted-log.txt') 'AZ400_SYNTHETIC_SECRET_DO_NOT_USE'\n",
    "diagnose": "Select-String -Path (Join-Path $WorkRoot 'redacted-log.txt') -SimpleMatch 'AZ400_SYNTHETIC_SECRET_DO_NOT_USE'\n",
    "repair": "Set-Content (Join-Path $WorkRoot 'redacted-log.txt') 'status=complete; value=<redacted>'\n"
  },
  "challenge": "Configure a separately approved Azure DevOps workload-identity service connection to the RG-contained identity using the exact service-connection issuer/subject, then prove no client secret exists.",
  "sources": [
    "https://learn.microsoft.com/en-us/entra/workload-id/workload-identity-federation",
    "https://learn.microsoft.com/en-us/azure/devops/pipelines/release/configure-workload-identity",
    "https://docs.github.com/en/actions/security-for-github-actions/security-hardening-your-deployments/configuring-openid-connect-in-azure",
    "https://learn.microsoft.com/en-us/azure/devops/pipelines/library/secure-files"
  ],
  "primer": "OIDC exchanges a constrained workload assertion for an Azure token. Issuer, audience, and subject must all match; masking is defense in depth rather than permission to log secrets.",
  "architecture": {
    "title": "GitHub OIDC to Entra federation and an RG identity",
