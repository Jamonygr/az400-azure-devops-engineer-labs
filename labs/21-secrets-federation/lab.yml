    "topology": "The actual federated-credential resource binds the exact GitHub repository/environment subject and token-exchange audience to an RG-owned managed identity. A running job would obtain a short-lived assertion from GitHub and exchange it through Entra for scoped target access. The core configures that binding; target-role use, Key Vault retrieval, and secure-file consumption require separately verified integration and never store token bytes in evidence."
  },
