      "objectiveIds": [
        "D3.4.7"
      ],
      "difficulty": "foundational",
      "question": "The build has already tested and packaged the sample. What should later release stages promote to preserve build-once delivery?",
      "options": [
        {
          "key": "A",
          "text": "Any archive whose friendly name matches",
          "rationale": "Reused names do not establish identical content or producing source provenance."
        },
        {
          "key": "B",
          "text": "The same identified immutable application artifact",
          "rationale": "Promotion should retain the validated bytes rather than create a different output later."
        },
        {
          "key": "C",
          "text": "Only a newly rebuilt output from the same source label",
          "rationale": "A fresh build can resolve changed inputs and does not preserve the previously validated output bytes."
        },
        {
          "key": "D",
          "text": "A fresh build from the latest moving branch",
          "rationale": "Rebuilding can resolve changed inputs beyond the original approved candidate."
        }
      ],
      "correctAnswers": [
        "B"
      ],
      "explanation": "A fresh build can resolve changed inputs and does not preserve the previously validated output bytes. Reused names do not establish identical content or producing source provenance. Promotion should retain the validated bytes rather than create a different output later. Rebuilding can resolve changed inputs beyond the original approved candidate.",
      "sourceIds": [
        "S2"
      ]
    },
