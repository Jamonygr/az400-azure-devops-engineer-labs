<svg xmlns="http://www.w3.org/2000/svg" width="760" height="650" viewBox="0 0 760 650" role="img" aria-labelledby="title desc"><title id="title">Lab 06: Git object recovery without shared-history destruction</title><desc id="desc">All history exercises stay in an isolated local repository. Commit objects retain snapshots, reflog entries identify moved or deleted references, and restore/revert create reviewed recovery state. A separate clean export demonstrates allowlisting without rewriting any shared remote; genuine secret exposure still requires revocation and coordinated history cleanup. Relationships: Isolated working tree to Commit / tree objects: commit snapshots; Commit / tree objects to Local reference log: reference movements; Local reference log to Recovered branch ref: recover known object ID; Commit / tree objects to Restore / revert commit: new corrective commit; Restore / revert commit to Isolated working tree: healthy file state; Isolated working tree to Allowlisted clean export: reviewed content only</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto-start-reverse"><path d="M0,0 L0,8 L8,4 z" fill="#0369a1"/></marker></defs>
<rect width="760" height="650" rx="16" fill="#f0f9ff"/>
<text x="22" y="30" fill="#0c4a6e" font-size="19" font-weight="bold" font-family="sans-serif">Lab 06: Git object recovery without shared-history destruction</text>
<path d="M210,160.0 H285" fill="none" stroke="#0369a1" stroke-width="2" marker-end="url(#arrow)" data-from="working" data-to="objects"><title>commit snapshots</title></path>
<circle cx="247.5" cy="160.0" r="11" fill="#ffffff" stroke="#0369a1" stroke-width="1.5"/><text x="247.5" y="164.5" text-anchor="middle" fill="#075985" font-size="13" font-weight="bold" font-family="sans-serif">1</text>
<path d="M475,160.0 H550" fill="none" stroke="#0369a1" stroke-width="2" marker-end="url(#arrow)" data-from="objects" data-to="reflog"><title>reference movements</title></path>
<circle cx="512.5" cy="160.0" r="11" fill="#ffffff" stroke="#0369a1" stroke-width="1.5"/><text x="512.5" y="164.5" text-anchor="middle" fill="#075985" font-size="13" font-weight="bold" font-family="sans-serif">2</text>
<path d="M645.0,220 V330" fill="none" stroke="#0369a1" stroke-width="2" marker-end="url(#arrow)" data-from="reflog" data-to="recovered"><title>recover known object ID</title></path>
<circle cx="645.0" cy="275.0" r="11" fill="#ffffff" stroke="#0369a1" stroke-width="1.5"/><text x="645.0" y="279.5" text-anchor="middle" fill="#075985" font-size="13" font-weight="bold" font-family="sans-serif">3</text>
<path d="M380.0,220 V330" fill="none" stroke="#0369a1" stroke-width="2" marker-end="url(#arrow)" data-from="objects" data-to="inverse"><title>new corrective commit</title></path>
<circle cx="380.0" cy="275.0" r="11" fill="#ffffff" stroke="#0369a1" stroke-width="1.5"/><text x="380.0" y="279.5" text-anchor="middle" fill="#075985" font-size="13" font-weight="bold" font-family="sans-serif">4</text>
<path d="M380.0,330 V275.0 H115.0 V220" fill="none" stroke="#0369a1" stroke-width="2" marker-end="url(#arrow)" data-from="inverse" data-to="working"><title>healthy file state</title></path>
<circle cx="247.5" cy="275.0" r="11" fill="#ffffff" stroke="#0369a1" stroke-width="1.5"/><text x="247.5" y="279.5" text-anchor="middle" fill="#075985" font-size="13" font-weight="bold" font-family="sans-serif">5</text>
<path d="M115.0,220 V330" fill="none" stroke="#0369a1" stroke-width="2" marker-end="url(#arrow)" data-from="working" data-to="export"><title>reviewed content only</title></path>
<circle cx="115.0" cy="275.0" r="11" fill="#ffffff" stroke="#0369a1" stroke-width="1.5"/><text x="115.0" y="279.5" text-anchor="middle" fill="#075985" font-size="13" font-weight="bold" font-family="sans-serif">6</text>
<g data-node="working"><rect x="20" y="100" width="190" height="120" rx="11" fill="#ffffff" stroke="#0284c7" stroke-width="2"/><text x="33" y="123" fill="#0284c7" font-family="sans-serif" font-size="12" font-weight="bold">CODE</text>
<text x="33" y="148" fill="#0f172a" font-family="sans-serif" font-size="18">Isolated working</text>
<text x="33" y="170" fill="#0f172a" font-family="sans-serif" font-size="18">tree</text>
</g>
<g data-node="objects"><rect x="285" y="100" width="190" height="120" rx="11" fill="#ecfdf5" stroke="#059669" stroke-width="2"/><text x="298" y="123" fill="#059669" font-family="sans-serif" font-size="12" font-weight="bold">DATA</text>
<text x="298" y="148" fill="#0f172a" font-family="sans-serif" font-size="18">Commit / tree</text>
<text x="298" y="170" fill="#0f172a" font-family="sans-serif" font-size="18">objects</text>
</g>
<g data-node="reflog"><rect x="550" y="100" width="190" height="120" rx="11" fill="#ecfdf5" stroke="#059669" stroke-width="2"/><text x="563" y="123" fill="#059669" font-family="sans-serif" font-size="12" font-weight="bold">DATA</text>
<text x="563" y="148" fill="#0f172a" font-family="sans-serif" font-size="18">Local reference log</text>
</g>
<g data-node="recovered"><rect x="550" y="330" width="190" height="120" rx="11" fill="#ffffff" stroke="#0284c7" stroke-width="2"/><text x="563" y="353" fill="#0284c7" font-family="sans-serif" font-size="12" font-weight="bold">CODE</text>
<text x="563" y="378" fill="#0f172a" font-family="sans-serif" font-size="18">Recovered branch</text>
<text x="563" y="400" fill="#0f172a" font-family="sans-serif" font-size="18">ref</text>
</g>
<g data-node="inverse"><rect x="285" y="330" width="190" height="120" rx="11" fill="#ffffff" stroke="#0284c7" stroke-width="2"/><text x="298" y="353" fill="#0284c7" font-family="sans-serif" font-size="12" font-weight="bold">CODE</text>
<text x="298" y="378" fill="#0f172a" font-family="sans-serif" font-size="18">Restore / revert</text>
<text x="298" y="400" fill="#0f172a" font-family="sans-serif" font-size="18">commit</text>
</g>
<g data-node="export"><rect x="20" y="330" width="190" height="120" rx="11" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/><text x="33" y="353" fill="#ea580c" font-family="sans-serif" font-size="12" font-weight="bold">EVIDENCE</text>
<text x="33" y="378" fill="#0f172a" font-family="sans-serif" font-size="18">Allowlisted clean</text>
<text x="33" y="400" fill="#0f172a" font-family="sans-serif" font-size="18">export</text>
</g>
<text x="22" y="480" fill="#0c4a6e" font-family="sans-serif" font-weight="bold" font-size="16">Relationships</text>
<text x="22" y="507" fill="#0f172a" font-family="sans-serif" font-size="14.5">1. commit snapshots</text>
<text x="392" y="507" fill="#0f172a" font-family="sans-serif" font-size="14.5">2. reference movements</text>
<text x="22" y="545" fill="#0f172a" font-family="sans-serif" font-size="14.5">3. recover known object ID</text>
<text x="392" y="545" fill="#0f172a" font-family="sans-serif" font-size="14.5">4. new corrective commit</text>
<text x="22" y="583" fill="#0f172a" font-family="sans-serif" font-size="14.5">5. healthy file state</text>
<text x="392" y="583" fill="#0f172a" font-family="sans-serif" font-size="14.5">6. reviewed content only</text>
<text x="22" y="636" fill="#334155" font-family="sans-serif" font-size="12">Solid: core relationship · Dashed: separately gated integration · See walkthrough for verification limits.</text>
</svg>
