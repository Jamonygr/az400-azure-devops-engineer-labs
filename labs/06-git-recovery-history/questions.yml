      "id": "L06-Q001",
      "checkpointId": "CP4",
      "objectiveIds": [
        "D2.2.5"
      ],
      "difficulty": "foundational",
      "question": "A developer resets a private branch and loses its name for a recently created commit. Which local record may identify the previous branch position?",
      "options": [
        {
          "key": "A",
          "text": "The reflog for the relevant reference",
          "rationale": "Reflogs record local reference updates and can expose the previous commit identity."
        },
        {
          "key": "B",
          "text": "The current .gitignore patterns",
          "rationale": "Ignore rules do not record branch movement or lost commit identities."
        },
        {
          "key": "C",
          "text": "Only the current index contents",
          "rationale": "The index describes staged content rather than the history of moved references."
        },
        {
          "key": "D",
          "text": "The remote repository description",
          "rationale": "A remote description does not record this local reset operation."
        }
      ],
      "correctAnswers": [
        "A"
      ],
      "explanation": "Reflogs record local reference updates and can expose the previous commit identity. Ignore rules do not record branch movement or lost commit identities. The index describes staged content rather than the history of moved references. A remote description does not record this local reset operation.",
      "sourceIds": [
        "S1"
      ],
      "exhibit": {
        "language": "text",
        "code": "HEAD@{0}:reset:moving to HEAD~1\nHEAD@{1}:commit:validated local correction\nCurrent branch no longer reaches the correction"
      }
    },
