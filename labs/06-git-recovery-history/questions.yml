      "difficulty": "foundational",
      "question": "A bad commit is already on shared main and collaborators have fetched it. Which normal recovery preserves shared history?",
      "options": [
        {
          "key": "A",
          "text": "Create a reviewed revert commit",
          "rationale": "Revert records an inverse change without moving shared main backward."
        },
        {
          "key": "B",
          "text": "Hard-reset main to its parent and force-push as the default response",
          "rationale": "That rewrites already shared history and can disrupt collaborators."
        },
        {
          "key": "C",
          "text": "Delete the bad commit from one local log display",
          "rationale": "Changing display output does not alter the shared source state."
        },
        {
          "key": "D",
          "text": "Rename the branch so the defective commit is less visible",
          "rationale": "The code and its history remain present under the renamed reference."
        }
      ],
      "correctAnswers": [
        "A"
      ],
      "explanation": "Revert records an inverse change without moving shared main backward. That rewrites already shared history and can disrupt collaborators. Changing display output does not alter the shared source state. The code and its history remain present under the renamed reference.",
      "sourceIds": [
        "S2"
      ]
    },
