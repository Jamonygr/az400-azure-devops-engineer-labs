<circle cx="380.0" cy="275.0" r="11" fill="#ffffff" stroke="#0369a1" stroke-width="1.5"/><text x="380.0" y="279.5" text-anchor="middle" fill="#075985" font-size="13" font-weight="bold" font-family="sans-serif">2</text>
<path d="M550,160.0 H475" fill="none" stroke="#0369a1" stroke-width="2" marker-end="url(#arrow)" data-from="plan" data-to="production"><title>slot-capable compute</title></path>
