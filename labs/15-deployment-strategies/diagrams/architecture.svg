<circle cx="247.5" cy="261.0" r="11" fill="#ffffff" stroke="#0369a1" stroke-width="1.5"/><text x="247.5" y="265.5" text-anchor="middle" fill="#075985" font-size="13" font-weight="bold" font-family="sans-serif">7</text>
<path d="M210,390.0 H550" fill="none" stroke="#0369a1" stroke-width="2" marker-end="url(#arrow)" data-from="probe" data-to="staging"><title>readiness result</title></path>
