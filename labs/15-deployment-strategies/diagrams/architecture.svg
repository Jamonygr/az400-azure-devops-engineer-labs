<svg xmlns="http://www.w3.org/2000/svg" width="760" height="682" viewBox="0 0 760 682" role="img" aria-labelledby="title desc"><title id="title">Lab 15: App Service slots, readiness, and progressive traffic</title><desc id="desc">One reviewed ZIP is deployed to production and staging in the same S1 Linux App Service plan. The router sends90%to production and10%to staging, while separate HTTPS probes establish readiness before promotion. Each synthetic training slot uses its own temporary SQLite database in Development; the advanced production-style lane uses separately protected SQL and identity prerequisites. Relationships: Reviewed release ZIP to Production app + SQLite: same deployment bytes; Reviewed release ZIP to Staging slot + SQLite: same deployment bytes; Linux App Service S1 plan to Production app + SQLite: slot-capable compute; Linux App Service S1 plan to Staging slot + SQLite: shared plan boundary; App Service traffic router to Production app + SQLite: 90% production traffic; App Service traffic router to Staging slot + SQLite: 10% canary traffic; HTTPS readiness probes to Production app + SQLite: readiness result; HTTPS readiness probes to Staging slot + SQLite: readiness result</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto-start-reverse"><path d="M0,0 L0,8 L8,4 z" fill="#0369a1"/></marker></defs>
<rect width="760" height="682" rx="16" fill="#f0f9ff"/>
<text x="22" y="30" fill="#0c4a6e" font-size="19" font-weight="bold" font-family="sans-serif">Lab 15: App Service slots, readiness, and progressive traffic</text>
<path d="M210,160.0 H285" fill="none" stroke="#0369a1" stroke-width="2" marker-end="url(#arrow)" data-from="artifact" data-to="production"><title>same deployment bytes</title></path>
