{
  "schemaVersion": "1.0.0",
  "id": "24",
  "slug": "24-monitoring-alerts",
  "title": "Collect telemetry and configure actionable alerts",
  "domain": "instrumentation",
  "minutes": 120,
  "cost": "billable; explicit acknowledgement",
  "platforms": [
    "local",
    "azure"
  ],
  "objectives": [
    "D1.2.7",
    "D5.1.1",
    "D5.1.2",
    "D5.1.3",
    "D5.1.4"
  ],
  "scenario": "The team can deploy an app but has no owned telemetry store or actionable latency rule. Connect workspace-based telemetry and create a silent training alert.",
  "role": "Observability engineer",
  "outcome": "Collect telemetry and configure actionable alerts.",
  "checkpoints": [
    {
      "id": "CP1",
      "title": "Create the owned Log Analytics workspace",
      "commands": "$name=\"logs-$RunId\"\n $w=az monitor log-analytics workspace create --subscription $SubscriptionId --resource-group $ResourceGroup --workspace-name $name --location $Location --retention-time 30 --sku PerGB2018 -o json|ConvertFrom-Json\n $w|ConvertTo-Json -Depth 8|Set-Content (Join-Path $WorkRoot 'workspace.json')\n",
      "expected": "A30-day workspace exists in the owned group; ingestion pricing still applies.",
      "positive": "$w=az monitor log-analytics workspace show --subscription $SubscriptionId --resource-group $ResourceGroup --workspace-name \"logs-$RunId\" -o json|ConvertFrom-Json\n if($w.retentionInDays -ne 30){throw 'Workspace retention mismatch.'}\n",
      "negative": "$w=Get-Content (Join-Path $WorkRoot 'workspace.json') -Raw|ConvertFrom-Json\n if($w.id -notlike \"*/resourceGroups/$ResourceGroup/*\"){throw 'Workspace escaped owned group.'}\n",
      "validate": "$w=az monitor log-analytics workspace show --subscription $SubscriptionId --resource-group $ResourceGroup --workspace-name \"logs-$RunId\" -o json|ConvertFrom-Json\n if($w.retentionInDays -ne 30){throw 'Workspace retention mismatch.'}\n\n$w=Get-Content (Join-Path $WorkRoot 'workspace.json') -Raw|ConvertFrom-Json\n if($w.id -notlike \"*/resourceGroups/$ResourceGroup/*\"){throw 'Workspace escaped owned group.'}\n",
      "evidence": "Workspace ID locally, retention, pricing tier, and ingestion budget.",
      "fix": "Review current workspace billing and approved region; avoid ingesting production/private payloads.",
      "coverage": []
    },
    {
      "id": "CP2",
      "title": "Connect a workspace-based Application Insights component",
      "commands": "$w=Get-Content (Join-Path $WorkRoot 'workspace.json') -Raw|ConvertFrom-Json\n az monitor app-insights component create --subscription $SubscriptionId --resource-group $ResourceGroup --app \"insights-$RunId\" --location $Location --workspace $w.id --kind web --application-type web -o json|Set-Content (Join-Path $WorkRoot 'insights.json')\n",
      "expected": "Application Insights is explicitly connected to the owned workspace.",
      "positive": "$i=az monitor app-insights component show --subscription $SubscriptionId --resource-group $ResourceGroup --app \"insights-$RunId\" -o json|ConvertFrom-Json\n $w=Get-Content (Join-Path $WorkRoot 'workspace.json') -Raw|ConvertFrom-Json\n if($i.workspaceResourceId -ne $w.id){throw 'Insights workspace linkage mismatch.'}\n",
      "negative": "$i=Get-Content (Join-Path $WorkRoot 'insights.json') -Raw|ConvertFrom-Json\n if($i.id -notlike \"*/resourceGroups/$ResourceGroup/*\"){throw 'Insights escaped owned group.'}\n",
      "validate": "$i=az monitor app-insights component show --subscription $SubscriptionId --resource-group $ResourceGroup --app \"insights-$RunId\" -o json|ConvertFrom-Json\n $w=Get-Content (Join-Path $WorkRoot 'workspace.json') -Raw|ConvertFrom-Json\n if($i.workspaceResourceId -ne $w.id){throw 'Insights workspace linkage mismatch.'}\n\n$i=Get-Content (Join-Path $WorkRoot 'insights.json') -Raw|ConvertFrom-Json\n if($i.id -notlike \"*/resourceGroups/$ResourceGroup/*\"){throw 'Insights escaped owned group.'}\n",
      "evidence": "Component/workspace linkage; redact instrumentation/connection values.",
      "fix": "Install the pinned application-insights extension during bootstrap; do not auto-install inside read-only preflight.",
      "coverage": [
        {
          "objectiveId": "D5.1.1",
          "level": "integrated",
          "reference": "Create and query the run-owned Azure Monitor/Application Insights resources."
        },
        {
          "objectiveId": "D5.1.2",
          "level": "practiced",
          "reference": "Inspect the actual telemetry component/workspace linkage."
        }
      ]
    },
    {
      "id": "CP3",
      "title": "Inspect supported metric names before selecting alerts",
      "commands": "$i=Get-Content (Join-Path $WorkRoot 'insights.json') -Raw|ConvertFrom-Json\n az monitor metrics list-definitions --subscription $SubscriptionId --resource $i.id --query '[].{name:name.value,unit:unit,aggregation:primaryAggregationType}' -o json|Set-Content (Join-Path $WorkRoot 'metric-definitions.json')\n",
      "expected": "The resource provider defines actual available metric names and units.",
      "positive": "$m=@(Get-Content (Join-Path $WorkRoot 'metric-definitions.json') -Raw|ConvertFrom-Json)\n if('requests/duration' -notin $m.name){throw 'Expected request-duration metric unavailable; stop before creating alert.'}\n",
      "negative": "$m=@(Get-Content (Join-Path $WorkRoot 'metric-definitions.json') -Raw|ConvertFrom-Json)\n if(@($m|Where-Object { -not $_.name }).Count){throw 'Metric definition missing canonical name.'}\n",
      "validate": "$m=@(Get-Content (Join-Path $WorkRoot 'metric-definitions.json') -Raw|ConvertFrom-Json)\n if('requests/duration' -notin $m.name){throw 'Expected request-duration metric unavailable; stop before creating alert.'}\n\n$m=@(Get-Content (Join-Path $WorkRoot 'metric-definitions.json') -Raw|ConvertFrom-Json)\n if(@($m|Where-Object { -not $_.name }).Count){throw 'Metric definition missing canonical name.'}\n",
      "evidence": "Metric name/unit/aggregation; no inference of live application traffic.",
      "fix": "Use the metric definition unit; avoid applying a millisecond threshold to a count or percent.",
      "coverage": []
    },
    {
      "id": "CP4",
      "title": "Create a silent sandbox response-time alert",
      "commands": "$i=Get-Content (Join-Path $WorkRoot 'insights.json') -Raw|ConvertFrom-Json\n az monitor metrics alert create --subscription $SubscriptionId --resource-group $ResourceGroup --name \"slow-requests-$RunId\" --scopes $i.id --condition 'avg requests/duration > 1000' --window-size 5m --evaluation-frequency 1m --severity 3 --description \"Run $RunId training alert; no external notification action\" -o json|Set-Content (Join-Path $WorkRoot 'alert.json')\n",
      "expected": "A5-minute latency rule exists without action groups or messages to external recipients.",
      "positive": "$a=az monitor metrics alert show --subscription $SubscriptionId --resource-group $ResourceGroup --name \"slow-requests-$RunId\" -o json|ConvertFrom-Json\n if(-not $a.enabled -or $a.windowSize -ne 'PT5M'){throw 'Latency alert disabled or wrong window.'}\n",
      "negative": "$a=Get-Content (Join-Path $WorkRoot 'alert.json') -Raw|ConvertFrom-Json\n if(@($a.actions).Count -gt 0){throw 'This training alert must not notify external recipients.'}\n",
      "validate": "$a=az monitor metrics alert show --subscription $SubscriptionId --resource-group $ResourceGroup --name \"slow-requests-$RunId\" -o json|ConvertFrom-Json\n if(-not $a.enabled -or $a.windowSize -ne 'PT5M'){throw 'Latency alert disabled or wrong window.'}\n\n$a=Get-Content (Join-Path $WorkRoot 'alert.json') -Raw|ConvertFrom-Json\n if(@($a.actions).Count -gt 0){throw 'This training alert must not notify external recipients.'}\n",
      "evidence": "Alert condition/window/severity and empty action list.",
      "fix": "No telemetry means no proof of firing behavior; use an approved synthetic workload for the optional integration test.",
      "coverage": []
    },
    {
      "id": "CP5",
      "title": "Evaluate owned telemetry response decisions",
      "commands": "$map=[ordered]@{application='request duration/error rate';infrastructure=@('CPU','memory','disk','network');github='workflow_run completion and repository insights';azurePipelines='build/release result';notificationMode='reviewed owner only';externalMessagesSent=0;liveTrafficVerified=$false}\n $map|ConvertTo-Json|Set-Content (Join-Path $WorkRoot 'telemetry-response-map.json')\n$events=@(@{id='owned-slow';resourceGroup=$ResourceGroup;requests=12;averageMs=1200},@{id='owned-fast';resourceGroup=$ResourceGroup;requests=20;averageMs=200},@{id='foreign-slow';resourceGroup='another-group';requests=100;averageMs=2000})\n$decisions=@($events|ForEach-Object {@{id=$_.id;action=$(if($_.resourceGroup -ne $ResourceGroup){'exclude-unowned'}elseif($_.requests -gt 0 -and $_.averageMs -gt 1000){'investigate-latency'}else{'observe'});sent=$false}})\n$decisions|ConvertTo-Json|Set-Content (Join-Path $WorkRoot 'response-decisions.json')\n",
      "expected": "Three synthetic observations yield investigate-latency, observe, and exclude-unowned decisions. No notification is sent; external alert delivery remains unverified.",
      "positive": "$m=Get-Content (Join-Path $WorkRoot 'telemetry-response-map.json') -Raw|ConvertFrom-Json\n if($m.infrastructure.Count -ne 4 -or $m.github -notmatch 'workflow_run'){throw 'Telemetry signal map incomplete.'}\n\n$d=@(Get-Content (Join-Path $WorkRoot 'response-decisions.json') -Raw|ConvertFrom-Json)\nif(@($d|Where-Object action -eq 'investigate-latency').Count -ne 1 -or @($d|Where-Object action -eq 'exclude-unowned').Count -ne 1){throw 'Owned response routing did not distinguish slow, healthy and unowned events.'}\n",
      "negative": "$m=Get-Content (Join-Path $WorkRoot 'telemetry-response-map.json') -Raw|ConvertFrom-Json\n if($m.externalMessagesSent -ne 0 -or $m.liveTrafficVerified){throw 'Design review cannot claim traffic/notification verification.'}\n\nif(@(Get-Content (Join-Path $WorkRoot 'response-decisions.json') -Raw|ConvertFrom-Json|Where-Object sent).Count){throw 'Offline routing must not send notifications.'}\n",
      "validate": "$m=Get-Content (Join-Path $WorkRoot 'telemetry-response-map.json') -Raw|ConvertFrom-Json\n if($m.infrastructure.Count -ne 4 -or $m.github -notmatch 'workflow_run'){throw 'Telemetry signal map incomplete.'}\n\n$d=@(Get-Content (Join-Path $WorkRoot 'response-decisions.json') -Raw|ConvertFrom-Json)\nif(@($d|Where-Object action -eq 'investigate-latency').Count -ne 1 -or @($d|Where-Object action -eq 'exclude-unowned').Count -ne 1){throw 'Owned response routing did not distinguish slow, healthy and unowned events.'}\n\n$m=Get-Content (Join-Path $WorkRoot 'telemetry-response-map.json') -Raw|ConvertFrom-Json\n if($m.externalMessagesSent -ne 0 -or $m.liveTrafficVerified){throw 'Design review cannot claim traffic/notification verification.'}\n\nif(@(Get-Content (Join-Path $WorkRoot 'response-decisions.json') -Raw|ConvertFrom-Json|Where-Object sent).Count){throw 'Offline routing must not send notifications.'}\n",
      "evidence": "Response map and computed response-decisions.json for slow, healthy and foreign resource observations.",
      "fix": "Configure VM/Container/Storage/Network Insights only for approved owned resources; avoid collecting credentials or personal request bodies.",
      "coverage": [
        {
          "objectiveId": "D1.2.7",
          "level": "explained",
          "reference": "Interpret the operations dashboard and service objective; synthetic workload verification is distinct from live traffic."
        },
        {
          "objectiveId": "D5.1.3",
          "level": "explained",
          "reference": "Compare GitHub usage/runner insights with service telemetry; no organization insight dashboard is configured."
        },
        {
          "objectiveId": "D5.1.4",
          "level": "explained",
          "reference": "Design a delivery-event alert separately from the actual latency metric alert configured in CP4."
        }
      ]
    }
  ],
  "breakFix": {
    "trigger": "az monitor metrics alert update --subscription $SubscriptionId --resource-group $ResourceGroup --name \"slow-requests-$RunId\" --enabled false -o none\n",
    "diagnose": "az monitor metrics alert show --subscription $SubscriptionId --resource-group $ResourceGroup --name \"slow-requests-$RunId\" --query '{enabled:enabled,window:windowSize}' -o json\n",
    "repair": "az monitor metrics alert update --subscription $SubscriptionId --resource-group $ResourceGroup --name \"slow-requests-$RunId\" --enabled true -o none\n",
    "assert": "$a=az monitor metrics alert show --subscription $SubscriptionId --resource-group $ResourceGroup --name \"slow-requests-$RunId\" -o json|ConvertFrom-Json\nif(-not $a.enabled){throw 'AZ400-L24-FAULT'}\n",
    "expectedFailure": "AZ400-L24-FAULT"
  },
  "challenge": "Emit an approved synthetic trace/request through the sample and demonstrate the alert changing state without sending unsolicited Teams/email notifications.",
  "sources": [
    "https://learn.microsoft.com/en-us/azure/azure-monitor/app/app-insights-overview",
    "https://learn.microsoft.com/en-us/azure/azure-monitor/alerts/alerts-metric-overview",
    "https://learn.microsoft.com/en-us/cli/azure/monitor/metrics/alert"
  ],
  "primer": "A workspace, instrumentation, ingestion, query, and alert action are separate links. A configured rule without telemetry proves configuration only; no external notifications are sent here.\n\nTelemetry requires a chain from instrumentation to ingestion, workspace, query and response. Creating a workspace and Application Insights component proves configuration only. A silent metric alert avoids sending external messages while making its threshold, scope and enabled state inspectable.\n\nChoose response actions around an owner and measurable service objective. Pipeline events, runner consumption and application request latency belong to different signals; GitHub insights or a delivery-failure notification needs its own explicit configuration. The capstone generates tagged requests and requires observed request/error/latency data, so missing telemetry cannot pass as a healthy release.",
  "extensions": [
    "application-insights"
  ],
