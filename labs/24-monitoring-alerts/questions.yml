      "difficulty": "foundational",
      "question": "A team requires 90 days of interactive query access to one workspace table. Which configuration should it review?",
      "options": [
        {
          "key": "A",
          "text": "Only the workspace daily ingestion cap",
          "rationale": "An ingestion cap limits collection volume rather than defining the required interactive query-retention window."
        },
        {
          "key": "B",
          "text": "Only total retention, without checking analytics retention",
          "rationale": "Longer total retention does not necessarily provide the same interactive query access throughout that period."
        },
        {
          "key": "C",
          "text": "That table's supported analytics retention settings and applicable plan",
          "rationale": "The table plan and analytics retention govern how its data remains queryable."
        },
        {
          "key": "D",
          "text": "Only the Azure resource group deletion lock",
          "rationale": "A lock protects resource management operations but does not configure how long table data stays queryable."
        }
      ],
      "correctAnswers": [
        "C"
      ],
      "explanation": "The table plan and analytics retention govern how its data remains queryable. An ingestion cap limits collection volume rather than defining the required interactive query-retention window. Longer total retention does not necessarily provide the same interactive query access throughout that period. A lock protects resource management operations but does not configure how long table data stays queryable.",
      "sourceIds": [
        "S14"
      ]
    },
