      "difficulty": "applied",
      "question": "A component's workspaceResourceId points to a shared production workspace instead of the journal-owned sandbox workspace. What should validation report?",
      "options": [
        {
          "key": "A",
          "text": "A scope mismatch requiring correction",
          "rationale": "A valid resource ID is still wrong when it violates the intended ownership boundary."
        },
        {
          "key": "B",
          "text": "A pass because both workspaces support Application Insights",
          "rationale": "Service compatibility does not satisfy the required exact workspace relationship."
        },
        {
          "key": "C",
          "text": "A pass after renaming the component to include sandbox",
          "rationale": "Changing a label leaves the actual telemetry destination unchanged."
        },
        {
          "key": "D",
          "text": "A partial result only if the shared workspace is empty",
          "rationale": "The incorrect destination violates scope regardless of current data volume."
        }
      ],
      "correctAnswers": [
