      "difficulty": "advanced",
      "question": "An alert averages request duration over five minutes. A small critical endpoint degrades while high-volume fast requests keep the average low. Which redesign best addresses the blind spot?",
      "options": [
        {
          "key": "A",
          "text": "Keep the same average and attach additional email receivers",
          "rationale": "More receivers do not alter the condition that fails to detect the incident."
        },
        {
          "key": "B",
          "text": "Use supported endpoint-specific dimensions or a query that evaluates the critical operation",
          "rationale": "Separating the affected operation prevents unrelated fast traffic from hiding its degradation."
        },
        {
          "key": "C",
          "text": "Use the maximum of the same mixed population without identifying the endpoint",
          "rationale": "A maximum might reveal an outlier but does not identify or consistently assess the specific critical operation."
        },
        {
          "key": "D",
          "text": "Increase the overall average threshold to reduce noise",
          "rationale": "A higher threshold makes the already masked degradation still less detectable."
        }
      ],
      "correctAnswers": [
        "B"
      ],
      "explanation": "Separating the affected operation prevents unrelated fast traffic from hiding its degradation. More receivers do not alter the condition that fails to detect the incident. A maximum might reveal an outlier but does not identify or consistently assess the specific critical operation. A higher threshold makes the already masked degradation still less detectable.",
      "sourceIds": [
        "S1",
        "S13"
      ],
      "exhibit": {
        "language": "text",
        "code": "POST /checkout: 20 requests, average 2400 ms\nGET /health: 20000 requests, average 10 ms\nRule: all-request average > 1000 ms"
      }
    },
