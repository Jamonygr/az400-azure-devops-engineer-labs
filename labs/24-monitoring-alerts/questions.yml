      "objectiveIds": [
        "D5.1.3"
      ],
      "difficulty": "applied",
      "question": "A GitHub Projects chart is built from issues and pull requests. What can it directly describe without application instrumentation?",
      "options": [
        {
          "key": "A",
          "text": "Production HTTP response-time percentiles",
          "rationale": "Those timings require runtime request telemetry absent from project fields."
        },
        {
          "key": "B",
          "text": "Private runner CPU usage during compilation",
          "rationale": "Runner host performance is outside ordinary Projects item data."
        },
        {
          "key": "C",
          "text": "SQL dependency failure rates for the deployed API",
          "rationale": "Database failures require application or dependency instrumentation, not issue counts."
        },
        {
          "key": "D",
          "text": "The distribution of tracked project work by supported fields",
          "rationale": "Project insights chart work items and their configured project fields."
        }
      ],
      "correctAnswers": [
        "D"
      ],
      "explanation": "Project insights chart work items and their configured project fields. Those timings require runtime request telemetry absent from project fields. Runner host performance is outside ordinary Projects item data. Database failures require application or dependency instrumentation, not issue counts.",
      "sourceIds": [
        "S3"
      ]
    },
    {
      "id": "L24-Q004",
      "checkpointId": "CP4",
      "objectiveIds": [
        "D5.1.1"
      ],
      "difficulty": "applied",
      "question": "A silent training alert has no action groups. Its condition fires successfully. Which result remains unverified?",
      "options": [
        {
          "key": "A",
          "text": "Whether the resource exists in the selected scope",
          "rationale": "The scoped rule observation already establishes that resource's visible existence."
        },
        {
          "key": "B",
          "text": "Whether the alert rule can retain its name",
          "rationale": "Naming persistence is unrelated to the missing delivery integration."
        },
        {
          "key": "C",
          "text": "Delivery to an incident responder",
          "rationale": "A fired condition does not exercise an unconfigured notification destination."
        },
        {
          "key": "D",
          "text": "Whether the rule's condition can become true",
          "rationale": "The recorded fired instance provides evidence of that condition evaluation."
        }
      ],
      "correctAnswers": [
        "C"
      ],
      "explanation": "A fired condition does not exercise an unconfigured notification destination. The scoped rule observation already establishes that resource's visible existence. Naming persistence is unrelated to the missing delivery integration. The recorded fired instance provides evidence of that condition evaluation.",
      "sourceIds": [
        "S6"
      ]
    },
    {
      "id": "L24-Q005",
      "checkpointId": "CP4",
      "objectiveIds": [
        "D5.1.1"
      ],
      "difficulty": "advanced",
      "question": "During a planned deployment, operations must retain alert instances for later analysis while suppressing notifications for one hour. Which change fits the requirement?",
      "options": [
        {
          "key": "A",
          "text": "Delete the action group and recreate it afterward",
          "rationale": "Deleting a shared destination disrupts other rules and loses its configuration."
        },
        {
          "key": "B",
          "text": "Raise the alert threshold until maintenance traffic appears healthy",
          "rationale": "Changing the condition hides the incidents the team intends to retain."
        },
        {
          "key": "C",
          "text": "Apply a scoped scheduled alert processing rule that suppresses actions",
          "rationale": "Processing rules can suppress action groups without disabling the monitored rule."
        },
        {
          "key": "D",
          "text": "Disable the underlying alert rule for the maintenance window",
          "rationale": "Disabling evaluation prevents the required alert instances from being generated."
        }
      ],
      "correctAnswers": [
        "C"
      ],
      "explanation": "Processing rules can suppress action groups without disabling the monitored rule. Deleting a shared destination disrupts other rules and loses its configuration. Changing the condition hides the incidents the team intends to retain. Disabling evaluation prevents the required alert instances from being generated.",
      "sourceIds": [
        "S1",
        "S12"
      ]
    },
    {
      "id": "L24-Q006",
      "checkpointId": "CP2",
      "objectiveIds": [
        "D1.2.7"
      ],
      "difficulty": "foundational",
      "question": "The API returns HTTP 200 from liveness but its database cannot be queried. Which signal best describes customer-request viability?",
      "options": [
        {
          "key": "A",
          "text": "The App Service deployment operation's completed status",
          "rationale": "Successful deployment reports resource operation completion, not request correctness."
        },
        {
          "key": "B",
          "text": "Only the repository's latest passing build result",
          "rationale": "A build result cannot observe this deployed database connection failure."
        },
        {
          "key": "C",
          "text": "A readiness check that includes required database access",
          "rationale": "Readiness checks required dependencies before claiming the application can serve work."
        },
        {
          "key": "D",
          "text": "Only the successful process liveness response",
          "rationale": "Process survival does not establish the availability of required downstream services."
        }
      ],
      "correctAnswers": [
        "C"
      ],
      "explanation": "Readiness checks required dependencies before claiming the application can serve work. Successful deployment reports resource operation completion, not request correctness. A build result cannot observe this deployed database connection failure. Process survival does not establish the availability of required downstream services.",
      "sourceIds": [
        "S2"
      ]
    },
    {
      "id": "L24-Q007",
      "checkpointId": "CP2",
      "objectiveIds": [
        "D5.1.2"
      ],
      "difficulty": "applied",
      "question": "Storage platform metrics exist, but the team's workspace contains no storage request logs. What should be configured and verified?",
      "options": [
        {
          "key": "A",
          "text": "Supported diagnostic log categories and their destination for the storage resource",
          "rationale": "Resource logs require their applicable collection configuration and selected destination."
        },
        {
          "key": "B",
          "text": "A longer retention period on the empty workspace table",
          "rationale": "Retention keeps collected data; it cannot create a missing collection stream."
        },
        {
          "key": "C",
          "text": "A GitHub Projects chart grouped by storage issue labels",
          "rationale": "An issue chart does not collect runtime Azure storage requests."
        },
        {
          "key": "D",
          "text": "Another alert rule using the same uncollected log query",
          "rationale": "A new rule cannot evaluate events that never reach its query source."
        }
      ],
      "correctAnswers": [
        "A"
      ],
      "explanation": "Resource logs require their applicable collection configuration and selected destination. Retention keeps collected data; it cannot create a missing collection stream. An issue chart does not collect runtime Azure storage requests. A new rule cannot evaluate events that never reach its query source.",
      "sourceIds": [
        "S5"
      ]
    },
    {
      "id": "L24-Q008",
      "checkpointId": "CP5",
      "objectiveIds": [
        "D5.1.4"
      ],
      "difficulty": "applied",
      "question": "Two GitHub workflow runs share the same name; one validates the released commit and the other a later commit. What should an incident notification link to?",
      "options": [
        {
          "key": "A",
          "text": "The most recent successful run regardless of revision",
          "rationale": "A later successful run cannot explain the earlier failed candidate."
        },
        {
          "key": "B",
          "text": "The exact failed run and its source revision",
          "rationale": "Run identity and revision connect the recipient to the specific failed execution."
        },
        {
          "key": "C",
          "text": "The repository's moving default-branch page",
          "rationale": "The branch may have advanced beyond the code that actually failed."
        },
        {
          "key": "D",
          "text": "The workflow definition file without a run identifier",
          "rationale": "A definition describes automation but does not identify this execution's failure."
        }
      ],
      "correctAnswers": [
        "B"
      ],
      "explanation": "Run identity and revision connect the recipient to the specific failed execution. A later successful run cannot explain the earlier failed candidate. The branch may have advanced beyond the code that actually failed. A definition describes automation but does not identify this execution's failure.",
      "sourceIds": [
        "S8"
      ]
    },
    {
      "id": "L24-Q009",
      "checkpointId": "CP4",
      "objectiveIds": [
        "D5.1.1"
      ],
      "difficulty": "applied",
      "question": "The displayed alert is Acknowledged by a user while its condition remains Fired. What does acknowledgement establish?",
      "options": [
        {
          "key": "A",
          "text": "The underlying latency has returned below the threshold",
          "rationale": "Acknowledging an alert does not change the measured service condition."
        },
        {
          "key": "B",
          "text": "All action groups have completed their recovery runbooks successfully",
          "rationale": "Human response state does not attest to automation completion results."
        },
        {
          "key": "C",
          "text": "The monitored resource was deleted and can no longer emit data",
          "rationale": "Acknowledgement carries no such resource-lifecycle or telemetry conclusion."
        },
        {
          "key": "D",
          "text": "A responder has recorded their response state, while the signal still breaches",
          "rationale": "User response and the service-evaluated alert condition are separate states."
        }
      ],
      "correctAnswers": [
        "D"
      ],
      "explanation": "User response and the service-evaluated alert condition are separate states. Acknowledging an alert does not change the measured service condition. Human response state does not attest to automation completion results. Acknowledgement carries no such resource-lifecycle or telemetry conclusion.",
      "sourceIds": [
        "S1"
      ],
      "exhibit": {
        "language": "json",
        "code": "{\"monitorCondition\":\"Fired\",\"userResponse\":\"Acknowledged\"}"
