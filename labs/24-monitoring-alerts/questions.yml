    {
      "id": "L24-Q001",
      "checkpointId": "CP2",
      "objectiveIds": [
        "D5.1.2"
      ],
      "difficulty": "foundational",
      "question": "An Application Insights component must store telemetry in an existing course workspace. Which configuration establishes that relationship?",
      "options": [
        {
          "key": "A",
          "text": "Put the workspace customer ID into the component's resource-group field",
          "rationale": "The resource-group field selects an ARM scope, not telemetry storage."
        },
        {
          "key": "B",
          "text": "Assign the workspace as the application's managed identity",
          "rationale": "A workspace is a data resource, not an application identity."
        },
        {
          "key": "C",
          "text": "Set the component's workspaceResourceId to the intended workspace ARM ID",
          "rationale": "This property binds the component to the chosen workspace resource."
        },
        {
          "key": "D",
          "text": "Give both resources the same display name",
          "rationale": "Display-name equality does not establish a storage relationship between resources."
        }
      ],
      "correctAnswers": [
        "C"
      ],
      "explanation": "This property binds the component to the chosen workspace resource. The resource-group field selects an ARM scope, not telemetry storage. A workspace is a data resource, not an application identity. Display-name equality does not establish a storage relationship between resources.",
      "sourceIds": [
        "S4"
      ]
    },
    {
      "id": "L24-Q002",
      "checkpointId": "CP3",
      "objectiveIds": [
        "D5.1.1"
      ],
      "difficulty": "foundational",
      "question": "The metric definition in the exhibit declares MilliSeconds. Which threshold expresses a two-second response-time condition?",
      "options": [
        {
          "key": "A",
          "text": "0.002",
          "rationale": "This value would express a small fraction of one millisecond."
        },
        {
          "key": "B",
          "text": "2000000",
          "rationale": "That value represents two thousand seconds in the declared units."
        },
        {
          "key": "C",
          "text": "2000",
          "rationale": "Two seconds equals two thousand of the metric's millisecond units."
        },
        {
          "key": "D",
          "text": "2",
          "rationale": "A threshold of two here means two milliseconds, not seconds."
        }
      ],
      "correctAnswers": [
        "C"
      ],
      "explanation": "Two seconds equals two thousand of the metric's millisecond units. This value would express a small fraction of one millisecond. That value represents two thousand seconds in the declared units. A threshold of two here means two milliseconds, not seconds.",
      "sourceIds": [
        "S13"
      ],
      "exhibit": {
        "language": "json",
        "code": "{\"name\":{\"value\":\"requests/duration\"},\"unit\":\"MilliSeconds\",\"primaryAggregationType\":\"Average\"}"
      }
    },
    {
