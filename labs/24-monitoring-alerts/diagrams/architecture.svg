<svg xmlns="http://www.w3.org/2000/svg" width="760" height="650" viewBox="0 0 760 650" role="img" aria-labelledby="title desc"><title id="title">Lab 24: Workspace-based telemetry and a silent metric alert</title><desc id="desc">The Application Insights component is actually linked to the owned Log Analytics workspace. Provider metric definitions supply the latency name/unit before the alert rule is created. The rule has no external action group and sends no messages. Emitting sample telemetry and proving a firing transition are separate integration gates; configured resources alone do not establish live ingestion. Relationships: Sample OpenTelemetry source to Application Insights component: separate live export gate; Application Insights component to Owned Log Analytics workspace: workspace-based telemetry; Application Insights component to Canonical metric definitions: provider metric schema; Canonical metric definitions to Latency metric alert rule: duration threshold / window; Latency metric alert rule to No external action group: silent training response</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto-start-reverse"><path d="M0,0 L0,8 L8,4 z" fill="#0369a1"/></marker></defs>
<rect width="760" height="650" rx="16" fill="#f0f9ff"/>
<text x="22" y="30" fill="#0c4a6e" font-size="19" font-weight="bold" font-family="sans-serif">Lab 24: Workspace-based telemetry and a silent metric alert</text>
<path d="M210,160.0 H285" fill="none" stroke="#0369a1" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)" data-from="sample" data-to="insights"><title>separate live export gate</title></path>
<circle cx="247.5" cy="160.0" r="11" fill="#ffffff" stroke="#0369a1" stroke-width="1.5"/><text x="247.5" y="164.5" text-anchor="middle" fill="#075985" font-size="13" font-weight="bold" font-family="sans-serif">1</text>
<path d="M475,160.0 H550" fill="none" stroke="#0369a1" stroke-width="2" marker-end="url(#arrow)" data-from="insights" data-to="workspace"><title>workspace-based telemetry</title></path>
<circle cx="512.5" cy="160.0" r="11" fill="#ffffff" stroke="#0369a1" stroke-width="1.5"/><text x="512.5" y="164.5" text-anchor="middle" fill="#075985" font-size="13" font-weight="bold" font-family="sans-serif">2</text>
<path d="M380.0,220 V289.0 H645.0 V330" fill="none" stroke="#0369a1" stroke-width="2" marker-end="url(#arrow)" data-from="insights" data-to="metrics"><title>provider metric schema</title></path>
<circle cx="512.5" cy="289.0" r="11" fill="#ffffff" stroke="#0369a1" stroke-width="1.5"/><text x="512.5" y="293.5" text-anchor="middle" fill="#075985" font-size="13" font-weight="bold" font-family="sans-serif">3</text>
<path d="M550,390.0 H475" fill="none" stroke="#0369a1" stroke-width="2" marker-end="url(#arrow)" data-from="metrics" data-to="alert"><title>duration threshold / window</title></path>
<circle cx="512.5" cy="390.0" r="11" fill="#ffffff" stroke="#0369a1" stroke-width="1.5"/><text x="512.5" y="394.5" text-anchor="middle" fill="#075985" font-size="13" font-weight="bold" font-family="sans-serif">4</text>
<path d="M285,390.0 H210" fill="none" stroke="#0369a1" stroke-width="2" marker-end="url(#arrow)" data-from="alert" data-to="actions"><title>silent training response</title></path>
<circle cx="247.5" cy="390.0" r="11" fill="#ffffff" stroke="#0369a1" stroke-width="1.5"/><text x="247.5" y="394.5" text-anchor="middle" fill="#075985" font-size="13" font-weight="bold" font-family="sans-serif">5</text>
<g data-node="sample"><rect x="20" y="100" width="190" height="120" rx="11" fill="#ffffff" stroke="#0284c7" stroke-width="2"/><text x="33" y="123" fill="#0284c7" font-family="sans-serif" font-size="12" font-weight="bold">CODE</text>
<text x="33" y="148" fill="#0f172a" font-family="sans-serif" font-size="18">Sample</text>
