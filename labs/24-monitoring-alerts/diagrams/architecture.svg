<text x="22" y="480" fill="#0c4a6e" font-family="sans-serif" font-weight="bold" font-size="16">Relationships</text>
<text x="22" y="507" fill="#0f172a" font-family="sans-serif" font-size="14.5">1. separate live export gate</text>
<text x="392" y="507" fill="#0f172a" font-family="sans-serif" font-size="14.5">2. workspace-based telemetry</text>
<text x="22" y="545" fill="#0f172a" font-family="sans-serif" font-size="14.5">3. provider metric schema</text>
<text x="392" y="545" fill="#0f172a" font-family="sans-serif" font-size="14.5">4. duration threshold / window</text>
<text x="22" y="583" fill="#0f172a" font-family="sans-serif" font-size="14.5">5. silent training response</text>
<text x="22" y="636" fill="#334155" font-family="sans-serif" font-size="12">Solid: core relationship · Dashed: separately gated integration · See walkthrough for verification limits.</text>
</svg>
