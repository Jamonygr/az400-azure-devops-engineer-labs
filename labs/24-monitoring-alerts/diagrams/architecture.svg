<g data-node="workspace"><rect x="550" y="100" width="190" height="120" rx="11" fill="#ecfdf5" stroke="#059669" stroke-width="2"/><text x="563" y="123" fill="#059669" font-family="sans-serif" font-size="12" font-weight="bold">DATA</text>
<text x="563" y="148" fill="#0f172a" font-family="sans-serif" font-size="18">Owned Log Analytics</text>
