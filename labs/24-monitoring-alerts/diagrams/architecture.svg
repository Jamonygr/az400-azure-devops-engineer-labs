</g>
<g data-node="actions"><rect x="20" y="330" width="190" height="120" rx="11" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/><text x="33" y="353" fill="#ea580c" font-family="sans-serif" font-size="12" font-weight="bold">EVIDENCE</text>
<text x="33" y="378" fill="#0f172a" font-family="sans-serif" font-size="18">No external action</text>
<text x="33" y="400" fill="#0f172a" font-family="sans-serif" font-size="18">group</text>
