<svg xmlns="http://www.w3.org/2000/svg" width="760" height="650" viewBox="0 0 760 650" role="img" aria-labelledby="title desc"><title id="title">Lab 16: Feature-management store, identity, and kill switch</title><desc id="desc">The sample FeatureManagement library controls application behavior, and local tests prove both enabled and disabled paths. The owned App Configuration store contains the same TodoWrites key, changed through Entra authentication with a data role scoped to that store. Wiring and observing live application refresh is an explicit additional integration; the core proves actual store writes/reads and the kill switch. Relationships: Sample ASP.NET API to FeatureManagement library: application feature decision; FeatureManagement library to Azure App Configuration: optional live refresh path; Entra learner + scoped data RBAC to Azure App Configuration: identity-based data access; Azure App Configuration to TodoWrites feature flag: named flag state; Entra learner + scoped data RBAC to TodoWrites feature flag: CLI enable / kill switch; Local feature / resilience tests to FeatureManagement library: enabled / disabled behavior</desc>
