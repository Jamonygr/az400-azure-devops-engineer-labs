    {
      "id": "L16-Q001",
      "checkpointId": "CP1",
      "objectiveIds": [
        "D3.4.6"
      ],
      "difficulty": "foundational",
      "question": "The sample contains TodoWrites flag configuration but no deployment occurs when its value changes. What concept does this illustrate?",
      "options": [
        {
          "key": "A",
          "text": "A flag grants Azure subscription permissions",
          "rationale": "Application behavior configuration does not authorize identity access to Azure resources."
        },
        {
          "key": "B",
          "text": "Deployment and feature exposure are separate controls",
          "rationale": "Existing executable code can change allowed behavior without requiring a new binary deployment."
        },
        {
          "key": "C",
          "text": "A feature flag is a database backup",
          "rationale": "Exposure control does not store or restore durable database data."
        },
        {
          "key": "D",
          "text": "Every flag update recompiles the application automatically",
          "rationale": "Configuration changes do not inherently invoke the source compiler or build pipeline."
        }
      ],
      "correctAnswers": [
        "B"
      ],
      "explanation": "Existing executable code can change allowed behavior without requiring a new binary deployment. Configuration changes do not inherently invoke the source compiler or build pipeline. Exposure control does not store or restore durable database data. Application behavior configuration does not authorize identity access to Azure resources.",
      "sourceIds": [
        "S1"
      ]
    },
    {
