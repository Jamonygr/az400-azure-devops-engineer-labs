  "questions": [
    {
      "id": "L04-Q001",
      "checkpointId": "CP1",
      "objectiveIds": [
        "D2.1.1"
      ],
      "difficulty": "foundational",
      "question": "A feature branch has diverged from main for a month. The team wants earlier integration feedback without abandoning review. Which workflow is appropriate?",
      "options": [
        {
          "key": "A",
          "text": "Create a permanent branch per developer and merge only during release week",
          "rationale": "Permanent isolation postpones the integration feedback the team needs."
        },
        {
          "key": "B",
          "text": "Review the entire feature only after copying it directly into production",
          "rationale": "That moves review after the risky delivery instead of controlling source integration."
        },
        {
          "key": "C",
          "text": "Integrate smaller reviewed increments through short-lived branches",
          "rationale": "Smaller divergence provides earlier shared feedback while preserving review."
        },
        {
          "key": "D",
          "text": "Keep the same branch open and increase its local test frequency only",
          "rationale": "Isolated tests do not exercise integration with colleagues' accepted changes."
        }
      ],
      "correctAnswers": [
        "C"
      ],
      "explanation": "Permanent isolation postpones the integration feedback the team needs. That moves review after the risky delivery instead of controlling source integration. Smaller divergence provides earlier shared feedback while preserving review. Isolated tests do not exercise integration with colleagues' accepted changes.",
      "sourceIds": [
        "S2"
      ]
    },
    {
      "id": "L04-Q002",
      "checkpointId": "CP1",
      "objectiveIds": [
        "D2.1.1"
      ],
      "difficulty": "foundational",
      "question": "In a trunk-oriented workflow, what distinguishes short-lived feature branches from long-running release branches?",
      "options": [
        {
          "key": "A",
          "text": "They automatically publish every unfinished feature to all customers",
          "rationale": "Source integration and customer exposure can be controlled separately."
        },
        {
          "key": "B",
          "text": "Their work is integrated frequently rather than maintained as independent product versions",
          "rationale": "The purpose is small-batch development integration, not prolonged release-line maintenance."
        },
        {
          "key": "C",
          "text": "They must never run automated tests before merging",
          "rationale": "Short lifetime does not remove validation requirements."
        },
        {
          "key": "D",
          "text": "They necessarily bypass pull-request review",
          "rationale": "A short-lived branch can still use enforced independent review."
        }
      ],
      "correctAnswers": [
        "B"
      ],
      "explanation": "Source integration and customer exposure can be controlled separately. The purpose is small-batch development integration, not prolonged release-line maintenance. Short lifetime does not remove validation requirements. A short-lived branch can still use enforced independent review.",
      "sourceIds": [
        "S2"
      ]
    },
