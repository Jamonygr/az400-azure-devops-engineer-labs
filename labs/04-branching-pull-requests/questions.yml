    {
      "id": "L04-Q003",
      "checkpointId": "CP4",
      "objectiveIds": [
        "D2.1.2"
      ],
      "difficulty": "foundational",
      "question": "A pull request is approved, then new code is pushed and merged under the old approval. Which GitHub protection addresses this gap?",
      "options": [
        {
          "key": "A",
          "text": "Increase the initial approval count but retain those approvals after every later push",
          "rationale": "More stale approvals still do not cover newly changed source content."
        },
        {
          "key": "B",
          "text": "Require an approval only when the branch is first created",
          "rationale": "That still allows later unreviewed changes to inherit approval."
        },
        {
          "key": "C",
          "text": "Require the author alone to acknowledge each later push",
          "rationale": "An author acknowledgement does not provide renewed eligible independent review."
        },
        {
          "key": "D",
          "text": "Dismiss stale approvals or require approval of the most recent reviewable push",
          "rationale": "The review evidence must cover the content actually being merged."
        }
      ],
      "correctAnswers": [
        "D"
      ],
      "explanation": "More stale approvals still do not cover newly changed source content. That still allows later unreviewed changes to inherit approval. An author acknowledgement does not provide renewed eligible independent review. The review evidence must cover the content actually being merged.",
      "sourceIds": [
        "S2"
      ],
      "exhibit": {
        "language": "text",
        "code": "Commit A: reviewed and approved\nCommit B: new permission change after approval\nRequired approvals displayed: 1\nNo new review submitted"
      }
    },
