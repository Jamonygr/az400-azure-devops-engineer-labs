        {
          "key": "C",
          "text": "A scheduled report counting commits after they reach main",
          "rationale": "After-the-fact reporting does not block the prohibited write."
        },
        {
          "key": "D",
          "text": "Enforced branch policies and permissions consistent with the review requirement",
          "rationale": "A written process alone does not restrict the accepted write paths."
        }
      ],
      "correctAnswers": [
        "D"
      ],
      "explanation": "A recommendation still does not enforce the stated reviewed-only write requirement. The target accepting production changes remains outside the intended protection. After-the-fact reporting does not block the prohibited write. A written process alone does not restrict the accepted write paths.",
      "sourceIds": [
