<svg xmlns="http://www.w3.org/2000/svg" width="760" height="650" viewBox="0 0 760 650" role="img" aria-labelledby="title desc"><title id="title">Lab 04: Protected-branch pull request architecture</title><desc id="desc">A local feature branch is pushed only to the run-owned GitHub repository. Main is protected against force pushes and deletion and requires independent pull-request review. CI status contexts can be added after their real workflow names exist; an author cannot supply their own independent approval or infer checks from a pushed commit. Relationships: Local Git working copy to GitHub sandbox repository: push owned source; GitHub sandbox repository to Protected main branch: branch protection; Feature pull request to Protected main branch: policy-controlled merge; Independent reviewer to Feature pull request: required approval; CI status contexts to Feature pull request: required status signals; Local Git working copy to Feature pull request: feature revision</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto-start-reverse"><path d="M0,0 L0,8 L8,4 z" fill="#0369a1"/></marker></defs>
<rect width="760" height="650" rx="16" fill="#f0f9ff"/>
<text x="22" y="30" fill="#0c4a6e" font-size="19" font-weight="bold" font-family="sans-serif">Lab 04: Protected-branch pull request architecture</text>
<path d="M210,160.0 H285" fill="none" stroke="#0369a1" stroke-width="2" marker-end="url(#arrow)" data-from="local" data-to="repo"><title>push owned source</title></path>
<circle cx="247.5" cy="160.0" r="11" fill="#ffffff" stroke="#0369a1" stroke-width="1.5"/><text x="247.5" y="164.5" text-anchor="middle" fill="#075985" font-size="13" font-weight="bold" font-family="sans-serif">1</text>
<path d="M475,160.0 H550" fill="none" stroke="#0369a1" stroke-width="2" marker-end="url(#arrow)" data-from="repo" data-to="main"><title>branch protection</title></path>
<circle cx="512.5" cy="160.0" r="11" fill="#ffffff" stroke="#0369a1" stroke-width="1.5"/><text x="512.5" y="164.5" text-anchor="middle" fill="#075985" font-size="13" font-weight="bold" font-family="sans-serif">2</text>
<path d="M645.0,330 V220" fill="none" stroke="#0369a1" stroke-width="2" marker-end="url(#arrow)" data-from="pr" data-to="main"><title>policy-controlled merge</title></path>
<circle cx="645.0" cy="275.0" r="11" fill="#ffffff" stroke="#0369a1" stroke-width="1.5"/><text x="645.0" y="279.5" text-anchor="middle" fill="#075985" font-size="13" font-weight="bold" font-family="sans-serif">3</text>
<path d="M475,390.0 H550" fill="none" stroke="#0369a1" stroke-width="2" marker-end="url(#arrow)" data-from="reviewer" data-to="pr"><title>required approval</title></path>
<circle cx="512.5" cy="390.0" r="11" fill="#ffffff" stroke="#0369a1" stroke-width="1.5"/><text x="512.5" y="394.5" text-anchor="middle" fill="#075985" font-size="13" font-weight="bold" font-family="sans-serif">4</text>
<path d="M210,390.0 H550" fill="none" stroke="#0369a1" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)" data-from="checks" data-to="pr"><title>required status signals</title></path>
<circle cx="380.0" cy="390.0" r="11" fill="#ffffff" stroke="#0369a1" stroke-width="1.5"/><text x="380.0" y="394.5" text-anchor="middle" fill="#075985" font-size="13" font-weight="bold" font-family="sans-serif">5</text>
<path d="M115.0,220 V289.0 H645.0 V330" fill="none" stroke="#0369a1" stroke-width="2" marker-end="url(#arrow)" data-from="local" data-to="pr"><title>feature revision</title></path>
<circle cx="380.0" cy="289.0" r="11" fill="#ffffff" stroke="#0369a1" stroke-width="1.5"/><text x="380.0" y="293.5" text-anchor="middle" fill="#075985" font-size="13" font-weight="bold" font-family="sans-serif">6</text>
<g data-node="local"><rect x="20" y="100" width="190" height="120" rx="11" fill="#ffffff" stroke="#0284c7" stroke-width="2"/><text x="33" y="123" fill="#0284c7" font-family="sans-serif" font-size="12" font-weight="bold">CODE</text>
<text x="33" y="148" fill="#0f172a" font-family="sans-serif" font-size="18">Local Git working</text>
<text x="33" y="170" fill="#0f172a" font-family="sans-serif" font-size="18">copy</text>
</g>
<g data-node="repo"><rect x="285" y="100" width="190" height="120" rx="11" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/><text x="298" y="123" fill="#0284c7" font-family="sans-serif" font-size="12" font-weight="bold">PLATFORM</text>
<text x="298" y="148" fill="#0f172a" font-family="sans-serif" font-size="18">GitHub sandbox</text>
<text x="298" y="170" fill="#0f172a" font-family="sans-serif" font-size="18">repository</text>
</g>
<g data-node="main"><rect x="550" y="100" width="190" height="120" rx="11" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/><text x="563" y="123" fill="#0284c7" font-family="sans-serif" font-size="12" font-weight="bold">PLATFORM</text>
<text x="563" y="148" fill="#0f172a" font-family="sans-serif" font-size="18">Protected main</text>
<text x="563" y="170" fill="#0f172a" font-family="sans-serif" font-size="18">branch</text>
</g>
<g data-node="pr"><rect x="550" y="330" width="190" height="120" rx="11" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/><text x="563" y="353" fill="#0284c7" font-family="sans-serif" font-size="12" font-weight="bold">PLATFORM</text>
<text x="563" y="378" fill="#0f172a" font-family="sans-serif" font-size="18">Feature pull</text>
<text x="563" y="400" fill="#0f172a" font-family="sans-serif" font-size="18">request</text>
</g>
<g data-node="reviewer"><rect x="285" y="330" width="190" height="120" rx="11" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/><text x="298" y="353" fill="#7c3aed" font-family="sans-serif" font-size="12" font-weight="bold">IDENTITY</text>
<text x="298" y="378" fill="#0f172a" font-family="sans-serif" font-size="18">Independent</text>
<text x="298" y="400" fill="#0f172a" font-family="sans-serif" font-size="18">reviewer</text>
</g>
<g data-node="checks"><rect x="20" y="330" width="190" height="120" rx="11" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/><text x="33" y="353" fill="#ea580c" font-family="sans-serif" font-size="12" font-weight="bold">EVIDENCE</text>
<text x="33" y="378" fill="#0f172a" font-family="sans-serif" font-size="18">CI status contexts</text>
</g>
<text x="22" y="480" fill="#0c4a6e" font-family="sans-serif" font-weight="bold" font-size="16">Relationships</text>
<text x="22" y="507" fill="#0f172a" font-family="sans-serif" font-size="14.5">1. push owned source</text>
<text x="392" y="507" fill="#0f172a" font-family="sans-serif" font-size="14.5">2. branch protection</text>
<text x="22" y="545" fill="#0f172a" font-family="sans-serif" font-size="14.5">3. policy-controlled merge</text>
<text x="392" y="545" fill="#0f172a" font-family="sans-serif" font-size="14.5">4. required approval</text>
<text x="22" y="583" fill="#0f172a" font-family="sans-serif" font-size="14.5">5. required status signals</text>
<text x="392" y="583" fill="#0f172a" font-family="sans-serif" font-size="14.5">6. feature revision</text>
<text x="22" y="636" fill="#334155" font-family="sans-serif" font-size="12">Solid: core relationship · Dashed: separately gated integration · See walkthrough for verification limits.</text>
</svg>
