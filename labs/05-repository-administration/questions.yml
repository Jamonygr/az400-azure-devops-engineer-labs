          "text": "The rule applies only when the repository has no tags",
          "rationale": "Release tags do not universally prevent future LFS tracking."
        },
        {
          "key": "B",
          "text": "Every LFS pointer stores another complete copy of the old binary",
          "rationale": "The pointer itself is small metadata, not the full large asset."
        },
        {
          "key": "C",
          "text": "Existing historical blobs are not automatically rewritten by adding a rule",
          "rationale": "Future tracking and historical migration are separate changes."
        },
        {
          "key": "D",
          "text": "LFS requires deleting all branches before any file can be tracked",
          "rationale": "Branch deletion is not a normal prerequisite for adding tracking rules."
        }
      ],
      "correctAnswers": [
        "C"
      ],
      "explanation": "Future tracking and historical migration are separate changes. Branch deletion is not a normal prerequisite for adding tracking rules. Release tags do not universally prevent future LFS tracking. The pointer itself is small metadata, not the full large asset.",
      "sourceIds": [
        "S1"
      ]
    },
