    {
      "id": "L05-Q001",
      "checkpointId": "CP2",
      "objectiveIds": [
        "D2.2.1"
      ],
      "difficulty": "foundational",
      "question": "A repository repeatedly commits large binary artwork. Ordinary clones download large historical blobs. Which mechanism is designed to separate those assets from normal Git objects?",
      "options": [
        {
          "key": "A",
          "text": "Git Large File Storage with the relevant tracking patterns",
          "rationale": "LFS keeps pointer metadata in Git while storing large file content separately."
        },
        {
          "key": "B",
          "text": "Git tags applied to each binary revision",
          "rationale": "Tags identify revisions but do not change how binary blobs are stored."
        },
        {
          "key": "C",
          "text": "A CODEOWNERS rule for the artwork directory",
          "rationale": "Ownership routes review but does not move binary content out of Git objects."
        },
        {
          "key": "D",
          "text": "A longer release-artifact retention period",
          "rationale": "Pipeline retention does not change the source repository's historical object storage."
        }
      ],
      "correctAnswers": [
        "A"
      ],
      "explanation": "LFS keeps pointer metadata in Git while storing large file content separately. Tags identify revisions but do not change how binary blobs are stored. Ownership routes review but does not move binary content out of Git objects. Pipeline retention does not change the source repository's historical object storage.",
      "sourceIds": [
        "S1"
      ]
    },
    {
      "id": "L05-Q002",
      "checkpointId": "CP2",
      "objectiveIds": [
        "D2.2.1"
      ],
      "difficulty": "foundational",
      "question": "A new clone contains a small text pointer where a usable image is expected. The machine has no LFS client. What is the targeted repair?",
      "options": [
        {
          "key": "A",
          "text": "Remove the pointer's object ID so the editor treats it as an image",
          "rationale": "Deleting metadata destroys the retrieval reference rather than fetching content."
        },
        {
          "key": "B",
          "text": "Create a lightweight tag for the pointer commit",
          "rationale": "A tag does not retrieve the LFS object into the working tree."
        },
        {
          "key": "C",
          "text": "Install the supported LFS client and retrieve the asset objects",
          "rationale": "The checkout needs the tooling that resolves pointers into actual content."
        },
        {
          "key": "D",
          "text": "Rename the pointer file to a different image extension",
          "rationale": "Changing its name cannot turn metadata into the missing binary bytes."
        }
      ],
      "correctAnswers": [
        "C"
      ],
      "explanation": "Deleting metadata destroys the retrieval reference rather than fetching content. A tag does not retrieve the LFS object into the working tree. The checkout needs the tooling that resolves pointers into actual content. Changing its name cannot turn metadata into the missing binary bytes.",
      "sourceIds": [
        "S1"
      ]
    },
