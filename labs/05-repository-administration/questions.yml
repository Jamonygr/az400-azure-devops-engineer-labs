  "questions": [
    {
      "id": "L05-Q001",
      "checkpointId": "CP2",
      "objectiveIds": [
        "D2.2.1"
      ],
      "difficulty": "foundational",
      "question": "A repository repeatedly commits large binary artwork. Ordinary clones download large historical blobs. Which mechanism is designed to separate those assets from normal Git objects?",
      "options": [
        {
          "key": "A",
          "text": "Git Large File Storage with the relevant tracking patterns",
          "rationale": "LFS keeps pointer metadata in Git while storing large file content separately."
        },
        {
          "key": "B",
          "text": "Git tags applied to each binary revision",
          "rationale": "Tags identify revisions but do not change how binary blobs are stored."
        },
        {
          "key": "C",
          "text": "A CODEOWNERS rule for the artwork directory",
          "rationale": "Ownership routes review but does not move binary content out of Git objects."
        },
        {
          "key": "D",
          "text": "A longer release-artifact retention period",
          "rationale": "Pipeline retention does not change the source repository's historical object storage."
        }
      ],
      "correctAnswers": [
        "A"
      ],
      "explanation": "LFS keeps pointer metadata in Git while storing large file content separately. Tags identify revisions but do not change how binary blobs are stored. Ownership routes review but does not move binary content out of Git objects. Pipeline retention does not change the source repository's historical object storage.",
      "sourceIds": [
        "S1"
      ]
    },
    {
      "id": "L05-Q002",
      "checkpointId": "CP2",
      "objectiveIds": [
        "D2.2.1"
      ],
      "difficulty": "foundational",
      "question": "What is normally stored in Git for an asset correctly tracked by Git LFS?",
      "options": [
        {
          "key": "A",
          "text": "Only the asset's filename with no content identity",
          "rationale": "A proper pointer includes object identity and size metadata."
        },
        {
          "key": "B",
          "text": "A generated executable that downloads arbitrary code during checkout",
          "rationale": "The pointer is metadata rather than an executable application bootstrap."
        },
        {
          "key": "C",
          "text": "A pointer describing the associated LFS object",
          "rationale": "The actual large file content is retrieved through the LFS storage mechanism."
        },
        {
          "key": "D",
          "text": "Every previous binary version concatenated into the current file",
          "rationale": "LFS does not use the working-tree pointer as an archive of all versions."
        }
      ],
      "correctAnswers": [
        "C"
      ],
      "explanation": "The actual large file content is retrieved through the LFS storage mechanism. LFS does not use the working-tree pointer as an archive of all versions. A proper pointer includes object identity and size metadata. The pointer is metadata rather than an executable application bootstrap.",
      "sourceIds": [
        "S1"
      ]
    },
    {
