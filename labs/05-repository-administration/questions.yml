      "difficulty": "foundational",
      "question": "A new clone contains a small text pointer where a usable image is expected. The machine has no LFS client. What is the targeted repair?",
      "options": [
        {
          "key": "A",
          "text": "Remove the pointer's object ID so the editor treats it as an image",
          "rationale": "Deleting metadata destroys the retrieval reference rather than fetching content."
        },
        {
          "key": "B",
          "text": "Create a lightweight tag for the pointer commit",
          "rationale": "A tag does not retrieve the LFS object into the working tree."
        },
        {
          "key": "C",
          "text": "Install the supported LFS client and retrieve the asset objects",
          "rationale": "The checkout needs the tooling that resolves pointers into actual content."
        },
        {
          "key": "D",
          "text": "Rename the pointer file to a different image extension",
          "rationale": "Changing its name cannot turn metadata into the missing binary bytes."
        }
      ],
      "correctAnswers": [
        "C"
      ],
      "explanation": "The checkout needs the tooling that resolves pointers into actual content. Changing its name cannot turn metadata into the missing binary bytes. Deleting metadata destroys the retrieval reference rather than fetching content. A tag does not retrieve the LFS object into the working tree.",
      "sourceIds": [
        "S1"
      ]
