<text x="392" y="545" fill="#0f172a" font-family="sans-serif" font-size="14.5">4. effective role inventory</text>
<text x="22" y="583" fill="#0f172a" font-family="sans-serif" font-size="14.5">5. release identity</text>
<text x="392" y="583" fill="#0f172a" font-family="sans-serif" font-size="14.5">6. approved sharing contract</text>
<text x="22" y="636" fill="#334155" font-family="sans-serif" font-size="12">Solid: core relationship · Dashed: separately gated integration · See walkthrough for verification limits.</text>
