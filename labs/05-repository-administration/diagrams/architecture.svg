<path d="M475,160.0 H550" fill="none" stroke="#0369a1" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)" data-from="git" data-to="lfs"><title>pointer / object split</title></path>
<circle cx="512.5" cy="160.0" r="11" fill="#ffffff" stroke="#0369a1" stroke-width="1.5"/><text x="512.5" y="164.5" text-anchor="middle" fill="#075985" font-size="13" font-weight="bold" font-family="sans-serif">2</text>
<path d="M380.0,220 V289.0 H645.0 V330" fill="none" stroke="#0369a1" stroke-width="2" marker-end="url(#arrow)" data-from="git" data-to="tags"><title>exact commit identity</title></path>
<circle cx="512.5" cy="289.0" r="11" fill="#ffffff" stroke="#0369a1" stroke-width="1.5"/><text x="512.5" y="293.5" text-anchor="middle" fill="#075985" font-size="13" font-weight="bold" font-family="sans-serif">3</text>
<path d="M115.0,220 V261.0 H380.0 V330" fill="none" stroke="#0369a1" stroke-width="2" marker-end="url(#arrow)" data-from="hosts" data-to="policy"><title>effective role inventory</title></path>
<circle cx="247.5" cy="261.0" r="11" fill="#ffffff" stroke="#0369a1" stroke-width="1.5"/><text x="247.5" y="265.5" text-anchor="middle" fill="#075985" font-size="13" font-weight="bold" font-family="sans-serif">4</text>
<path d="M550,390.0 H475" fill="none" stroke="#0369a1" stroke-width="2" marker-end="url(#arrow)" data-from="tags" data-to="policy"><title>release identity</title></path>
<circle cx="512.5" cy="390.0" r="11" fill="#ffffff" stroke="#0369a1" stroke-width="1.5"/><text x="512.5" y="394.5" text-anchor="middle" fill="#075985" font-size="13" font-weight="bold" font-family="sans-serif">5</text>
<path d="M285,390.0 H210" fill="none" stroke="#0369a1" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)" data-from="policy" data-to="consumer"><title>approved sharing contract</title></path>
<circle cx="247.5" cy="390.0" r="11" fill="#ffffff" stroke="#0369a1" stroke-width="1.5"/><text x="247.5" y="394.5" text-anchor="middle" fill="#075985" font-size="13" font-weight="bold" font-family="sans-serif">6</text>
