<svg xmlns="http://www.w3.org/2000/svg" width="760" height="650" viewBox="0 0 760 650" role="img" aria-labelledby="title desc"><title id="title">Lab 05: Repository content, large files, and immutable references</title><desc id="desc">Hosted repository APIs supply visibility and effective-access metadata; the local Git store holds source and annotated tags. The attributes file defines the LFS pointer/content split, while using a real LFS content service remains a separate integration. The sharing decision recommends immutable packages for consumers rather than untracked source copies. Relationships: GitHub / Azure Repos to Local Git object store: clone and access metadata; Local Git object store to LFS content service: pointer / object split; Local Git object store to Annotated version tag: exact commit identity; GitHub / Azure Repos to Access / sharing record: effective role inventory; Annotated version tag to Access / sharing record: release identity; Access / sharing record to Versioned package consumer: approved sharing contract</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto-start-reverse"><path d="M0,0 L0,8 L8,4 z" fill="#0369a1"/></marker></defs>
<rect width="760" height="650" rx="16" fill="#f0f9ff"/>
<text x="22" y="30" fill="#0c4a6e" font-size="19" font-weight="bold" font-family="sans-serif">Lab 05: Repository content, large files, and immutable references</text>
<path d="M210,160.0 H285" fill="none" stroke="#0369a1" stroke-width="2" marker-end="url(#arrow)" data-from="hosts" data-to="git"><title>clone and access metadata</title></path>
