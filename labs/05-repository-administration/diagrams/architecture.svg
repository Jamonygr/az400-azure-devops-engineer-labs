<g data-node="consumer"><rect x="20" y="330" width="190" height="120" rx="11" fill="#ffffff" stroke="#0284c7" stroke-width="2"/><text x="33" y="353" fill="#0284c7" font-family="sans-serif" font-size="12" font-weight="bold">CODE</text>
