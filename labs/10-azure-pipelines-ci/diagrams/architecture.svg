<svg xmlns="http://www.w3.org/2000/svg" width="760" height="650" viewBox="0 0 760 650" role="img" aria-labelledby="title desc"><title id="title">Lab 10: Azure Pipelines continuous integration</title><desc id="desc">An exact Azure Repos repository and YAML path define the sandbox pipeline. An available hosted or explicitly approved agent executes the .NET build/test workload and publishes results/artifacts. Build sourceVersion must match the reviewed revision; pipeline registration, queued capacity, and successful completion are separate states. Relationships: Azure Repos main revision to YAML pipeline definition: exact repository + YAML; YAML pipeline definition to Hosted / approved agent: queue with bounded capacity; Hosted / approved agent to .NET build + xUnit tests: locked restore / test; .NET build + xUnit tests to Versioned pipeline artifact: publish output; .NET build + xUnit tests to Build SHA / test results: TRX and build result; Azure Repos main revision to Build SHA / test results: sourceVersion provenance</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto-start-reverse"><path d="M0,0 L0,8 L8,4 z" fill="#0369a1"/></marker></defs>
<rect width="760" height="650" rx="16" fill="#f0f9ff"/>
<text x="22" y="30" fill="#0c4a6e" font-size="19" font-weight="bold" font-family="sans-serif">Lab 10: Azure Pipelines continuous integration</text>
<path d="M210,160.0 H285" fill="none" stroke="#0369a1" stroke-width="2" marker-end="url(#arrow)" data-from="repos" data-to="definition"><title>exact repository + YAML</title></path>
<circle cx="247.5" cy="160.0" r="11" fill="#ffffff" stroke="#0369a1" stroke-width="1.5"/><text x="247.5" y="164.5" text-anchor="middle" fill="#075985" font-size="13" font-weight="bold" font-family="sans-serif">1</text>
<path d="M475,160.0 H550" fill="none" stroke="#0369a1" stroke-width="2" marker-end="url(#arrow)" data-from="definition" data-to="agent"><title>queue with bounded capacity</title></path>
<circle cx="512.5" cy="160.0" r="11" fill="#ffffff" stroke="#0369a1" stroke-width="1.5"/><text x="512.5" y="164.5" text-anchor="middle" fill="#075985" font-size="13" font-weight="bold" font-family="sans-serif">2</text>
<path d="M645.0,220 V330" fill="none" stroke="#0369a1" stroke-width="2" marker-end="url(#arrow)" data-from="agent" data-to="tests"><title>locked restore / test</title></path>
<circle cx="645.0" cy="275.0" r="11" fill="#ffffff" stroke="#0369a1" stroke-width="1.5"/><text x="645.0" y="279.5" text-anchor="middle" fill="#075985" font-size="13" font-weight="bold" font-family="sans-serif">3</text>
<path d="M550,390.0 H475" fill="none" stroke="#0369a1" stroke-width="2" marker-end="url(#arrow)" data-from="tests" data-to="artifact"><title>publish output</title></path>
<circle cx="512.5" cy="390.0" r="11" fill="#ffffff" stroke="#0369a1" stroke-width="1.5"/><text x="512.5" y="394.5" text-anchor="middle" fill="#075985" font-size="13" font-weight="bold" font-family="sans-serif">4</text>
<path d="M550,390.0 H210" fill="none" stroke="#0369a1" stroke-width="2" marker-end="url(#arrow)" data-from="tests" data-to="evidence"><title>TRX and build result</title></path>
<circle cx="380.0" cy="390.0" r="11" fill="#ffffff" stroke="#0369a1" stroke-width="1.5"/><text x="380.0" y="394.5" text-anchor="middle" fill="#075985" font-size="13" font-weight="bold" font-family="sans-serif">5</text>
<path d="M115.0,220 V330" fill="none" stroke="#0369a1" stroke-width="2" marker-end="url(#arrow)" data-from="repos" data-to="evidence"><title>sourceVersion provenance</title></path>
<circle cx="115.0" cy="275.0" r="11" fill="#ffffff" stroke="#0369a1" stroke-width="1.5"/><text x="115.0" y="279.5" text-anchor="middle" fill="#075985" font-size="13" font-weight="bold" font-family="sans-serif">6</text>
