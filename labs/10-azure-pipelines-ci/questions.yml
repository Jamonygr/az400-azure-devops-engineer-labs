      "difficulty": "foundational",
      "question": "The lab uses Azure Repos, while a colleague proposes importing a GitHub repository. Which additional boundary must be prepared before that integration works?",
      "options": [
        {
          "key": "A",
          "text": "An authorized GitHub repository connection and pipeline access",
          "rationale": "Another provider requires explicitly authorized repository access beyond the Azure Repos fixture."
        },
        {
          "key": "B",
          "text": "Only an annotated Git tag in Azure Repos",
          "rationale": "A source tag does not establish access to a GitHub repository."
        },
        {
          "key": "C",
          "text": "Only a new Azure service connection for application deployment",
          "rationale": "Application deployment credentials do not authorize a separate external GitHub source repository connection."
        },
        {
          "key": "D",
          "text": "Only a different source YAML path in the same inaccessible provider",
          "rationale": "Changing a configured path cannot establish the missing authorized external source repository access."
        }
      ],
      "correctAnswers": [
        "A"
      ],
      "explanation": "A source tag does not establish access to a GitHub repository. Application deployment credentials do not authorize a separate external GitHub source repository connection. Another provider requires explicitly authorized repository access beyond the Azure Repos fixture. Changing a configured path cannot establish the missing authorized external source repository access.",
      "sourceIds": [
