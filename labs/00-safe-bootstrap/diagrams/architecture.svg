<svg xmlns="http://www.w3.org/2000/svg" width="760" height="650" viewBox="0 0 760 650" role="img" aria-labelledby="title desc"><title id="title">Lab 00: Tools, identities, and the disposable run boundary</title><desc id="desc">PowerShell hosts the command-line tools. Read-only account queries identify GitHub, Azure DevOps, and Entra contexts; provisioning is a separate explicit step that records disposable scope IDs in the local ownership journal. The .NET test host runs locally and contributes test evidence, without granting cloud execution approval. Relationships: PowerShell 7 host to Git, gh, az, .NET 10: CLI commands; Git, gh, az, .NET 10 to GitHub / DevOps / Entra: identity reads; GitHub / DevOps / Entra to Disposable run scopes: explicit account scope; Disposable run scopes to Local ownership journal: exact owned IDs; PowerShell 7 host to Local API test host: build and test; Local API test host to Local ownership journal: redacted evidence</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto-start-reverse"><path d="M0,0 L0,8 L8,4 z" fill="#0369a1"/></marker></defs>
<rect width="760" height="650" rx="16" fill="#f0f9ff"/>
