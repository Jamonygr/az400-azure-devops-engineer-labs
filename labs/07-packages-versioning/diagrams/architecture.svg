<text x="298" y="378" fill="#0f172a" font-family="sans-serif" font-size="18">Dependency lock</text>
<text x="298" y="400" fill="#0f172a" font-family="sans-serif" font-size="18">file</text>
</g>
<g data-node="registry"><rect x="20" y="330" width="190" height="120" rx="11" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/><text x="33" y="353" fill="#0284c7" font-family="sans-serif" font-size="12" font-weight="bold">PLATFORM</text>
<text x="33" y="378" fill="#0f172a" font-family="sans-serif" font-size="18">GitHub / Artifacts</text>
<text x="33" y="400" fill="#0f172a" font-family="sans-serif" font-size="18">contract</text>
</g>
<text x="22" y="480" fill="#0c4a6e" font-family="sans-serif" font-weight="bold" font-size="16">Relationships</text>
<text x="22" y="507" fill="#0f172a" font-family="sans-serif" font-size="14.5">1. SemVer build input</text>
<text x="392" y="507" fill="#0f172a" font-family="sans-serif" font-size="14.5">2. immutable nupkg</text>
<text x="22" y="545" fill="#0f172a" font-family="sans-serif" font-size="14.5">3. pinned package version</text>
<text x="392" y="545" fill="#0f172a" font-family="sans-serif" font-size="14.5">4. resolved dependency graph</text>
<text x="22" y="583" fill="#0f172a" font-family="sans-serif" font-size="14.5">5. separate approved publish</text>
<text x="22" y="636" fill="#334155" font-family="sans-serif" font-size="12">Solid: core relationship · Dashed: separately gated integration · See walkthrough for verification limits.</text>
</svg>
