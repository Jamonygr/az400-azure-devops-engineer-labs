<svg xmlns="http://www.w3.org/2000/svg" width="760" height="650" viewBox="0 0 760 650" role="img" aria-labelledby="title desc"><title id="title">Lab 07: Versioned NuGet package production and consumption</title><desc id="desc">dotnet pack builds immutable stable and prerelease nupkg files into a local feed. The consumer restores an explicit version and records its dependency graph in a lock file. GitHub Packages and Azure Artifacts are publication contracts reviewed separately; the core does not upload a package or grant registry credentials. Relationships: Versioned .NET library to dotnet pack: SemVer build input; dotnet pack to Local NuGet feed: immutable nupkg; Local NuGet feed to Consumer project: pinned package version; Consumer project to Dependency lock file: resolved dependency graph; Local NuGet feed to GitHub / Artifacts contract: separate approved publish</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto-start-reverse"><path d="M0,0 L0,8 L8,4 z" fill="#0369a1"/></marker></defs>
<rect width="760" height="650" rx="16" fill="#f0f9ff"/>
<text x="22" y="30" fill="#0c4a6e" font-size="19" font-weight="bold" font-family="sans-serif">Lab 07: Versioned NuGet package production and consumption</text>
<path d="M210,160.0 H285" fill="none" stroke="#0369a1" stroke-width="2" marker-end="url(#arrow)" data-from="library" data-to="pack"><title>SemVer build input</title></path>
<circle cx="247.5" cy="160.0" r="11" fill="#ffffff" stroke="#0369a1" stroke-width="1.5"/><text x="247.5" y="164.5" text-anchor="middle" fill="#075985" font-size="13" font-weight="bold" font-family="sans-serif">1</text>
<path d="M475,160.0 H550" fill="none" stroke="#0369a1" stroke-width="2" marker-end="url(#arrow)" data-from="pack" data-to="feed"><title>immutable nupkg</title></path>
<circle cx="512.5" cy="160.0" r="11" fill="#ffffff" stroke="#0369a1" stroke-width="1.5"/><text x="512.5" y="164.5" text-anchor="middle" fill="#075985" font-size="13" font-weight="bold" font-family="sans-serif">2</text>
<path d="M645.0,220 V330" fill="none" stroke="#0369a1" stroke-width="2" marker-end="url(#arrow)" data-from="feed" data-to="consumer"><title>pinned package version</title></path>
<circle cx="645.0" cy="275.0" r="11" fill="#ffffff" stroke="#0369a1" stroke-width="1.5"/><text x="645.0" y="279.5" text-anchor="middle" fill="#075985" font-size="13" font-weight="bold" font-family="sans-serif">3</text>
<path d="M550,390.0 H475" fill="none" stroke="#0369a1" stroke-width="2" marker-end="url(#arrow)" data-from="consumer" data-to="lock"><title>resolved dependency graph</title></path>
<circle cx="512.5" cy="390.0" r="11" fill="#ffffff" stroke="#0369a1" stroke-width="1.5"/><text x="512.5" y="394.5" text-anchor="middle" fill="#075985" font-size="13" font-weight="bold" font-family="sans-serif">4</text>
<path d="M645.0,220 V275.0 H115.0 V330" fill="none" stroke="#0369a1" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)" data-from="feed" data-to="registry"><title>separate approved publish</title></path>
<circle cx="380.0" cy="275.0" r="11" fill="#ffffff" stroke="#0369a1" stroke-width="1.5"/><text x="380.0" y="279.5" text-anchor="middle" fill="#075985" font-size="13" font-weight="bold" font-family="sans-serif">5</text>
<g data-node="library"><rect x="20" y="100" width="190" height="120" rx="11" fill="#ffffff" stroke="#0284c7" stroke-width="2"/><text x="33" y="123" fill="#0284c7" font-family="sans-serif" font-size="12" font-weight="bold">CODE</text>
<text x="33" y="148" fill="#0f172a" font-family="sans-serif" font-size="18">Versioned .NET</text>
<text x="33" y="170" fill="#0f172a" font-family="sans-serif" font-size="18">library</text>
</g>
<g data-node="pack"><rect x="285" y="100" width="190" height="120" rx="11" fill="#ffffff" stroke="#0284c7" stroke-width="2"/><text x="298" y="123" fill="#0284c7" font-family="sans-serif" font-size="12" font-weight="bold">CODE</text>
<text x="298" y="148" fill="#0f172a" font-family="sans-serif" font-size="18">dotnet pack</text>
</g>
<g data-node="feed"><rect x="550" y="100" width="190" height="120" rx="11" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/><text x="563" y="123" fill="#0284c7" font-family="sans-serif" font-size="12" font-weight="bold">PLATFORM</text>
<text x="563" y="148" fill="#0f172a" font-family="sans-serif" font-size="18">Local NuGet feed</text>
</g>
<g data-node="consumer"><rect x="550" y="330" width="190" height="120" rx="11" fill="#ffffff" stroke="#0284c7" stroke-width="2"/><text x="563" y="353" fill="#0284c7" font-family="sans-serif" font-size="12" font-weight="bold">CODE</text>
<text x="563" y="378" fill="#0f172a" font-family="sans-serif" font-size="18">Consumer project</text>
