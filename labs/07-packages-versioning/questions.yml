  "questions": [
    {
      "id": "L07-Q001",
      "checkpointId": "CP5",
      "objectiveIds": [
        "D3.1.1"
      ],
      "difficulty": "foundational",
      "question": "An Azure DevOps team needs a private package feed plus controlled consumption of public dependencies. Which service capability fits?",
      "options": [
        {
          "key": "A",
          "text": "A wiki page linking directly to whichever public version is newest",
          "rationale": "Documentation links do not establish a controlled private feed or reproducible resolution."
        },
        {
          "key": "B",
          "text": "Azure Artifacts with configured upstream sources",
          "rationale": "A feed can host local packages and save supported upstream dependencies through one governed endpoint."
        },
        {
          "key": "C",
          "text": "An Azure Repos branch containing only package names",
          "rationale": "A source branch is not the package registry and upstream-consumption mechanism."
        },
        {
          "key": "D",
          "text": "A pipeline run display number without a feed",
          "rationale": "A human-readable run label does not provide package distribution or access controls."
        }
      ],
      "correctAnswers": [
        "B"
      ],
      "explanation": "Documentation links do not establish a controlled private feed or reproducible resolution. A feed can host local packages and save supported upstream dependencies through one governed endpoint. A source branch is not the package registry and upstream-consumption mechanism. A human-readable run label does not provide package distribution or access controls.",
      "sourceIds": [
        "S1",
        "S2"
      ]
    },
    {
      "id": "L07-Q002",
      "checkpointId": "CP5",
      "objectiveIds": [
        "D3.1.2"
      ],
      "difficulty": "foundational",
      "question": "A package is published successfully but has not passed release validation. What prevents normal release consumers from treating it as approved?",
      "options": [
        {
          "key": "A",
          "text": "Rebuild the package with the same version after each test",
          "rationale": "Rebuilding can change the deliverable and conflicts with immutable package-version expectations."
        },
        {
          "key": "B",
          "text": "Ask consumers to infer readiness from package upload time",
          "rationale": "Chronology is not a release-quality decision."
        },
        {
          "key": "C",
          "text": "Expose validated versions through an appropriate release view",
          "rationale": "Feed views can distinguish availability from deliberate lifecycle promotion."
        },
        {
          "key": "D",
          "text": "Rename the build's display label to approved",
          "rationale": "A human label does not necessarily change which versions consumers can access."
        }
      ],
      "correctAnswers": [
        "C"
      ],
      "explanation": "Rebuilding can change the deliverable and conflicts with immutable package-version expectations. Chronology is not a release-quality decision. Feed views can distinguish availability from deliberate lifecycle promotion. A human label does not necessarily change which versions consumers can access.",
      "sourceIds": [
        "S1"
      ]
    },
    {
      "id": "L07-Q003",
      "checkpointId": "CP5",
      "objectiveIds": [
        "D3.1.2"
      ],
      "difficulty": "foundational",
      "question": "The public registry is temporarily unavailable. Which dependency can an upstream-enabled feed potentially continue to serve?",
      "options": [
        {
          "key": "A",
          "text": "A version known only from a release-note title",
          "rationale": "A textual reference is not the package content."
        },
        {
          "key": "B",
          "text": "A dependency excluded from every allowed source and absent from the feed",
          "rationale": "No configured available content path exists for that version."
        },
        {
          "key": "C",
          "text": "A required version already saved through that feed",
          "rationale": "A saved package can remain available even when its upstream cannot be reached."
        },
        {
          "key": "D",
          "text": "Any never-requested version that exists only on the offline upstream",
          "rationale": "The feed cannot supply bytes it has never saved or otherwise received."
        }
      ],
      "correctAnswers": [
        "C"
      ],
      "explanation": "A textual reference is not the package content. No configured available content path exists for that version. A saved package can remain available even when its upstream cannot be reached. The feed cannot supply bytes it has never saved or otherwise received.",
      "sourceIds": [
        "S2"
      ]
    },
    {
      "id": "L07-Q004",
      "checkpointId": "CP5",
      "objectiveIds": [
        "D3.1.1"
      ],
      "difficulty": "foundational",
      "question": "What is the benefit of restoring approved upstream packages through a configured feed rather than independently querying public registries every time?",
      "options": [
        {
          "key": "A",
          "text": "The feed guarantees that every upstream package is vulnerability free",
          "rationale": "Caching and distribution do not prove the dependency's security."
        },
        {
          "key": "B",
          "text": "The feed converts every upstream package into source code",
          "rationale": "Package caching does not imply decompilation or source conversion."
        },
        {
          "key": "C",
          "text": "The feed removes the need to define any dependency version",
          "rationale": "A registry path does not replace deliberate version selection."
        },
        {
          "key": "D",
          "text": "The feed can save consumed upstream versions and provide a managed consumption path",
          "rationale": "Supported upstream caching and feed governance reduce dependence on repeated direct public retrieval."
        }
      ],
      "correctAnswers": [
        "D"
      ],
      "explanation": "Caching and distribution do not prove the dependency's security. Package caching does not imply decompilation or source conversion. A registry path does not replace deliberate version selection. Supported upstream caching and feed governance reduce dependence on repeated direct public retrieval.",
      "sourceIds": [
        "S2"
      ]
    },
    {
      "id": "L07-Q005",
      "checkpointId": "CP5",
      "objectiveIds": [
        "D3.1.2"
      ],
      "difficulty": "foundational",
      "question": "What does promotion into a feed view normally represent in this design?",
      "options": [
        {
          "key": "A",
          "text": "A guarantee that the version contains no possible runtime defect",
          "rationale": "A lifecycle label cannot establish universal correctness."
        },
        {
          "key": "B",
          "text": "A requirement to regenerate identical source with different compiler inputs",
          "rationale": "Promotion is intended to avoid treating an unverified rebuild as the tested package."
        },
        {
          "key": "C",
          "text": "Automatic permission for every organization user to administer the feed",
          "rationale": "View promotion does not universally grant registry administration."
        },
        {
          "key": "D",
          "text": "A lifecycle decision to make that existing package version visible through the view",
          "rationale": "Promotion separates package quality stage from the version's compatibility meaning."
        }
      ],
      "correctAnswers": [
        "D"
      ],
      "explanation": "A lifecycle label cannot establish universal correctness. Promotion is intended to avoid treating an unverified rebuild as the tested package. View promotion does not universally grant registry administration. Promotion separates package quality stage from the version's compatibility meaning.",
      "sourceIds": [
        "S1"
      ]
    },
    {
      "id": "L07-Q006",
      "checkpointId": "CP5",
      "objectiveIds": [
        "D3.1.2"
      ],
      "difficulty": "foundational",
      "question": "Why is upstream caching not a substitute for reviewing dependency provenance?",
      "options": [
        {
          "key": "A",
          "text": "Cached packages necessarily lose all version metadata",
          "rationale": "Saving packages does not inherently discard their identity."
        },
        {
          "key": "B",
          "text": "A cache transforms untrusted packages into trusted Microsoft-authored code",
          "rationale": "Distribution through a feed does not change original authorship or risk."
        },
        {
          "key": "C",
          "text": "Upstream caching prevents all dependency-name collisions automatically",
          "rationale": "Source governance and resolution choices still require deliberate design."
        },
        {
          "key": "D",
          "text": "The cache preserves packages rather than proving the publisher and contents are acceptable",
          "rationale": "A consistently available dependency can still be unsafe or unintended."
        }
      ],
      "correctAnswers": [
        "D"
      ],
      "explanation": "Saving packages does not inherently discard their identity. Distribution through a feed does not change original authorship or risk. Source governance and resolution choices still require deliberate design. A consistently available dependency can still be unsafe or unintended.",
      "sourceIds": [
        "S2"
      ],
      "exhibit": {
        "language": "text",
        "code": "Required package: Contoso.Logging 2.1.0\nSaved in feed: yes\nPublic upstream: temporarily unavailable\nPrivate feed: available"
      }
    },
    {
