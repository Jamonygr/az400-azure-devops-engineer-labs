        {
          "key": "C",
          "text": "Rebuild with unpinned dependencies because the source commit is unchanged",
          "rationale": "The same source can produce different inputs or outputs when dependencies vary."
        },
        {
          "key": "D",
          "text": "Delete the first version and reuse its number for the new contents",
          "rationale": "Version reuse undermines identity and is not supported by immutable-version behavior in Azure Artifacts."
        }
