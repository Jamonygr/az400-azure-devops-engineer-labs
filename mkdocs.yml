site_name: AZ-400 Complete Learning Environment
site_description: Command-first Azure DevOps and GitHub labs, assessments, and practical delivery skills
site_url: https://jamonygr.github.io/az400-azure-devops-engineer-labs/
repo_url: https://github.com/Jamonygr/az400-azure-devops-engineer-labs
repo_name: Jamonygr/az400-azure-devops-engineer-labs
edit_uri: edit/main/
docs_dir: .site-docs
site_dir: site
strict: true
theme:
  name: material
  language: en
  font: false
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - toc.follow
    - search.highlight
    - search.suggest
    - content.code.copy
  palette:
    - media: '(prefers-color-scheme: light)'
      scheme: default
      primary: blue
      accent: cyan
      toggle:
        icon: material/brightness-7
        name: Use dark mode
    - media: '(prefers-color-scheme: dark)'
      scheme: slate
      primary: blue
      accent: cyan
      toggle:
        icon: material/brightness-4
        name: Use light mode
nav:
  - Home: index.md
  - Labs:
      - Catalog: labs/README.md
      - Foundation: domains/foundation.md
      - Processes: domains/process.md
      - Source control: domains/source.md
      - Pipelines: domains/pipelines.md
      - Security: domains/security.md
      - Instrumentation: domains/instrumentation.md
      - Capstones: domains/capstone.md
  - Study:
      - Study plan: docs/study-plan.md
      - Objectives: docs/objective-map.md
      - Assessments: docs/assessment-guide.md
      - Question dashboard: docs/question-bank-index.md
      - Sample application: samples/README.md
      - Glossary: docs/glossary.md
  - Run safely:
      - Prerequisites: docs/prerequisites.md
      - Account setup: docs/account-bootstrap.md
      - Configuration: docs/configuration.md
      - Permissions: docs/permissions-matrix.md
      - Cost and cleanup: docs/cost-and-cleanup.md
      - Service changes: docs/service-lifecycle.md
      - Troubleshooting: docs/troubleshooting.md
      - Evidence: docs/evidence-handling.md
      - Validation status: docs/validation-status.md
  - Progress: docs/learner-progress.md
plugins:
  - search:
      lang: en
markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
extra_css:
  - docs/site-assets/progress.css
extra_javascript:
  - docs/site-assets/progress.js
validation:
  nav:
    omitted_files: ignore
  links:
    anchors: warn
copyright: Independent learning material for authorized disposable environments. MIT License.
