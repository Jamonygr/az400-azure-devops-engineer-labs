<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="540" viewBox="0 0 1440 540" role="img" aria-labelledby="title desc">
  <title id="title">AZ-400 Complete Learning Environment</title>
  <desc id="desc">A blue and cyan delivery path connects source, build, test, security, release, and observability. GitHub and Azure DevOps share one learning journey.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#071a35"/><stop offset="1" stop-color="#103f75"/></linearGradient>
    <linearGradient id="line"><stop stop-color="#41d9ef"/><stop offset="1" stop-color="#799dff"/></linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M 40 0 L 0 0 0 40" fill="none" stroke="#a0d7ff" stroke-opacity=".06"/></pattern>
  </defs>
  <rect width="1440" height="540" rx="20" fill="url(#bg)"/>
  <rect width="1440" height="540" rx="20" fill="url(#grid)"/>
  <circle cx="1280" cy="100" r="190" fill="#13bdd3" opacity=".06"/>
  <text x="80" y="100" fill="#70e3ed" font-family="Segoe UI,Arial,sans-serif" font-size="22" letter-spacing="5">GITHUB + AZURE DEVOPS</text>
  <text x="76" y="198" fill="white" font-family="Segoe UI,Arial,sans-serif" font-size="86" font-weight="700">AZ-400</text>
  <text x="80" y="252" fill="#dcecff" font-family="Segoe UI,Arial,sans-serif" font-size="32">Complete Learning Environment</text>
  <text x="82" y="296" fill="#9fc3e9" font-family="Segoe UI,Arial,sans-serif" font-size="20">28 practical labs · 1,250 questions · one connected delivery journey</text>
  <path d="M 130 398 H 1305" stroke="url(#line)" stroke-width="4" fill="none"/>
  <g fill="#12375e" stroke="#61d7ed" stroke-width="2">
    <rect x="80" y="361" width="160" height="74" rx="14"/><rect x="300" y="361" width="160" height="74" rx="14"/>
    <rect x="520" y="361" width="160" height="74" rx="14"/><rect x="740" y="361" width="160" height="74" rx="14"/>
    <rect x="960" y="361" width="160" height="74" rx="14"/><rect x="1180" y="361" width="180" height="74" rx="14"/>
  </g>
  <g fill="white" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="600" text-anchor="middle">
    <text x="160" y="406">Source</text><text x="380" y="406">Build</text><text x="600" y="406">Test</text>
    <text x="820" y="406">Secure</text><text x="1040" y="406">Release</text><text x="1270" y="406">Observe</text>
  </g>
  <text x="80" y="494" fill="#a8c7e8" font-family="Segoe UI,Arial,sans-serif" font-size="18">Command-first practice · .NET 10 · original assessments · architecture diagrams</text>
</svg>
