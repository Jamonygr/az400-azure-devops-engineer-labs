          "expected": "Markdown captures both release sequence and a concrete API contract.",
          "positive": "$d=Get-Content (Join-Path $WorkRoot 'handoff.md') -Raw\n if ($d -notmatch 'flowchart LR' -or $d -notmatch '/health/ready') { throw 'Handoff lacks process/API contract.' }\n",
          "negative": "$d=Get-Content (Join-Path $WorkRoot 'handoff.md') -Raw\n if ($d -match 'password=|client_secret=') { throw 'Sensitive configuration in documentation.' }\n",
          "validate": "$d=Get-Content (Join-Path $WorkRoot 'handoff.md') -Raw\n if ($d -notmatch 'flowchart LR' -or $d -notmatch '/health/ready') { throw 'Handoff lacks process/API contract.' }\n\n$d=Get-Content (Join-Path $WorkRoot 'handoff.md') -Raw\n if ($d -match 'password=|client_secret=') { throw 'Sensitive configuration in documentation.' }\n",
