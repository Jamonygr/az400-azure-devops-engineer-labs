    {
      "id": "02",
      "slug": "02-devops-metrics",
      "title": "Measure flow, quality, security, and delivery",
      "domain": "process",
      "minutes": 120,
      "cost": "none",
      "platforms": [
        "local",
        "github"
      ],
      "objectives": [
        "D1.2.1",
        "D1.2.2",
        "D1.2.3",
        "D1.2.4",
        "D1.2.5",
        "D1.2.6",
        "D1.2.7"
      ],
      "scenario": "The team reports activity counts but cannot explain slow delivery or unstable releases. Derive flow and quality measures from a small transparent dataset.",
      "role": "Engineering lead",
      "outcome": "Measure flow, quality, security, and delivery.",
      "checkpoints": [
        {
          "id": "CP1",
          "title": "Normalize delivery observations",
          "commands": "$events=@(\n [pscustomobject]@{change='a';leadMinutes=120;cycleMinutes=70;recoveryMinutes=0;failed=$false;tests=50;failedTests=0;criticalFindings=0},\n [pscustomobject]@{change='b';leadMinutes=240;cycleMinutes=100;recoveryMinutes=30;failed=$true;tests=60;failedTests=1;criticalFindings=2},\n [pscustomobject]@{change='c';leadMinutes=90;cycleMinutes=40;recoveryMinutes=0;failed=$false;tests=55;failedTests=0;criticalFindings=0})\n $events|ConvertTo-Json|Set-Content (Join-Path $WorkRoot 'observations.json')\n",
          "expected": "Three explicitly fictional observations separate flow, tests, and findings.",
          "positive": "$e=@(Get-Content (Join-Path $WorkRoot 'observations.json') -Raw|ConvertFrom-Json)\n if ($e.Count -ne 3 -or ($e|Measure-Object leadMinutes -Minimum).Minimum -lt 0) { throw 'Invalid observation data.' }\n",
          "negative": "$e=@(Get-Content (Join-Path $WorkRoot 'observations.json') -Raw|ConvertFrom-Json)\n if (@($e|Where-Object { $_.cycleMinutes -gt $_.leadMinutes }).Count) { throw 'Cycle time exceeds lead time.' }\n",
          "validate": "$e=@(Get-Content (Join-Path $WorkRoot 'observations.json') -Raw|ConvertFrom-Json)\n if ($e.Count -ne 3 -or ($e|Measure-Object leadMinutes -Minimum).Minimum -lt 0) { throw 'Invalid observation data.' }\n\n$e=@(Get-Content (Join-Path $WorkRoot 'observations.json') -Raw|ConvertFrom-Json)\n if (@($e|Where-Object { $_.cycleMinutes -gt $_.leadMinutes }).Count) { throw 'Cycle time exceeds lead time.' }\n",
          "evidence": "observations.json marked synthetic.",
          "fix": "Use one time unit and keep observation windows consistent."
        },
        {
          "id": "CP2",
          "title": "Calculate flow and recovery measures",
          "commands": "$e=@(Get-Content (Join-Path $WorkRoot 'observations.json') -Raw|ConvertFrom-Json)\n $m=[ordered]@{meanLeadMinutes=($e|Measure-Object leadMinutes -Average).Average;meanCycleMinutes=($e|Measure-Object cycleMinutes -Average).Average;changeFailureRate=@($e|Where-Object failed).Count/$e.Count;meanRecoveryMinutes=($e|Where-Object failed|Measure-Object recoveryMinutes -Average).Average}\n $m|ConvertTo-Json|Set-Content (Join-Path $WorkRoot 'flow.json')\n",
          "expected": "Mean lead time150min, cycle70min, failure rate1/3, recovery30min.",
          "positive": "$m=Get-Content (Join-Path $WorkRoot 'flow.json') -Raw|ConvertFrom-Json\n if ($m.meanLeadMinutes -ne 150 -or $m.meanRecoveryMinutes -ne 30) { throw 'Flow aggregation incorrect.' }\n",
          "negative": "$m=Get-Content (Join-Path $WorkRoot 'flow.json') -Raw|ConvertFrom-Json\n if ($m.changeFailureRate -lt 0 -or $m.changeFailureRate -gt 1) { throw 'Failure rate outside fraction range.' }\n",
          "validate": "$m=Get-Content (Join-Path $WorkRoot 'flow.json') -Raw|ConvertFrom-Json\n if ($m.meanLeadMinutes -ne 150 -or $m.meanRecoveryMinutes -ne 30) { throw 'Flow aggregation incorrect.' }\n\n$m=Get-Content (Join-Path $WorkRoot 'flow.json') -Raw|ConvertFrom-Json\n if ($m.changeFailureRate -lt 0 -or $m.changeFailureRate -gt 1) { throw 'Failure rate outside fraction range.' }\n",
          "evidence": "flow.json with the denominator and observation window.",
          "fix": "Count failed deployments, not failed unit tests, in the change-failure numerator."
        },
        {
          "id": "CP3",
          "title": "Report testing and security independently",
          "commands": "$e=@(Get-Content (Join-Path $WorkRoot 'observations.json') -Raw|ConvertFrom-Json)\n $q=[ordered]@{tests=($e|Measure-Object tests -Sum).Sum;failedTests=($e|Measure-Object failedTests -Sum).Sum;criticalFindings=($e|Measure-Object criticalFindings -Sum).Sum}\n $q|ConvertTo-Json|Set-Content (Join-Path $WorkRoot 'quality.json')\n",
          "expected": "The quality report records165tests,1failed test,2critical findings.",
          "positive": "$q=Get-Content (Join-Path $WorkRoot 'quality.json') -Raw|ConvertFrom-Json\n if ($q.tests -ne 165 -or $q.failedTests -ne 1 -or $q.criticalFindings -ne 2) { throw 'Quality aggregation mismatch.' }\n",
          "negative": "$q=Get-Content (Join-Path $WorkRoot 'quality.json') -Raw|ConvertFrom-Json\n if ($q.failedTests -gt $q.tests) { throw 'Test failure count exceeds executed tests.' }\n",
          "validate": "$q=Get-Content (Join-Path $WorkRoot 'quality.json') -Raw|ConvertFrom-Json\n if ($q.tests -ne 165 -or $q.failedTests -ne 1 -or $q.criticalFindings -ne 2) { throw 'Quality aggregation mismatch.' }\n\n$q=Get-Content (Join-Path $WorkRoot 'quality.json') -Raw|ConvertFrom-Json\n if ($q.failedTests -gt $q.tests) { throw 'Test failure count exceeds executed tests.' }\n",
          "evidence": "Separate test and security counters, without person rankings.",
          "fix": "Avoid interpreting scan count as vulnerability count; deduplicate by stable alert identity."
        },
        {
          "id": "CP4",
          "title": "Inspect workflow durations from the sandbox",
          "commands": "$runs=gh run list --repo $GhRepo --limit 20 --json databaseId,status,conclusion,createdAt,updatedAt,workflowName\n $runs|Set-Content (Join-Path $WorkRoot 'workflow-runs.json')\n $r=@($runs|ConvertFrom-Json);[pscustomobject]@{observedRuns=$r.Count;completed=@($r|Where-Object status -eq 'completed').Count}\n",
          "expected": "A real run inventory is collected; a new sandbox may correctly contain zero runs.",
