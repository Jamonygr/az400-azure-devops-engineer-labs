        "D1.3.5",
        "D1.3.6"
      ],
      "scenario": "A change is ready for review but operational handoff and external integration ownership are unclear. Generate a reproducible release handoff and a bounded integration proposal.",
      "role": "Release coordinator",
      "outcome": "Publish documentation and configure integrations.",
      "checkpoints": [
        {
          "id": "CP1",
          "title": "Generate release notes from Git history",
          "commands": "git -C $RepoRoot log -10 --pretty=format:'- %h %s' | Set-Content (Join-Path $WorkRoot 'release-notes.md')\n Get-Content (Join-Path $WorkRoot 'release-notes.md')\n",
          "expected": "Recent committed changes become a reproducible release-note draft.",
          "positive": "$n=Get-Content (Join-Path $WorkRoot 'release-notes.md') -Raw\n if ($n -notmatch '[0-9a-f]{7}') { throw 'No commit identities in release notes.' }\n",
          "negative": "$n=Get-Content (Join-Path $WorkRoot 'release-notes.md') -Raw\n if ($n -match '(?i)ghp_[a-z0-9]{20}') { throw 'Credential-like value in release draft.' }\n",
          "validate": "$n=Get-Content (Join-Path $WorkRoot 'release-notes.md') -Raw\n if ($n -notmatch '[0-9a-f]{7}') { throw 'No commit identities in release notes.' }\n\n$n=Get-Content (Join-Path $WorkRoot 'release-notes.md') -Raw\n if ($n -match '(?i)ghp_[a-z0-9]{20}') { throw 'Credential-like value in release draft.' }\n",
