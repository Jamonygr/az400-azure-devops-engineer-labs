name: Offline quality

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  course:
    name: Course, scripts and documentation
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock.txt
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install locked authoring dependencies
        run: python -m pip install -r requirements.lock.txt
      - name: Check authoritative sources and generated files
        run: python tools/check_all.py
      - name: Test progress import, completion and privacy rules
        run: node --test tests/progress.test.cjs
      - name: Check documentation style and spelling
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run lint:md
          npm run spell
      - name: Analyze and test PowerShell contracts
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module Pester -RequiredVersion 5.7.1 -Scope CurrentUser -Force
          Install-Module PSScriptAnalyzer -RequiredVersion 1.25.0 -Scope CurrentUser -Force
          $scripts = @(Get-ChildItem tools,labs -Recurse -File | Where-Object Extension -in '.ps1','.psm1')
          $findings = @($scripts | ForEach-Object { Invoke-ScriptAnalyzer -Path $_.FullName -Severity Warning,Error })
          if ($findings.Count) { $findings | Format-Table -AutoSize; throw 'PowerShell analysis failed.' }
          ./tools/Test-LabCommands.ps1
          $result = Invoke-Pester -Path tests -Output Detailed -PassThru
          if ($result.FailedCount -or $result.FailedContainersCount) { throw 'Lifecycle tests failed.' }
      - name: Build strict searchable documentation
        run: |
          python tools/build_docs_site.py
          python -m mkdocs build --strict --clean
          python tools/build_docs_site.py --check-built-site site

  sample:
    name: Application and container
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Restore pinned packages
        run: dotnet restore samples/DevOps.slnx --locked-mode
      - name: Build and run application tests with coverage
        run: dotnet test samples/DevOps.slnx --configuration Release --no-restore --collect:'XPlat Code Coverage' --settings samples/coverage.runsettings
      - name: Build the non-root container
        run: docker build --file samples/Dockerfile --tag az400-sample:ci .

  artifacts:
    name: Static YAML, Bicep and secret checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install pinned static checkers
        run: |
          curl -fsSL https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz | tar xz -C /tmp actionlint
          curl -fsSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar xz -C /tmp gitleaks
          az bicep install --version v0.48.1
      - name: Check GitHub workflow syntax
        run: |
          /tmp/actionlint -shellcheck= -pyflakes=
          find labs -path '*/artifacts/*' -name '*.yml' -exec grep -l 'runs-on:' {} + | xargs -r /tmp/actionlint -shellcheck= -pyflakes=
      - name: Scan the tracked tree for secrets
        run: /tmp/gitleaks dir . --redact --no-banner
      - name: Compile and lint Bicep offline
        run: |
          find labs -name '*.bicep' -print0 | xargs -0 -r -I{} az bicep lint --file '{}'
          find labs -name '*.bicep' -print0 | xargs -0 -r -I{} az bicep build --file '{}' --outdir /tmp
