name: Offline quality

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  course:
    name: Course, scripts and documentation
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock.txt
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Install locked authoring dependencies
        run: python -m pip install -r requirements.lock.txt
      - name: Check authoritative sources and generated files
        run: python tools/check_all.py
      - name: Test staged capstone closure, artifact rejection and preview refresh
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Test progress import, completion and privacy rules
        run: node --test tests/*.test.cjs
      - name: Check documentation style and spelling
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run lint:md
          npm run spell
      - name: Install the scanner used by the local lab sequence
        run: |
          mkdir -p .cache/tools
          curl -fsSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar xz -C .cache/tools gitleaks
          echo "$GITHUB_WORKSPACE/.cache/tools" >> "$GITHUB_PATH"
      - name: Analyze and test PowerShell contracts
        shell: pwsh
        run: |
          az bicep install --version v0.48.1
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module Pester -RequiredVersion 5.7.1 -Scope CurrentUser -Force
          Install-Module PSScriptAnalyzer -RequiredVersion 1.25.0 -Scope CurrentUser -Force
          $scripts = @(Get-ChildItem tools,labs,samples -Recurse -File | Where-Object { $_.Extension -in '.ps1','.psm1' -and $_.FullName -notmatch '/(bin|obj)/' })
          $findings = @($scripts | ForEach-Object { Invoke-ScriptAnalyzer -Path $_.FullName -Severity Warning,Error })
          if ($findings.Count) { $findings | Format-Table -AutoSize; throw 'PowerShell analysis failed.' }
          ./tools/Test-LabCommands.ps1
          $result = Invoke-Pester -Path tests -Output Detailed -PassThru
          if ($result.FailedCount -or $result.FailedContainersCount) { throw 'Lifecycle tests failed.' }
      - name: Build strict searchable documentation
        run: |
          python tools/build_docs_site.py
          python -m mkdocs build --strict --clean
          python tools/build_docs_site.py --check-built-site site

      - name: Install the pinned browser runtime
        env:
          PLAYWRIGHT_BROWSERS_PATH: '0'
        run: npx playwright install --with-deps chromium --only-shell
      - name: Test built documentation in desktop and mobile browsers
        env:
          PLAYWRIGHT_BROWSERS_PATH: '0'
        run: npx playwright test --workers=2

  sample:
    name: Application and container
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Restore pinned packages
        run: dotnet restore samples/DevOps.slnx --locked-mode
      - name: Build and run application tests with coverage
        run: dotnet test samples/DevOps.slnx --configuration Release --no-restore --collect:'XPlat Code Coverage' --settings samples/coverage.runsettings --results-directory .cache/TestResults
      - name: Enforce the documented line coverage threshold
        shell: pwsh
        run: |
          $coverage = @(Get-ChildItem .cache/TestResults -Recurse -Filter coverage.cobertura.xml)
          if ($coverage.Count -ne 1) { throw 'Expected one current coverage report.' }
          ./samples/Test-Coverage.ps1 -CoverageFile $coverage[0].FullName
      - name: Build and verify an immutable application and migration artifact
        shell: pwsh
        env:
          SOURCE_REVISION: ${{ github.sha }}
        run: |
          ./samples/Build-Release.ps1 -Revision $env:SOURCE_REVISION -OutputPath .cache/immutable-release -SkipTests
          python labs/26-capstone-github/artifacts/deployment/scripts/release_artifact.py --platform local --directory .cache/immutable-release --output .cache/immutable-release --expected-revision $env:SOURCE_REVISION
      - name: Restore and test both isolated learner packages
        shell: pwsh
        run: ./tools/Test-CapstonePackages.ps1
      - name: Build the non-root container
        env:
          SOURCE_REVISION: ${{ github.sha }}
        run: docker build --file samples/Dockerfile --build-arg SOURCE_REVISION="$SOURCE_REVISION" --tag az400-sample:ci .
      - name: Run application container and isolated SQL identity tests
        shell: pwsh
        env:
          SOURCE_REVISION: ${{ github.sha }}
        run: ./samples/Test-Containers.ps1 -Application -SqlServer -ExpectedRevision $env:SOURCE_REVISION

  artifacts:
    name: Static YAML, Bicep and secret checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install pinned static checkers
        run: |
          curl -fsSL https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz | tar xz -C /tmp actionlint
          curl -fsSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar xz -C /tmp gitleaks
          az bicep install --version v0.48.1
      - name: Check GitHub workflow syntax
        run: |
          /tmp/actionlint -shellcheck= -pyflakes=
          find labs -path '*/artifacts/*' -name '*.yml' ! -name 'consumer-github.yml' -exec grep -l 'runs-on:' {} + | xargs -r /tmp/actionlint -shellcheck= -pyflakes=
          mkdir -p /tmp/az400-reusable/.github/workflows /tmp/az400-reusable/.git
          cp labs/11-reusable-yaml/artifacts/templates/reusable-dotnet.yml /tmp/az400-reusable/.github/workflows/reusable-dotnet.yml
          cp labs/11-reusable-yaml/artifacts/consumer-github.yml /tmp/az400-reusable/.github/workflows/consumer.yml
          (cd /tmp/az400-reusable && /tmp/actionlint -shellcheck= -pyflakes= .github/workflows/*.yml)
      - name: Scan the tracked tree for secrets
        run: /tmp/gitleaks dir . --redact --no-banner
      - name: Compile and lint Bicep offline
        run: |
          find labs -name '*.bicep' -print0 | xargs -0 -r -I{} az bicep lint --file '{}'
          find labs -name '*.bicep' -print0 | xargs -0 -r -I{} az bicep build --file '{}' --outdir /tmp
